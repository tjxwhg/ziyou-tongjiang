<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 通江文旅</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Draw -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <style>
        body { background: #f0f2f5; font-family: system-ui, sans-serif; }
        .header { background: #1b5e20; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .header .btn-light { color: #1b5e20; font-weight: 600; }
        .container-custom { max-width: 1400px; margin: 20px auto; padding: 0 16px; }
        .tab-content { background: white; padding: 20px; border-radius: 0 0 8px 8px; border: 1px solid #dee2e6; border-top: none; }
        .nav-tabs .nav-link.active { background: #2e7d32; color: white; border-color: #2e7d32; }
        .inline-edit { background: #f8f9fa; border: 1px solid #2e7d32; border-radius: 8px; padding: 15px; margin-top: 10px; }
        .hidden { display: none !important; }

        /* 登录样式 */
        #login-page { max-width: 400px; margin: 80px auto; }
        #login-page .card { padding: 24px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }

        .data-quality-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .quality-l1 { background: #c8e6c9; color: #1b5e20; }
        .quality-l2 { background: #fff9c4; color: #f57f17; }
        .quality-l3 { background: #ffcdd2; color: #c62828; }

        /* 模态框内节点列表 */
        .node-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }
        .node-item .node-info { flex: 1; }
        .node-item .node-actions { display: flex; gap: 6px; }

        /* 交通耗时表格 */
        .transport-table td { text-align: center; }
        .transport-table input { width: 70px; text-align: center; border: 1px solid #ccc; border-radius: 4px; padding: 2px 4px; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 8px; text-align: center; }
        }
    </style>
</head>
<body>

<!-- ===== 登录页面 ===== -->
<div id="login-page">
    <div class="card">
        <h2 class="text-center text-success"><i class="fas fa-leaf"></i> 管理登录</h2>
        <p class="text-secondary text-center">使用 Supabase 账号登录</p>
        <div class="mb-3">
            <label class="form-label">邮箱</label>
            <input id="email" class="form-control" placeholder="admin@tongjiang.com" value="admin@tongjiang.com">
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input id="password" type="password" class="form-control" placeholder="密码">
        </div>
        <button class="btn btn-success w-100" id="loginBtn"><i class="fas fa-sign-in-alt"></i> 登录</button>
        <p id="login-msg" class="text-danger mt-2"></p>
        <hr>
        <p class="text-secondary small text-center">提示：若无法登录，请在 Supabase 中创建用户并确认邮箱。</p>
    </div>
</div>

<!-- ===== 主界面 ===== -->
<div id="main" class="hidden">
    <div class="header">
        <h2><i class="fas fa-leaf"></i> 通江文旅超管后台</h2>
        <div>
            <button class="btn btn-light me-2" onclick="window.refreshData()"><i class="fas fa-sync"></i> 刷新</button>
            <button class="btn btn-light" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 退出</button>
        </div>
    </div>

    <div class="container-custom">
        <ul class="nav nav-tabs" id="adminTabs">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-poi">📍 景点POI</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-scenic">🏞️ 景区管理</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-routes">🗺️ 路线</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-transport">🚗 交通耗时</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-merchants">🏪 商户账号</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-feedbacks">💬 留言反馈</a></li>
        </ul>
        <div class="tab-content">
            <!-- ===== POI 管理 ===== -->
            <div class="tab-pane active" id="tab-poi">
                <button class="btn btn-success mb-3" onclick="window.showPoiModal()"><i class="fas fa-plus"></i> 新增景点</button>
                <div id="poi-list"></div>
            </div>

            <!-- ===== 景区管理 ===== -->
            <div class="tab-pane" id="tab-scenic">
                <button class="btn btn-success mb-3" onclick="window.showScenicModal()"><i class="fas fa-plus"></i> 新增景区</button>
                <div id="scenic-list"></div>
            </div>

            <!-- ===== 路线管理 ===== -->
            <div class="tab-pane" id="tab-routes">
                <button class="btn btn-success mb-3" onclick="window.showRouteModal()"><i class="fas fa-plus"></i> 新增路线</button>
                <div id="route-list"></div>
            </div>

            <!-- ===== 交通耗时 ===== -->
            <div class="tab-pane" id="tab-transport">
                <h5><i class="fas fa-clock text-success"></i> 景点间交通耗时（分钟）</h5>
                <p class="text-secondary">双击表格单元格编辑耗时，自动保存。</p>
                <div id="transport-editor"></div>
            </div>

            <!-- ===== 商户账号 ===== -->
            <div class="tab-pane" id="tab-merchants">
                <button class="btn btn-success" onclick="window.showMerchantModal()"><i class="fas fa-user-plus"></i> 创建商户账号</button>
                <div id="merchant-list" class="mt-3"></div>
            </div>

            <!-- ===== 留言反馈 ===== -->
            <div class="tab-pane" id="tab-feedbacks">
                <div id="feedback-list"></div>
            </div>
        </div>
    </div>
</div>

<!-- ===== POI 编辑模态框 ===== -->
<div class="modal fade" id="poiModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="poiModalTitle">编辑景点</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-poi-id">
                <div class="row g-2">
                    <div class="col-6"><label class="form-label">名称</label><input id="edit-poi-name" class="form-control"></div>
                    <div class="col-6"><label class="form-label">类别</label>
                        <select id="edit-poi-category" class="form-select">
                            <option value="自然景区">自然景区</option>
                            <option value="红色景区">红色景区</option>
                            <option value="文博场馆">文博场馆</option>
                            <option value="餐饮住宿">餐饮住宿</option>
                            <option value="交通枢纽">交通枢纽</option>
                            <option value="游玩娱乐">游玩娱乐</option>
                            <option value="购物消费">购物消费</option>
                            <option value="公共服务">公共服务</option>
                        </select>
                    </div>
                    <div class="col-6"><label class="form-label">归属景区</label>
                        <select id="edit-poi-parent" class="form-select"><option value="">无</option></select>
                    </div>
                    <div class="col-6"><label class="form-label">游览时长(分钟)</label>
                        <input type="number" id="edit-poi-visit" class="form-control" value="60">
                    </div>
                    <div class="col-6"><label class="form-label">开放时间</label>
                        <input type="time" id="edit-poi-open" class="form-control" value="08:00">
                    </div>
                    <div class="col-6"><label class="form-label">闭馆时间</label>
                        <input type="time" id="edit-poi-close" class="form-control" value="18:00">
                    </div>
                    <div class="col-6"><label class="form-label">纬度</label>
                        <input type="number" step="any" id="edit-poi-lat" class="form-control">
                    </div>
                    <div class="col-6"><label class="form-label">经度</label>
                        <input type="number" step="any" id="edit-poi-lng" class="form-control">
                    </div>
                    <div class="col-12"><label class="form-label">简介</label>
                        <textarea id="edit-poi-desc" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="col-12"><label class="form-label">语音文本</label>
                        <textarea id="edit-poi-voice-text" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="col-12"><label class="form-label">MP3文件</label>
                        <input type="file" accept="audio/*" id="edit-poi-voice-file" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">数据等级</label>
                        <select id="edit-poi-level" class="form-select">
                            <option value="L1">L1 - 完整数据（含节点、路线、交通）</option>
                            <option value="L2">L2 - 有内部节点</option>
                            <option value="L3">L3 - 基础信息</option>
                        </select>
                        <small class="text-secondary">自动根据节点数量计算，也可手动调整</small>
                    </div>
                </div>
                <hr>
                <h6>内部节点（核心景点/一般景点）</h6>
                <div id="edit-poi-nodes-list"></div>
                <button class="btn btn-secondary btn-sm mt-2" onclick="window.addPoiNode()"><i class="fas fa-plus"></i> 添加节点</button>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-success" onclick="window.savePoi()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 景区编辑模态框 ===== -->
<div class="modal fade" id="scenicModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="scenicModalTitle">编辑景区</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-scenic-id">
                <div class="mb-2"><label class="form-label">景区名称</label><input id="edit-scenic-name" class="form-control"></div>
                <div class="mb-2"><label class="form-label">所属区域</label><input id="edit-scenic-area" class="form-control"></div>
                <div class="row g-2">
                    <div class="col-6"><label class="form-label">纬度</label><input type="number" step="any" id="edit-scenic-lat" class="form-control"></div>
                    <div class="col-6"><label class="form-label">经度</label><input type="number" step="any" id="edit-scenic-lng" class="form-control"></div>
                </div>
                <div class="mb-2"><label class="form-label">简介</label><textarea id="edit-scenic-desc" class="form-control" rows="2"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-success" onclick="window.saveScenic()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 路线编辑模态框 ===== -->
<div class="modal fade" id="routeModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="routeModalTitle">编辑路线</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-route-id">
                <div class="row g-2">
                    <div class="col-6"><label class="form-label">路线名称</label><input id="edit-route-name" class="form-control"></div>
                    <div class="col-6"><label class="form-label">出发时间</label><input type="time" id="edit-route-start" class="form-control" value="08:30"></div>
                    <div class="col-12"><label class="form-label">交通方式</label><input id="edit-route-transport" class="form-control" placeholder="自驾/大巴"></div>
                </div>
                <hr>
                <h6>路线节点（按顺序）</h6>
                <div id="edit-route-nodes-list"></div>
                <button class="btn btn-secondary btn-sm mt-2" onclick="window.addRouteNode()"><i class="fas fa-plus"></i> 添加节点</button>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-success" onclick="window.saveRoute()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 商户创建模态框 ===== -->
<div class="modal fade" id="merchantModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">创建商户账号</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2"><label class="form-label">邮箱</label><input id="new-merchant-email" class="form-control"></div>
                <div class="mb-2"><label class="form-label">密码</label><input type="password" id="new-merchant-pwd" class="form-control"></div>
                <div class="mb-2"><label class="form-label">商户名称</label><input id="new-merchant-name" class="form-control"></div>
                <div class="mb-2"><label class="form-label">关联POI ID</label><input id="new-merchant-poi" class="form-control" placeholder="可选"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-success" onclick="window.saveMerchant()">创建</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 依赖库 ===== -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="importmap">
{
    "imports": {
        "./config.js": "./js/config.js",
        "./api.js": "./js/api.js",
        "./auth.js": "./js/auth.js",
        "./admin.js": "./js/admin.js"
    }
}
</script>

<script type="module">
import { signIn, signOut, getCurrentUser, onAuthStateChange } from './js/auth.js';
import {
    initAdminUI,
    showPoiModal, savePoi, deletePoi, addPoiNode,
    showScenicModal, saveScenic, deleteScenic,
    showRouteModal, saveRoute, deleteRoute, addRouteNode,
    loadTransportMatrix, saveTransportCell,
    showMerchantModal, saveMerchant, deleteMerchant,
    loadFeedbacks, replyFeedback, deleteFeedback
} from './js/admin.js';

// 登录
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const loginMsg = document.getElementById('login-msg');

loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const pwd = document.getElementById('password').value;
    try {
        await signIn(email, pwd);
        loginMsg.textContent = '';
    } catch (e) {
        loginMsg.textContent = '登录失败：' + e.message;
    }
});

logoutBtn.addEventListener('click', async () => {
    await signOut();
});

onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN') {
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('main').classList.remove('hidden');
        initAdminUI();
    } else {
        document.getElementById('login-page').classList.remove('hidden');
        document.getElementById('main').classList.add('hidden');
    }
});

(async () => {
    const user = await getCurrentUser();
    if (user) {
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('main').classList.remove('hidden');
        initAdminUI();
    }
})();

// 暴露全局函数供 HTML onclick 调用
window.refreshData = initAdminUI;
window.showPoiModal = showPoiModal;
window.savePoi = savePoi;
window.deletePoi = deletePoi;
window.addPoiNode = addPoiNode;
window.showScenicModal = showScenicModal;
window.saveScenic = saveScenic;
window.deleteScenic = deleteScenic;
window.showRouteModal = showRouteModal;
window.saveRoute = saveRoute;
window.deleteRoute = deleteRoute;
window.addRouteNode = addRouteNode;
window.saveTransportCell = saveTransportCell;
window.showMerchantModal = showMerchantModal;
window.saveMerchant = saveMerchant;
window.deleteMerchant = deleteMerchant;
window.replyFeedback = replyFeedback;
window.deleteFeedback = deleteFeedback;
</script>
</body>
</html>
