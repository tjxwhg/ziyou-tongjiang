<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 通江文旅</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .header { background: #1b5e20; color: white; padding: 12px 20px; }
    .container-custom { max-width: 1200px; margin: 20px auto; }
    .tab-content { background: white; padding: 20px; border-radius: 0 0 8px 8px; border: 1px solid #dee2e6; border-top: none; }
    .nav-tabs .nav-link.active { background: #2e7d32; color: white; border-color: #2e7d32; }
    .category-group { margin-bottom: 15px; }
    .category-title { background: #e9f5ea; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .sub-poi-card { margin-left: 20px; border-left: 3px solid #2e7d32; padding-left: 12px; }
    .inline-edit { background: #f8f9fa; border: 1px solid #2e7d32; border-radius: 8px; padding: 15px; margin-top: 10px; }
    .transport-group { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; }
    .transport-header { background: #f8f9fa; padding: 10px; cursor: pointer; display: flex; justify-content: space-between; }
    .transport-list { padding: 10px; background: white; }
    .transport-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
    .save-status { font-size: 12px; color: #2e7d32; margin-left: 8px; }
  </style>
</head>
<body>

<!-- 登录页面 -->
<div id="login-page" class="container-custom" style="max-width:400px; margin-top:80px;">
  <div class="card p-4">
    <h2 class="text-center">管理员登录</h2>
    <div class="mb-3"><input id="email" class="form-control" placeholder="邮箱"></div>
    <div class="mb-3"><input id="password" type="password" class="form-control" placeholder="密码"></div>
    <button class="btn btn-success w-100" onclick="login()">登录</button>
    <p id="login-msg" class="text-danger mt-2"></p>
  </div>
</div>

<!-- 主界面 -->
<div id="main" class="hidden">
  <div class="header d-flex justify-content-between align-items-center">
    <h2>通江文旅超管后台</h2>
    <button class="btn btn-light" onclick="logout()">退出</button>
  </div>

  <div class="container-custom">
    <!-- Tabs -->
    <ul class="nav nav-tabs" id="adminTabs">
      <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-poi">📍 景点POI</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-routes">🗺️ 路线</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-transport">🚗 交通耗时</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-merchants">🏪 商户账号</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-feedbacks">💬 留言反馈</a></li>
    </ul>
    <div class="tab-content">
      <!-- POI -->
      <div class="tab-pane active" id="tab-poi">
        <button class="btn btn-success mb-3" onclick="toggleAddPoiForm()">+ 新增主景区POI</button>
        <div id="add-poi-form" class="inline-edit hidden">
          <h4>新增POI</h4>
          <div class="row">
            <div class="col-md-6"><label class="form-label">名称</label><input id="new-poi-name" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">类别</label><div id="new-poi-categories" class="d-flex flex-wrap gap-2"></div></div>
            <div class="col-md-6"><label class="form-label">归属主景区</label><select id="new-poi-parent" class="form-select"><option value="">无（作为主景区）</option></select></div>
            <div class="col-md-6"><label class="form-label">游览时长 (分钟)</label><input type="number" id="new-poi-visit" class="form-control" value="60"></div>
            <div class="col-md-6"><label class="form-label">纬度</label><input type="number" step="any" id="new-poi-lat" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">经度</label><input type="number" step="any" id="new-poi-lng" class="form-control"></div>
            <div class="col-12"><label class="form-label">简介</label><textarea id="new-poi-desc" rows="2" class="form-control"></textarea></div>
            <div class="col-12"><label class="form-label">语音文本</label><textarea id="new-poi-voice-text" rows="2" class="form-control"></textarea></div>
            <div class="col-12"><label class="form-label">MP3语音文件</label><input type="file" accept="audio/*" id="new-poi-voice" class="form-control"></div>
          </div>
          <button class="btn btn-success mt-2" onclick="saveNewPoi()">保存</button>
          <button class="btn btn-secondary mt-2" onclick="toggleAddPoiForm()">取消</button>
        </div>
        <div id="poi-list"></div>
      </div>

      <!-- 路线 -->
      <div class="tab-pane" id="tab-routes">
        <button class="btn btn-success mb-3" onclick="toggleRouteForm()">+ 新增路线</button>
        <div id="route-form" class="inline-edit hidden">
          <h4 id="route-form-title">新增路线</h4>
          <input type="hidden" id="edit-route-id">
          <div class="row">
            <div class="col-md-4"><label class="form-label">路线名称</label><input id="route-name" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">出发时间</label><input type="time" id="route-start-time" class="form-control" value="08:30"></div>
            <div class="col-md-4"><label class="form-label">交通方式</label><input id="route-transport" class="form-control" placeholder="如 自驾/大巴"></div>
          </div>
          <h5 class="mt-3">路线节点</h5>
          <div id="route-node-selects"></div>
          <button class="btn btn-secondary btn-sm" onclick="addRouteNode()">+ 添加节点</button>
          <button class="btn btn-success mt-2" onclick="saveRoute()">保存路线</button>
          <button class="btn btn-secondary mt-2" onclick="toggleRouteForm()">取消</button>
        </div>
        <div id="route-list" class="mt-3"></div>
      </div>

      <!-- 交通耗时 -->
      <div class="tab-pane" id="tab-transport">
        <h3>景点间交通耗时（分钟）</h3>
        <p class="text-secondary">点击景点展开，修改耗时后自动保存。可移除不需要的点位。</p>
        <button class="btn btn-success" onclick="addTransportPoi()">+ 添加景点</button>
        <div id="transport-editor" class="mt-3"></div>
      </div>

      <!-- 商户账号 -->
      <div class="tab-pane" id="tab-merchants">
        <button class="btn btn-success" onclick="createMerchant()">创建商户账号</button>
        <p class="text-secondary mt-2">创建后商户即可登录，业务信息由商户自行维护。</p>
      </div>

      <!-- 留言反馈 -->
      <div class="tab-pane" id="tab-feedbacks">
        <div id="feedback-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- 依赖 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="importmap">
{
  "imports": {
    "./config.js": "./config.js",
    "./api.js": "./api.js",
    "./auth.js": "./auth.js",
    "./utils.js": "./utils.js",
    "./admin.js": "./admin.js"
  }
}
</script>

<script type="module">
  import { getCurrentUser, signIn, signOut, onAuthStateChange } from './auth.js';
  import { loadAllPois, addPoi, editPoi, removePoi, fetchAllFeedbacks, replyToFeedback, removeFeedback, createMerchantAccount } from './admin.js';
  import { POI_CATEGORIES } from './config.js';

  // 暴露全局函数供HTML onclick调用
  window.login = async () => {
    const email = document.getElementById('email').value;
    const pwd = document.getElementById('password').value;
    try {
      await signIn(email, pwd);
    } catch(e) {
      document.getElementById('login-msg').innerText = '登录失败：'+e.message;
    }
  };
  window.logout = async () => { await signOut(); };

  window.toggleAddPoiForm = () => { document.getElementById('add-poi-form').classList.toggle('hidden'); };
  window.toggleRouteForm = () => { document.getElementById('route-form').classList.toggle('hidden'); };
  window.addRouteNode = () => { /* 调用admin的addRouteNode */ };
  window.saveRoute = () => { /* 调用admin的saveRoute */ };
  window.addTransportPoi = () => { /* 调用admin的addTransportPoi */ };
  window.createMerchant = () => { /* 调用admin的createMerchantAccount */ };

  // 其余函数类似……

  // 初始化
  onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN') {
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      // 加载数据
      loadAllPois().then(renderPOIs);
    } else {
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('main').classList.add('hidden');
    }
  });

  // 检查已有会话
  (async () => {
    const user = await getCurrentUser();
    if (user) {
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      loadAllPois().then(renderPOIs);
    }
  })();

  // 渲染POI、路线等函数...
</script>
</body>
</html>
