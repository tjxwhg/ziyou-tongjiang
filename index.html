<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智游通江 - 智能行程规划</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ... 样式与之前相同，此处省略以缩短回答，但实际部署时需保留完整样式 ... */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: system-ui, sans-serif; height:100vh; overflow:hidden; background:#f0f2f5; }
        .hidden { display:none !important; }
        #map { height:100vh; width:100vw; z-index:1; }
        .top-bar { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:1500; display:flex; align-items:center; gap:16px; background:rgba(255,255,255,0.92); padding:6px 20px; border-radius:30px; box-shadow:0 4px 20px rgba(0,0,0,0.12); backdrop-filter:blur(8px); }
        .top-bar .brand { font-weight:700; color:#1b5e20; font-size:20px; display:flex; align-items:center; gap:8px; cursor:pointer; }
        .category-trigger-area { position:fixed; top:0; left:0; right:0; height:70px; z-index:1599; pointer-events:none; }
        .category-trigger-area:hover .category-bar, .category-bar:hover { top:0 !important; }
        .category-bar { position:fixed; top:-70px; left:0; right:0; z-index:1600; background:rgba(255,255,255,0.97); box-shadow:0 4px 20px rgba(0,0,0,0.1); transition:top 0.4s cubic-bezier(0.4,0,0.2,1); display:flex; flex-wrap:wrap; padding:10px 20px; gap:8px; border-bottom:1px solid #e8f5e9; backdrop-filter:blur(8px); pointer-events:auto; }
        .category-bar .cat-btn { padding:6px 16px; border-radius:20px; border:1px solid #e0e0e0; background:white; font-size:13px; cursor:pointer; transition:all 0.2s; white-space:nowrap; color:#333; }
        .category-bar .cat-btn:hover { background:#e8f5e9; border-color:#2e7d32; }
        .category-bar .cat-btn.active { background:#2e7d32; color:white; border-color:#2e7d32; }
        .bottom-nav { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:1500; display:flex; gap:6px; background:rgba(255,255,255,0.95); padding:8px 16px; border-radius:40px; box-shadow:0 4px 24px rgba(0,0,0,0.18); backdrop-filter:blur(8px); flex-wrap:nowrap; align-items:center; max-width:95%; }
        .bottom-nav .nav-btn { padding:8px 16px; border:none; border-radius:24px; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:6px; background:transparent; color:#555; white-space:nowrap; }
        .bottom-nav .nav-btn:hover { background:#e8f5e9; color:#1b5e20; }
        .bottom-nav .nav-btn.primary { background:#1b5e20; color:white; }
        .bottom-nav .nav-btn.primary:hover { background:#2e7d32; }
        .float-btn { position:fixed; z-index:1500; background:white; border-radius:50%; width:48px; height:48px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(0,0,0,0.25); cursor:pointer; font-size:20px; border:none; transition:all 0.2s; }
        .float-btn:hover { transform:scale(1.08); }
        .locate-btn { bottom:110px; right:20px; }
        .voice-btn { bottom:170px; right:20px; }
        .panel { position:fixed; top:0; left:0; right:0; bottom:0; background:white; z-index:2000; transform:translateY(100%); transition:transform 0.35s cubic-bezier(0.4,0,0.2,1); overflow-y:auto; display:flex; flex-direction:column; }
        .panel.active { transform:translateY(0); }
        .panel-header { padding:16px 20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; background:white; position:sticky; top:0; z-index:10; min-height:64px; }
        .panel-header h2 { font-size:18px; font-weight:700; margin:0; color:#1b5e20; }
        .panel-header .close-btn { background:none; border:none; font-size:24px; cursor:pointer; color:#666; padding:4px 8px; border-radius:8px; transition:0.2s; }
        .panel-header .close-btn:hover { background:#f5f5f5; }
        .panel-body { flex:1; padding:16px 20px; overflow-y:auto; padding-bottom:30px; }
        .card-modern { background:white; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); border:1px solid #f0f0f0; transition:0.2s; }
        .card-modern:hover { box-shadow:0 4px 16px rgba(0,0,0,0.1); }
        .card-modern .card-title { font-weight:600; font-size:16px; margin-bottom:6px; color:#1b5e20; }
        .card-modern .card-sub { font-size:13px; color:#888; }
        .solution-compare { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin:16px 0; }
        .solution-card { background:white; border-radius:16px; padding:20px; border:2px solid #e8f5e9; transition:all 0.3s; cursor:pointer; }
        .solution-card:hover { border-color:#1b5e20; transform:translateY(-4px); }
        .solution-card.selected { border-color:#1b5e20; background:#f1f8e9; }
        .solution-card .badge-style { display:inline-block; padding:4px 14px; border-radius:20px; font-size:12px; font-weight:600; margin-bottom:8px; }
        .badge-compact { background:#fff3e0; color:#e65100; }
        .badge-relaxed { background:#e3f2fd; color:#0d47a1; }
        .badge-indepth { background:#fce4ec; color:#880e4f; }
        .solution-card .stat-row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; border-bottom:1px solid #f5f5f5; }
        .solution-card .stat-row:last-child { border-bottom:none; }
        .progress-bar-custom { height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; margin:12px 0; }
        .progress-bar-custom .fill { height:100%; background:linear-gradient(90deg,#2e7d32,#66bb6a); border-radius:3px; transition:width 0.5s ease; }
        .pref-tag { display:inline-block; padding:4px 14px; border-radius:20px; background:#e8f5e9; color:#1b5e20; font-size:13px; margin:4px; cursor:pointer; transition:0.2s; border:2px solid transparent; }
        .pref-tag:hover { background:#c8e6c9; }
        .pref-tag.active { border-color:#1b5e20; background:#1b5e20; color:white; }
        .day-block { background:#f8f9fa; border-radius:12px; padding:12px 16px; margin-bottom:12px; border-left:4px solid #1b5e20; }
        .day-block .day-title { font-weight:700; color:#1b5e20; margin-bottom:8px; }
        .node-item { display:flex; align-items:flex-start; gap:12px; padding:6px 0; border-bottom:1px dashed #eee; font-size:14px; }
        .node-item:last-child { border-bottom:none; }
        .node-item .node-time { color:#888; font-size:13px; min-width:80px; flex-shrink:0; }
        .node-item .node-icon { width:28px; text-align:center; flex-shrink:0; color:#1b5e20; }
        .poi-select-list { max-height:300px; overflow-y:auto; border:1px solid #e0e0e0; border-radius:8px; padding:8px; }
        .poi-select-item { display:flex; align-items:center; gap:10px; padding:6px 8px; border-bottom:1px solid #f0f0f0; cursor:pointer; }
        .poi-select-item:hover { background:#e8f5e9; }
        .poi-select-item input[type="checkbox"] { width:18px; height:18px; }
        @media (max-width:640px) { .top-bar { padding:4px 14px; } .bottom-nav { flex-wrap:wrap; justify-content:center; } }
        .text-green { color:#1b5e20; }
        .bg-green-light { background:#e8f5e9; }
    </style>
</head>
<body>

<!-- 地图容器 -->
<div id="map"></div>

<!-- 顶部 -->
<div class="top-bar"><span class="brand"><i class="fas fa-leaf"></i> 智游通江</span></div>

<!-- 分类栏（悬停触发） -->
<div class="category-trigger-area">
    <div class="category-bar" id="categoryBar">
        <button class="cat-btn" onclick="window.filterPOI('自然景区')">🏔️ 自然景区</button>
        <button class="cat-btn" onclick="window.filterPOI('人文历史')">📜 人文历史</button>
        <button class="cat-btn" onclick="window.filterPOI('民俗风情')">🎎 民俗风情</button>
        <button class="cat-btn" onclick="window.filterPOI('景观地标')">🗼 景观地标</button>
        <button class="cat-btn" onclick="window.filterPOI('游玩娱乐')">🎢 游玩娱乐</button>
        <button class="cat-btn" onclick="window.filterPOI('购物消费')">🛍️ 购物消费</button>
        <button class="cat-btn" onclick="window.filterPOI('餐饮住宿')">🍽️ 餐饮住宿</button>
        <button class="cat-btn" onclick="window.filterPOI('交通枢纽')">🚌 交通枢纽</button>
        <button class="cat-btn" onclick="window.filterPOI('公共服务')">🏛️ 公共服务</button>
        <button class="cat-btn" onclick="window.clearFilter()">✕ 清除筛选</button>
    </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
    <button class="nav-btn primary" onclick="window.openPanel('planPanel')"><i class="fas fa-wand-magic-sparkles"></i> 智能规划</button>
    <button class="nav-btn" onclick="window.openPanel('myPanel')"><i class="fas fa-user"></i> 我的</button>
    <button class="nav-btn" onclick="window.locateUser()"><i class="fas fa-location-dot"></i> 定位</button>
    <button class="nav-btn" onclick="window.toggleVoice()" id="voiceBtn"><i class="fas fa-volume-high"></i> 语音</button>
</div>

<!-- 浮动按钮 -->
<button class="float-btn locate-btn" onclick="window.locateUser()"><i class="fas fa-crosshairs"></i></button>
<button class="float-btn voice-btn" id="voiceToggleBtn" onclick="window.toggleVoice()"><i class="fas fa-volume-high"></i></button>

<!-- ======================================== -->
<!-- 面板：智能规划 -->
<div class="panel" id="planPanel">
    <div class="panel-header"><h2><i class="fas fa-route text-green"></i> 智能行程规划</h2><button class="close-btn" onclick="window.closePanel('planPanel')">&times;</button></div>
    <div class="panel-body">
        <div id="stepPreferences">
            <!-- 表单内容与之前相同，省略 -->
        </div>
        <div id="stepCompare" class="hidden"><!-- 方案对比 --></div>
        <div id="stepDetail" class="hidden"><!-- 行程详情 --></div>
    </div>
</div>

<!-- 面板：我的 -->
<div class="panel" id="myPanel"><!-- ... --></div>

<!-- 商户详情 -->
<div class="panel" id="merchantDetailPanel"><!-- ... --></div>

<!-- 导航面板 -->
<div class="panel" id="navPanel"><!-- ... --></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="importmap">
{
    "imports": {
        "./config.js": "./js/config.js",
        "./api.js": "./js/api.js",
        "./auth.js": "./js/auth.js",
        "./utils.js": "./js/utils.js",
        "./map.js": "./js/map.js",
        "./trip-planner.js": "./js/trip-planner.js",
        "./trip-executor.js": "./js/trip-executor.js",
        "./user.js": "./js/user.js"
    }
}
</script>

<script type="module">
// ==================== 唯一导入 ====================
import { getPois } from './js/api.js';
import { getCurrentUser, signInAnonymously } from './js/auth.js';
import { initMap, loadPoisToMap, locateUser, setVoiceEnabled, clearFilter } from './js/map.js';
import {
    renderMyTrips,
    renderMyReservations,
    renderFeedbackHistory,
    submitFeedback as submitUserFeedback
} from './js/user.js';
import {
    initPlanPanel,
    generatePlans,
    selectSolution,
    backToPreferences,
    backToCompare,
    saveTripSolution,
    startNavigation,
    endNavigation,
    showTripDetail,
    savePreferences,
    loadPoiListForSelection,
    selectAllPois
} from './js/trip-planner.js';

// ==================== 暴露全局函数（只挂载一次） ====================
window.locateUser = locateUser;
window.clearFilter = clearFilter;
window.filterPOI = (category) => {
    import('./js/map.js').then(m => m.applyFilter(category));
};
window.openPanel = (id) => document.getElementById(id).classList.add('active');
window.closePanel = (id) => document.getElementById(id).classList.remove('active');

window._voiceEnabled = true;
window.toggleVoice = () => {
    window._voiceEnabled = !window._voiceEnabled;
    setVoiceEnabled(window._voiceEnabled);
    const icon = window._voiceEnabled ? 'fa-volume-high' : 'fa-volume-xmark';
    document.querySelector('#voiceBtn i').className = 'fas ' + icon;
    document.querySelector('#voiceToggleBtn i').className = 'fas ' + icon;
};

// 规划相关
window.generatePlans = generatePlans;
window.selectSolution = selectSolution;
window.backToPreferences = backToPreferences;
window.backToCompare = backToCompare;
window.saveTripSolution = saveTripSolution;
window.startNavigation = startNavigation;
window.endNavigation = endNavigation;
window.showTripDetail = showTripDetail;
window.savePreferences = savePreferences;
window.submitFeedback = submitUserFeedback;
window.selectAllPois = selectAllPois;

// ==================== 初始化 ====================
async function init() {
    try {
        // 匿名登录（失败不阻塞）
        try { await signInAnonymously(); console.log('[系统] 匿名登录成功'); }
        catch (e) { console.warn('[系统] 匿名登录失败（不影响地图浏览）:', e.message); }

        initMap('map');
        const pois = await getPois();
        loadPoisToMap(pois);

        const user = await getCurrentUser();
        if (user) {
            const { loadUserPreferences } = await import('./js/user.js');
            await loadUserPreferences(user.id);
        }

        renderMyTrips();
        renderMyReservations();
        renderFeedbackHistory();

        initPlanPanel();
        loadPoiListForSelection(pois);

        locateUser();

        // 分类栏自动隐藏
        const categoryBar = document.getElementById('categoryBar');
        let hideTimer = null;
        const triggerArea = document.querySelector('.category-trigger-area');
        triggerArea.addEventListener('mouseenter', () => {
            if (hideTimer) clearTimeout(hideTimer);
            categoryBar.style.top = '0';
        });
        triggerArea.addEventListener('mouseleave', () => {
            hideTimer = setTimeout(() => { categoryBar.style.top = '-70px'; }, 3000);
        });
        setTimeout(() => { categoryBar.style.top = '-70px'; }, 500);

        console.log('[系统] 初始化完成');
    } catch (e) {
        console.error('[系统] 初始化失败:', e);
        alert('初始化失败：' + e.message);
    }
}
init();
</script>
</body>
</html>
