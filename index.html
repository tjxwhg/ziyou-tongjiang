<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智游通江 - 智能行程规划</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 完整样式（省略，实际与之前一致） */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; background: #f0f2f5; }
        .hidden { display: none !important; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .top-bar {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 12px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1700;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.92);
            padding: 6px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            backdrop-filter: blur(8px);
            height: 44px;
            cursor: pointer;
            white-space: nowrap;
        }
        .top-bar .brand {
            font-weight: 700;
            color: #1b5e20;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        .top-bar .brand i { font-size: 20px; }
        .category-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1600;
            background: rgba(255,255,255,0.98);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-wrap: wrap;
            padding: 12px 16px;
            gap: 8px;
            border-bottom: 1px solid #e8f5e9;
            backdrop-filter: blur(8px);
            pointer-events: none;
            max-height: 70vh;
            overflow-y: auto;
            padding-top: calc(60px + env(safe-area-inset-top, 12px));
        }
        .category-bar.show {
            transform: translateY(0);
            pointer-events: auto;
        }
        .category-bar .cat-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #e0e0e0;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            color: #333;
        }
        .category-bar .cat-btn:hover { background: #e8f5e9; border-color: #2e7d32; }
        .category-bar .cat-btn.active { background: #2e7d32; color: white; border-color: #2e7d32; }
        .bottom-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;
            display: flex;
            gap: 6px;
            background: rgba(255,255,255,0.95);
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            backdrop-filter: blur(8px);
            align-items: center;
            max-width: 95%;
        }
        .bottom-nav .nav-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: #555;
            white-space: nowrap;
        }
        .bottom-nav .nav-btn:hover { background: #e8f5e9; color: #1b5e20; }
        .bottom-nav .nav-btn.primary { background: #1b5e20; color: white; }
        .bottom-nav .nav-btn.primary:hover { background: #2e7d32; }
        .float-btn {
            position: fixed;
            z-index: 1500;
            background: white;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            cursor: pointer;
            font-size: 20px;
            border: none;
            transition: all 0.2s;
        }
        .float-btn:hover { transform: scale(1.08); }
        .locate-btn { bottom: 110px; right: 20px; }
        .voice-btn { bottom: 170px; right: 20px; }
        .panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 2000;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .panel.active { transform: translateY(0); }
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 64px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
        }
        .panel-header h2 { font-size: 18px; font-weight: 700; margin: 0; color: #1b5e20; }
        .panel-header .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; padding: 4px 8px; border-radius: 8px; transition: 0.2s; }
        .panel-body { flex: 1; padding: 16px 20px; overflow-y: auto; padding-bottom: 30px; }
        .card-modern { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
        .card-modern .card-title { font-weight: 600; font-size: 16px; margin-bottom: 6px; color: #1b5e20; }
        .card-modern .card-sub { font-size: 13px; color: #888; }
        .solution-compare { display: flex; flex-direction: column; gap: 20px; margin: 16px 0; }
        .solution-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #e8f5e9;
            transition: all 0.3s;
            cursor: pointer;
        }
        .solution-card:hover { border-color: #1b5e20; transform: translateY(-4px); }
        .solution-card.selected { border-color: #1b5e20; background: #f1f8e9; }
        .solution-card .badge-style { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .badge-compact { background: #fff3e0; color: #e65100; }
        .badge-relaxed { background: #e3f2fd; color: #0d47a1; }
        .badge-indepth { background: #fce4ec; color: #880e4f; }
        .solution-card .stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid #f5f5f5; }
        .solution-card .stat-row:last-child { border-bottom: none; }
        .solution-card .day-detail { margin-top: 12px; border-top: 1px solid #eee; padding-top: 12px; }
        .solution-card .day-detail .day-title { font-weight: 600; color: #1b5e20; margin-bottom: 6px; }
        .solution-card .day-detail .time-line { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; }
        .solution-card .day-detail .time-line .time { color: #888; min-width: 80px; }
        .solution-card .day-detail .time-line .icon { width: 24px; text-align: center; }
        .pref-tag { display: inline-block; padding: 4px 14px; border-radius: 20px; background: #e8f5e9; color: #1b5e20; font-size: 13px; margin: 4px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .pref-tag:hover { background: #c8e6c9; }
        .pref-tag.active { border-color: #1b5e20; background: #1b5e20; color: white; }
        .day-block { background: #f8f9fa; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; border-left: 4px solid #1b5e20; }
        .day-block .day-title { font-weight: 700; color: #1b5e20; margin-bottom: 8px; }
        .node-item { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .node-item .node-time { color: #888; font-size: 13px; min-width: 80px; flex-shrink: 0; }
        .node-item .node-icon { width: 28px; text-align: center; flex-shrink: 0; color: #1b5e20; }
        .poi-select-list { max-height: 300px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; padding: 8px; }
        .poi-select-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .poi-select-item:hover { background: #e8f5e9; }
        .poi-select-item input[type="checkbox"] { width: 18px; height: 18px; }
        .reservation-form { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-top: 10px; }
        .reservation-form .form-group { margin-bottom: 8px; }
        .reservation-form label { font-weight: 500; font-size: 14px; }
        .reservation-form input, .reservation-form select, .reservation-form textarea { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .biz-image-box { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-top: 8px; }
        .biz-image-box img { width: 100%; height: 100%; object-fit: cover; }
        @media (max-width: 640px) {
            .top-bar { top: max(8px, env(safe-area-inset-top, 8px)); padding: 4px 12px; height: 38px; }
            .top-bar .brand { font-size: 15px; }
            .bottom-nav { padding: 6px 12px; gap: 4px; }
            .bottom-nav .nav-btn { font-size: 12px; padding: 6px 12px; }
            .float-btn { width: 40px; height: 40px; font-size: 16px; }
            .locate-btn { bottom: 100px; right: 12px; }
            .voice-btn { bottom: 155px; right: 12px; }
            .solution-compare { flex-direction: column; }
            .panel-body { padding: 12px 14px; }
            .category-bar { padding-top: calc(54px + env(safe-area-inset-top, 8px)); }
            .category-bar .cat-btn { font-size: 12px; padding: 4px 10px; }
        }
        .text-green { color: #1b5e20; }
        .btn-primary-custom { background: #1b5e20; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .btn-primary-custom:hover { background: #2e7d32; }
        .btn-outline-custom { background: transparent; color: #1b5e20; border: 2px solid #1b5e20; padding: 8px 16px; border-radius: 8px; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .btn-outline-custom:hover { background: #1b5e20; color: white; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar" id="topBar">
    <span class="brand" id="brandToggle"><i class="fas fa-leaf"></i> 智游通江</span>
</div>

<div class="category-bar" id="categoryBar">
    <button class="cat-btn" onclick="window.filterPOI('自然景区')">🏔️ 自然景区</button>
    <button class="cat-btn" onclick="window.filterPOI('人文历史')">📜 人文历史</button>
    <button class="cat-btn" onclick="window.filterPOI('民俗风情')">🎎 民俗风情</button>
    <button class="cat-btn" onclick="window.filterPOI('景观地标')">🗼 景观地标</button>
    <button class="cat-btn" onclick="window.filterPOI('游玩娱乐')">🎢 游玩娱乐</button>
    <button class="cat-btn" onclick="window.filterPOI('购物消费')">🛍️ 购物消费</button>
    <button class="cat-btn" onclick="window.filterPOI('餐饮住宿')">🍽️ 餐饮住宿</button>
    <button class="cat-btn" onclick="window.filterPOI('交通枢纽')">🚌 交通枢纽</button>
    <button class="cat-btn" onclick="window.filterPOI('公共服务')">🏛️ 公共服务</button>
    <button class="cat-btn" onclick="window.clearFilter()">✕ 清除筛选</button>
</div>

<div class="bottom-nav" id="bottomNav">
    <button class="nav-btn primary" onclick="window.openPanel('planPanel')">
        <i class="fas fa-wand-magic-sparkles"></i> 智能规划
    </button>
    <button class="nav-btn" onclick="window.openPanel('myPanel')">
        <i class="fas fa-user"></i> 我的
    </button>
</div>

<button class="float-btn locate-btn" onclick="window.locateUser()"><i class="fas fa-crosshairs"></i></button>
<button class="float-btn voice-btn" id="voiceToggleBtn" onclick="window.toggleVoice()"><i class="fas fa-volume-high"></i></button>

<!-- 面板：智能规划 -->
<div class="panel" id="planPanel">
    <div class="panel-header">
        <h2><i class="fas fa-route text-green"></i> 智能行程规划</h2>
        <button class="close-btn" onclick="window.closePanel('planPanel')">&times;</button>
    </div>
    <div class="panel-body">
        <!-- 步骤1：偏好设置 -->
        <div id="stepPreferences">
            <h5><i class="fas fa-sliders-h text-green"></i> 旅行偏好</h5>
            <div class="row g-2 mt-2">
                <div class="col-6"><label class="form-label fw-semibold">出发日期</label><input type="date" id="planStartDate" class="form-control" /></div>
                <div class="col-6"><label class="form-label fw-semibold">出发时间</label><select id="planStartTime" class="form-select"></select></div>
                <div class="col-6"><label class="form-label fw-semibold">天数</label><select id="planDays" class="form-select"><option value="1">1 天</option><option value="2" selected>2 天</option><option value="3">3 天</option><option value="4">4 天</option><option value="5">5 天</option></select></div>
                <div class="col-6"><label class="form-label fw-semibold">行程风格</label><select id="planStyle" class="form-select"><option value="compact">🚀 紧凑型 (核心景点)</option><option value="relaxed" selected>🌿 舒适型 (经典+特色)</option><option value="indepth">🔍 深度游 (全体验)</option></select></div>
            </div>
            <div class="mt-2"><label class="form-label fw-semibold">景点类型偏好</label><div id="prefCategories" class="d-flex flex-wrap gap-1"><span class="pref-tag" data-value="自然景区">🌿 自然</span><span class="pref-tag" data-value="人文历史">📜 人文</span><span class="pref-tag" data-value="民俗风情">🎎 民俗</span><span class="pref-tag" data-value="景观地标">🗼 景观</span><span class="pref-tag" data-value="游玩娱乐">🎢 游玩</span><span class="pref-tag" data-value="购物消费">🛍️ 购物</span></div></div>
            <div class="mt-2"><label class="form-label fw-semibold">用餐偏好</label><div id="prefCuisine" class="d-flex flex-wrap gap-1"><span class="pref-tag" data-value="川菜">🌶️ 川菜</span><span class="pref-tag" data-value="火锅">🫕 火锅</span><span class="pref-tag" data-value="小吃">🍢 小吃</span><span class="pref-tag" data-value="家常">🍳 家常</span><span class="pref-tag" data-value="简餐">🥪 简餐</span></div></div>
            <div class="mt-2">
                <label class="form-label fw-semibold">选择景点 <span class="text-secondary" style="font-weight:400;font-size:13px;">（点击地图标记或手动勾选）</span></label>
                <div id="poiSelectContainer" class="poi-select-list"><div class="text-secondary text-center py-2">加载景点中...</div></div>
                <div class="mt-1"><button class="btn btn-sm btn-outline-secondary" onclick="window.selectAllPois(true)">全选</button><button class="btn btn-sm btn-outline-secondary" onclick="window.selectAllPois(false)">取消全选</button><span class="ms-2 text-secondary" id="selectedPoiCount">已选 0 个</span></div>
            </div>
            <button class="btn btn-primary-custom w-100 mt-3" onclick="window.generatePlans()"><i class="fas fa-wand-magic-sparkles"></i> 生成行程方案</button>
            <div id="planLoading" class="text-center mt-3 hidden"><div class="spinner-border text-success" role="status"></div><p class="mt-2 text-secondary">正在为您规划最优行程...</p></div>
        </div>

        <!-- 步骤2：方案对比（详细展示） -->
        <div id="stepCompare" class="hidden">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5><i class="fas fa-chart-simple text-green"></i> 方案对比</h5>
                <button class="btn btn-secondary btn-sm" onclick="window.backToPreferences()"><i class="fas fa-arrow-left"></i> 重新设置</button>
            </div>
            <div id="solutionCompareContainer" class="solution-compare"></div>
            <div class="mt-3">
                <button class="btn btn-primary-custom w-100" onclick="window.selectSolution()" id="selectSolutionBtn" disabled>
                    <i class="fas fa-check"></i> 选择此方案
                </button>
            </div>
        </div>

        <!-- 步骤3：行程详情 -->
        <div id="stepDetail" class="hidden">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5><i class="fas fa-map text-green"></i> 我的行程</h5>
                <button class="btn btn-secondary btn-sm" onclick="window.backToCompare()"><i class="fas fa-arrow-left"></i> 返回对比</button>
            </div>
            <div id="tripDetailContainer"></div>
            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-primary-custom flex-grow-1" onclick="window.saveTripSolution()"><i class="fas fa-save"></i> 保存行程</button>
                <button class="btn btn-outline-custom" onclick="window.startNavigation()"><i class="fas fa-location-dot"></i> 开始导航</button>
            </div>
        </div>
    </div>
</div>

<!-- 面板：我的 -->
<div class="panel" id="myPanel">
    <div class="panel-header"><h2><i class="fas fa-user text-green"></i> 我的</h2><button class="close-btn" onclick="window.closePanel('myPanel')">&times;</button></div>
    <div class="panel-body">
        <ul class="nav nav-tabs" id="myTabs">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#myTrips">📅 行程</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#myReservations">📋 预约</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#myFeedback">💬 留言</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#mySettings">⚙️ 偏好</a></li>
        </ul>
        <div class="tab-content mt-3">
            <div class="tab-pane active" id="myTrips"><div id="myTripsContent"></div></div>
            <div class="tab-pane" id="myReservations"><div id="myReservationsContent"></div></div>
            <div class="tab-pane" id="myFeedback"><textarea id="feedbackMsg" class="form-control" rows="3" placeholder="建议或问题..."></textarea><button class="btn btn-primary-custom mt-2" onclick="window.submitFeedback()">提交</button><div id="feedbackHistory" class="mt-3"></div></div>
            <div class="tab-pane" id="mySettings">
                <h6><i class="fas fa-sliders-h text-green"></i> 旅行偏好设置</h6>
                <div class="mb-2"><label class="form-label fw-semibold">景点类型</label><div id="settingsCategories" class="d-flex flex-wrap gap-1"><span class="pref-tag" data-value="自然景区">🌿 自然</span><span class="pref-tag" data-value="人文历史">📜 人文</span><span class="pref-tag" data-value="民俗风情">🎎 民俗</span><span class="pref-tag" data-value="景观地标">🗼 景观</span><span class="pref-tag" data-value="游玩娱乐">🎢 游玩</span><span class="pref-tag" data-value="购物消费">🛍️ 购物</span></div></div>
                <div class="mb-2"><label class="form-label fw-semibold">用餐偏好</label><div id="settingsCuisine" class="d-flex flex-wrap gap-1"><span class="pref-tag" data-value="川菜">🌶️ 川菜</span><span class="pref-tag" data-value="火锅">🫕 火锅</span><span class="pref-tag" data-value="小吃">🍢 小吃</span><span class="pref-tag" data-value="家常">🍳 家常</span><span class="pref-tag" data-value="简餐">🥪 简餐</span></div></div>
                <div class="mb-2"><label class="form-label fw-semibold">行程风格</label><select id="settingsPace" class="form-select"><option value="compact">🚀 紧凑型</option><option value="relaxed" selected>🌿 舒适型</option><option value="indepth">🔍 深度游</option></select></div>
                <button class="btn btn-primary-custom" onclick="window.savePreferences()"><i class="fas fa-save"></i> 保存偏好</button>
            </div>
        </div>
    </div>
</div>

<!-- 商户详情面板 -->
<div class="panel" id="merchantDetailPanel">
    <div class="panel-header"><h2 id="merchantDetailTitle">商户详情</h2><button class="close-btn" onclick="window.closePanel('merchantDetailPanel')">&times;</button></div>
    <div class="panel-body" id="merchantDetailContent"></div>
</div>

<!-- 导航面板 -->
<div class="panel" id="navPanel">
    <div class="panel-header"><h2><i class="fas fa-compass text-green"></i> 实时导航</h2><button class="close-btn" onclick="window.closePanel('navPanel')">&times;</button></div>
    <div class="panel-body"><div id="navContent"><div class="d-flex justify-content-between align-items-center"><span class="fw-bold">今日进度</span><span id="navProgressText">0%</span></div><div class="progress-bar-custom"><div class="fill" id="navProgressBar" style="width:0%"></div></div><div id="navCurrentNode" class="card-modern"><div class="card-title" id="navPoiName">准备出发</div><div class="card-sub" id="navPoiStatus">等待开始导航...</div></div><div id="navTimeline" class="mt-3"></div><button class="btn btn-danger w-100 mt-3" onclick="window.endNavigation()"><i class="fas fa-stop"></i> 结束导航</button></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

// ===== 生成设备ID（本地唯一标识，无需登录） =====
function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        localStorage.setItem('deviceId', id);
    }
    return id;
}
const DEVICE_ID = getDeviceId();

// ===== 覆盖提交留言和预约 =====
window.submitFeedback = async function() {
    const msg = document.getElementById('feedbackMsg')?.value.trim();
    if (!msg) { alert('请输入内容'); return; }
    try {
        await insertFeedback({ user_id: DEVICE_ID, message: msg });
        alert('提交成功');
        document.getElementById('feedbackMsg').value = '';
        window.renderFeedbackHistory();
    } catch (e) { alert('提交失败：' + e.message); }
};

window.submitReservation = async function(merchantId) {
    const date = document.getElementById(`res-date-${merchantId}`).value;
    const timeRange = document.getElementById(`res-time-${merchantId}`).value;
    const [start, end] = timeRange.split('-');
    const name = document.getElementById(`res-name-${merchantId}`).value.trim();
    const phone = document.getElementById(`res-phone-${merchantId}`).value.trim();
    const count = parseInt(document.getElementById(`res-count-${merchantId}`).value) || 1;
    const remark = document.getElementById(`res-remark-${merchantId}`).value.trim();

    if (!date || !name || !phone) {
        alert('请填写日期、联系人和电话');
        return;
    }

    try {
        await insertReservation({
            merchant_id: merchantId,
            reservation_date: date,
            time_slot_start: start,
            time_slot_end: end,
            name: name,
            phone: phone,
            visitor_count: count,
            remark: remark,
            status: 'pending',
            user_id: DEVICE_ID
        });
        alert('预约提交成功！');
        document.getElementById(`res-date-${merchantId}`).value = '';
        document.getElementById(`res-name-${merchantId}`).value = '';
        document.getElementById(`res-phone-${merchantId}`).value = '';
        document.getElementById(`res-count-${merchantId}`).value = '1';
        document.getElementById(`res-remark-${merchantId}`).value = '';
        window.toggleReservationForm(merchantId);
        window.renderMyReservations();
    } catch (e) {
        alert('提交失败：' + e.message);
    }
};

// ===== 覆盖渲染我的行程/预约/留言（使用设备ID） =====
window.renderMyTrips = async function() {
    const container = document.getElementById('myTripsContent');
    if (!container) return;
    try {
        const solutions = await getUserTripSolutions(DEVICE_ID);
        if (!solutions || solutions.length === 0) {
            container.innerHTML = '<p class="text-secondary">暂无保存的行程</p>';
            return;
        }
        let html = '';
        solutions.forEach((sol) => {
            const data = sol.solution_data || {};
            html += `
                <div class="card-modern">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title">📅 ${data.start_date || '未命名'} (${sol.style || '自定义'})</div>

        const sorted = myReservations.sort((a, b) => new Date(b.reservation_date) - new Date(a.reservation_date));
        const merchantIds = sorted.map(r => r.merchant_id).filter(id => id);
        const merchantMap = {};
        for (let id of merchantIds) {
            try {
                const { getMerchant } = await import('./js/api.js');
                const m = await getMerchant(id);
                merchantMap[id] = m;
            } catch (e) { merchantMap[id] = null; }
        }

            const merchantName = merchant ? merchant.display_name || '未知商户' : '未知商户';
            const category = merchant ? merchant.business_type || '未分类' : '未分类';
            html += `
                <div class="card-modern">
                    <div onclick="window.toggleReservationDetail(${idx})" style="cursor:pointer;">
                        <div class="card-title">📅 ${r.reservation_date} | ${merchantName}</div>
                        <div class="card-sub">${category}</div>
                    </div>
                    <div id="res-detail-${idx}" class="hidden mt-2">
                        <p><b>单位：</b>${r.unit || ''}</p>
                        <p><b>联系人：</b>${r.name || ''}</p>
                        <p><b>电话：</b>${r.phone || ''}</p>
                        <p><b>人数：</b>${r.visitor_count}</p>
                        <p><b>时段：</b>${r.time_slot_start} - ${r.time_slot_end || ''}</p>
                        <p><b>备注：</b>${r.remark || ''}</p>
                        <p><b>状态：</b>${r.status}</p>
                        <button class="btn btn-sm btn-danger" onclick="window.deleteReservationHandler('${r.id}')">删除</button>

// ===== 核心：重写行程生成和展示 =====
let currentSolutions = [];
let selectedSolutionIndex = -1;
let currentTripData = null;

// 格式化时间
function fmtTime(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// 生成详细行程方案（简单顺序安排，展示日程）
function generateDetailedPlan(selectedPois, startDate, startTime, days, style, travelTimes) {
    // 按景点顺序安排时间
    const sortedPois = [...selectedPois].sort((a, b) => a.visit_duration - b.visit_duration); // 简单排序，可优化
    const dayStart = 480; // 8:00
    const dayEnd = 1080; // 18:00
    const lunchStart = 690; // 11:30
    const lunchEnd = 750; // 12:30
    const dinnerStart = 1050; // 17:30
    const dinnerEnd = 1110; // 18:30
    const mealDuration = 60;

    let currentTime = timeToMinutes(startTime);
    let currentDay = 1;
    let lastPoiId = 'county';
    const daysData = [];

    for (let poi of sortedPois) {
        // 交通时间
        const travelKey = `${lastPoiId}_${poi.id}`;
        const travel = travelTimes[travelKey] || 0;
        // 检查是否跨天
        if (currentTime + travel + poi.visit_duration > dayEnd) {
            // 结束当天
            daysData.push({ day: currentDay, date: startDate, nodes: dayNodes });
            dayNodes = [];
            currentDay++;
            currentTime = dayStart;
            lastPoiId = 'county';
            // 重新计算交通
            const newTravel = travelTimes[`${lastPoiId}_${poi.id}`] || 0;
            currentTime += newTravel;
        } else {
            currentTime += travel;
        }

        // 检查午餐
        if (currentTime < lunchStart && currentTime + poi.visit_duration > lunchStart) {
            // 在午餐前插入午餐
            dayNodes.push({ type: 'meal', name: '午餐时间', startTime: lunchStart, endTime: lunchStart + mealDuration });
            currentTime = lunchStart + mealDuration;
        }
        // 检查晚餐
        if (currentTime < dinnerStart && currentTime + poi.visit_duration > dinnerStart) {
            dayNodes.push({ type: 'meal', name: '晚餐时间', startTime: dinnerStart, endTime: dinnerStart + mealDuration });
            currentTime = dinnerStart + mealDuration;
        }

        // 添加游览节点
        dayNodes.push({ type: 'visit', poi_id: poi.id, poi_name: poi.name, startTime: currentTime, endTime: currentTime + poi.visit_duration });
        currentTime += poi.visit_duration;
        lastPoiId = poi.id;
    }

    // 最后一天
    if (dayNodes.length > 0) {
        daysData.push({ day: currentDay, date: startDate, nodes: dayNodes });
    }

    return { days: daysData, total_days: daysData.length, total_pois: sortedPois.length };
}

function timeToMinutes(timeStr) {
    if (!timeStr) return 480;
    const parts = timeStr.split(':');
    return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

// 生成方案
window.generatePlans = async function() {
    const loadingEl = document.getElementById('planLoading');
    const stepPrefs = document.getElementById('stepPreferences');
    const stepCompare = document.getElementById('stepCompare');

    const startDate = document.getElementById('planStartDate').value;
    const startTime = document.getElementById('planStartTime').value;
    const days = parseInt(document.getElementById('planDays').value);
    const style = document.getElementById('planStyle').value;

    if (!startDate) { alert('请选择出发日期'); return; }

    const selectedIds = [];
    document.querySelectorAll('#poiSelectContainer input:checked').forEach(cb => {
        selectedIds.push(cb.value);
    });
    if (selectedIds.length === 0) { alert('请至少选择一个景点'); return; }

    let allPois = window.__allPois || [];
    if (!allPois || allPois.length === 0) {
        const pois = await getPois();
        allPois = pois;
        window.__allPois = pois;
    }

    const selectedPois = allPois.filter(p => selectedIds.includes(String(p.id)));
    if (selectedPois.length === 0) {
        alert('未找到选中的景点数据，请重新选择');
        return;
    }

    const presets = await getTransportPresets();
    const travelTimes = {};
    presets.forEach(p => {
        travelTimes[`${p.from_poi_id}_${p.to_poi_id}`] = p.time_min;
    });

    // 生成方案
    const solutionData = generateDetailedPlan(selectedPois, startDate, startTime, days, style, travelTimes);
    currentSolutions = [{
        style: style,
        data: solutionData,
        score: 0.8
    }];
    selectedSolutionIndex = -1;

    renderDetailedSolutions(currentSolutions);
    loadingEl.classList.add('hidden');
    stepPrefs.classList.add('hidden');
    stepCompare.classList.remove('hidden');
};

function renderDetailedSolutions(solutions) {
    const container = document.getElementById('solutionCompareContainer');
    if (!container) return;

    const styleLabels = {
        compact: { label: '紧凑型', badge: 'badge-compact', icon: '🚀' },
        relaxed: { label: '舒适型', badge: 'badge-relaxed', icon: '🌿' },
        indepth: { label: '深度游', badge: 'badge-indepth', icon: '🔍' }
    };

    let html = '';
    solutions.forEach((sol, idx) => {
        const info = styleLabels[sol.style] || styleLabels.relaxed;
        const data = sol.data || {};
        const totalPois = data.total_pois || 0;
        const totalDays = data.total_days || 1;

        html += `
            <div class="solution-card" onclick="window.selectSolutionCard(${idx})" id="sol-card-${idx}">
                <div class="badge-style ${info.badge}">${info.icon} ${info.label}</div>
                <div class="stat-row"><span>📅 天数</span><span>${totalDays} 天</span></div>
                <div class="stat-row"><span>📍 景点</span><span>${totalPois} 个</span></div>
        `;

        // 显示每天详细日程
        if (data.days) {
            data.days.forEach(day => {
                html += `<div class="day-detail"><div class="day-title">📅 第${day.day}天 (${day.date})</div>`;
                if (day.nodes) {
                    day.nodes.forEach(node => {
                        if (node.type === 'meal') {
                            html += `<div class="time-line"><span class="time">${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}</span><span class="icon">🍽️</span><span>${node.name}</span></div>`;
                        } else if (node.type === 'visit') {
                            html += `<div class="time-line"><span class="time">${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}</span><span class="icon">📍</span><span>${node.poi_name}</span></div>`;
                        }
                    });
                }
                html += `</div>`;
            });
        }

        html += `
                <button class="btn btn-sm btn-outline-custom mt-2 w-100" onclick="event.stopPropagation(); window.previewSolution(${idx})">
                    <i class="fas fa-eye"></i> 预览详情
                </button>
            </div>
        `;
    });

    container.innerHTML = html;
    document.getElementById('selectSolutionBtn').disabled = true;
}

window.selectSolutionCard = function(idx) {
    document.querySelectorAll('.solution-card').forEach(el => el.classList.remove('selected'));
    const card = document.getElementById(`sol-card-${idx}`);
    if (card) card.classList.add('selected');
    selectedSolutionIndex = idx;
    document.getElementById('selectSolutionBtn').disabled = false;
};

window.previewSolution = function(idx) {
    const sol = currentSolutions[idx];
    if (!sol) return;
    const data = sol.data || {};
    let msg = `📋 ${sol.style === 'compact' ? '紧凑型' : sol.style === 'relaxed' ? '舒适型' : '深度游'} 方案\n`;
    msg += `📅 ${data.total_days || 0} 天 | 📍 ${data.total_pois || 0} 个景点\n\n`;
    if (data.days) {
        data.days.forEach(day => {
            msg += `--- 第${day.day}天 (${day.date}) ---\n`;
            if (day.nodes) {
                day.nodes.forEach(node => {
                    if (node.type === 'meal') {
                        msg += `  ${fmtTime(node.startTime)} - ${fmtTime(node.endTime)} 🍽️ ${node.name}\n`;
                    } else if (node.type === 'visit') {
                        msg += `  ${fmtTime(node.startTime)} - ${fmtTime(node.endTime)} 📍 ${node.poi_name}\n`;
                    }
                });
            }
            msg += '\n';
        });
    }
    alert(msg);
};

// 选择方案
window.selectSolution = function() {
    if (selectedSolutionIndex < 0 || selectedSolutionIndex >= currentSolutions.length) {
        alert('请先选择一个方案');
        return;
    }
    const sol = currentSolutions[selectedSolutionIndex];
    currentTripData = sol.data;
    showTripDetail(sol.data);
    document.getElementById('stepCompare').classList.add('hidden');
    document.getElementById('stepDetail').classList.remove('hidden');
};

function showTripDetail(data) {
    const container = document.getElementById('tripDetailContainer');
    if (!container) return;
    let html = '';
    if (data.days) {
        data.days.forEach(day => {
            html += `<div class="day-block"><div class="day-title">📅 第${day.day}天 (${day.date})</div>`;
            if (day.nodes) {
                day.nodes.forEach(node => {
                    if (node.type === 'meal') {
                        html += `<div class="node-item"><span class="node-time">${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}</span><span class="node-icon">🍽️</span><span>${node.name}</span></div>`;
                    } else if (node.type === 'visit') {
                        html += `<div class="node-item"><span class="node-time">${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}</span><span class="node-icon">📍</span><span>${node.poi_name}</span></div>`;
                    }
                });
            }
            html += `</div>`;
        });
    }
    html += `
        <div class="card-modern mt-2">
            <div class="card-title">📊 行程摘要</div>
            <div class="stat-row"><span>总天数</span><span>${data.total_days || 0} 天</span></div>
            <div class="stat-row"><span>景点数</span><span>${data.total_pois || 0} 个</span></div>
        </div>
    `;
    container.innerHTML = html;
}

// 覆盖保存行程
window.saveTripSolution = async function() {
    if (!currentTripData) { alert('没有可保存的行程'); return; }
    try {
        await apiSaveTripSolution(DEVICE_ID, currentTripData, 'custom', 0);
        alert('行程已保存');
        window.renderMyTrips();
    } catch (error) { alert('保存失败：' + error.message); }
};

// 覆盖偏好保存
window.savePreferences = async function() {
    const selectedCats = [];
    document.querySelectorAll('#settingsCategories .pref-tag.active').forEach(el => {
        selectedCats.push(el.dataset.value);
    });
    const selectedCuisine = [];
    document.querySelectorAll('#settingsCuisine .pref-tag.active').forEach(el => {
        selectedCuisine.push(el.dataset.value);
    });
    const pace = document.getElementById('settingsPace').value;
    try {
        const { saveUserPreferences } = await import('./js/api.js');
        await saveUserPreferences({ user_id: DEVICE_ID, preferred_categories: selectedCats, cuisine_prefs: selectedCuisine, pace: pace, updated_at: new Date().toISOString() });
        alert('偏好已保存');
    } catch (error) { alert('保存失败：' + error.message); }
};

window.locateUser = locateUser;
window.clearFilter = clearFilter;
window.filterPOI = (category) => { applyFilter(category); };
window.openPanel = (id) => { document.getElementById(id).classList.add('active'); };
window.closePanel = (id) => { document.getElementById(id).classList.remove('active'); };

window.endNavigation = endNavigation;
window.selectAllPois = selectAllPois;

// ===== 分类栏切换 =====
const brandToggle = document.getElementById('brandToggle');
const categoryBar = document.getElementById('categoryBar');
let hideTimer = null;

brandToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const isShowing = categoryBar.classList.contains('show');
    if (isShowing) {
        categoryBar.classList.remove('show');
        clearTimeout(hideTimer);
    } else {
        categoryBar.classList.add('show');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            categoryBar.classList.remove('show');
        }, 3000);
    }
});

document.addEventListener('click', function(e) {
    if (!categoryBar.contains(e.target) && e.target !== brandToggle) {
        categoryBar.classList.remove('show');
        clearTimeout(hideTimer);
    }
});

// ===== 初始化 =====
async function init() {
    try {
        const pois = await getPois();
        window.__allPois = pois;

        initMap('map');
        loadPoisToMap(pois);

        await window.renderMyTrips();
        await window.renderMyReservations();
        await window.renderFeedbackHistory();

        initPlanPanel();
        loadPoiListForSelection(pois);

        locateUser();

        console.log('[系统] 初始化完成, POI数量:', pois.length);
    } catch (e) {
        console.error('[系统] 初始化失败:', e);
        alert('初始化失败：' + e.message);
    }
}
init();
</script>
