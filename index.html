<script>
// ==================== 核心配置 ====================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let map, allPois = [], generatedTripData = null;
let userMarker = null, simMarker = null;
let anonymousUserId = null;
let voiceEnabled = true;
let lastTriggeredPoiIds = {};
const TRIGGER_RADIUS = 30;
const GPS_ACCURACY_TOLERANCE = 10;
let watchId = null;
let currentGcjPos = null;
let currentAudio = null;
let weatherCache = null;
let currentFilterCategory = null;
let poiMarkers = [];
let filterTimeoutId = null;

const COUNTY = { lat:31.911705, lng:107.245033, name:'红军广场', id:'county' };
const poiColors = { '自然景区':'#2E7D32', '红色景区':'#9C27B0', '文博场馆':'#9C27B0', '餐饮住宿':'#FF9800', '停车场':'#00BCD4', '公共服务':'#607D8B' };
let transportPresets = {};
const DAY_START=480, DAY_END=1080, LUNCH_TRIGGER=690, LUNCH_END=750, DINNER_TRIGGER=1050, DINNER_END=1110, MEAL_DURATION=60;
const ALLOWED_CATEGORIES = ['自然景区', '红色景区', '文博场馆'];
const NON_VISIT_CATEGORIES = ['交通枢纽','餐饮住宿','公共服务','特产购物','游玩娱乐'];
const LONG_SPOT_NAMES = ['空山天盆', '诺水河溶洞', '王坪烈士陵园', '红军烈士陵园'];
const COUNTY_SPOT_KEYWORDS = ['轿房沟美食街', '银耳博物馆', '红四方面军总指挥部旧址纪念馆', '省委党校旧址纪念馆', '通江花月夜'];

let routeLegs=[], mainPoiOptions=[], allowedPoiOptions=[];

// ==================== 辅助函数 ====================
function wgs84ToGcj02(lat, lon) {
    const a = 6378245.0;
    const ee = 0.00669342162296594323;
    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }
    function transformLon(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
    }
    const dLat = transformLat(lon - 105.0, lat - 35.0);
    const dLon = transformLon(lon - 105.0, lat - 35.0);
    const radLat = lat / 180.0 * Math.PI;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    const dLatFinal = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
    const dLonFinal = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
    return { lat: lat + dLatFinal, lng: lon + dLonFinal };
}

function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatTime(m){ 
    let hours = Math.floor(m / 60);
    let minutes = m % 60;
    // 处理跨天：如果超过24小时，取余
    if (hours >= 24) hours = hours % 24;
    return `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}`; 
}

function isNonVisitPoi(poiId){
    if(poiId==='county') return false;
    const poi = allPois.find(p=>p.id==poiId);
    if(!poi || !poi.category) return false;
    return poi.category.split(',').some(c=>NON_VISIT_CATEGORIES.includes(c.trim()));
}

function getUserId(){
    return anonymousUserId || (localStorage.getItem('vid') || (()=>{
        let uid='v_'+Date.now()+Math.random().toString(36);
        localStorage.setItem('vid',uid);
        return uid;
    })());
}

function getTodayStr(){ return new Date().toISOString().slice(0,10); }

// ==================== 天气获取 ====================
async function fetchWeatherForecast() {
    const now = Date.now();
    if (weatherCache && (now - weatherCache.time < 3600000)) {
        return weatherCache.data;
    }
    try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=31.911705&longitude=107.245033&daily=weathercode,temperature_2m_max,temperature_2m_min,windspeed_10m_max&timezone=Asia/Shanghai&forecast_days=16`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('天气API请求失败');
        const data = await response.json();
        if (!data.daily || !data.daily.time) throw new Error('天气数据格式异常');
        const codes = data.daily.weathercode || [];
        const tempsMax = data.daily.temperature_2m_max || [];
        const tempsMin = data.daily.temperature_2m_min || [];
        const winds = data.daily.windspeed_10m_max || [];
        const dates = data.daily.time || [];
        const codeMap = {
            0: '晴', 1: '晴', 2: '晴间多云', 3: '多云',
            45: '雾', 48: '雾',
            51: '小毛毛雨', 53: '毛毛雨', 55: '大毛毛雨',
            61: '小雨', 63: '中雨', 65: '大雨',
            71: '小雪', 73: '中雪', 75: '大雪',
            80: '阵雨', 81: '中阵雨', 82: '强阵雨',
            95: '雷暴', 96: '雷暴加冰雹', 99: '强雷暴加冰雹'
        };
        const forecast = dates.map((date, i) => ({
            date: date,
            weather: codeMap[codes[i]] || '未知天气',
            tempMax: tempsMax[i] !== undefined ? Math.round(tempsMax[i]) : '--',
            tempMin: tempsMin[i] !== undefined ? Math.round(tempsMin[i]) : '--',
            wind: winds[i] !== undefined ? Math.round(winds[i]) : '--'
        }));
        weatherCache = { time: Date.now(), data: forecast };
        return forecast;
    } catch (e) {
        console.warn('[天气] 获取失败:', e);
        return null;
    }
}

function getDayWeatherTip(weatherObj) {
    if (!weatherObj) return '⚠️ 天气信息获取失败，请自行关注天气变化。';
    const { weather, tempMax, tempMin, wind } = weatherObj;
    let tip = `🌤️ 天气：${weather}`;
    if (tempMin !== '--' && tempMax !== '--') tip += `，气温 ${tempMin}℃ ～ ${tempMax}℃`;
    else if (tempMax !== '--') tip += `，最高气温 ${tempMax}℃`;
    if (wind !== '--') tip += `，风力 ${wind} km/h`;
    if (weather.includes('雨') || weather.includes('雷') || weather.includes('雾')) tip += '，☔ 有降雨或大雾，建议携带雨具，注意出行安全。';
    else if (tempMax !== '--' && tempMax > 33) tip += '，☀️ 气温较高，注意防暑防晒，多补充水分。';
    else if (tempMax !== '--' && tempMax < 10) tip += '，🧥 气温较低，注意保暖。';
    else tip += '，🌿 天气适宜出行，祝您旅途愉快！';
    return tip;
}

// ==================== 语音引擎 ====================
function activateSpeech() {
    if ('speechSynthesis' in window) {
        speechSynthesis.getVoices();
        const silent = new SpeechSynthesisUtterance(' ');
        silent.volume = 0;
        silent.lang = 'zh-CN';
        speechSynthesis.speak(silent);
        setTimeout(() => speechSynthesis.cancel(), 100);
    }
}

function toggleAutoVoice() {
    voiceEnabled = !voiceEnabled;
    const btn = document.getElementById('voiceToggleBtn');
    if (voiceEnabled) {
        btn.textContent = '🔊';
        const testMsg = new SpeechSynthesisUtterance('语音已开启');
        testMsg.lang = 'zh-CN';
        speechSynthesis.speak(testMsg);
        if (currentGcjPos) checkVoiceTrigger(currentGcjPos.lat, currentGcjPos.lng);
    } else {
        btn.textContent = '🔇';
        speechSynthesis.cancel();
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        const closeMsg = new SpeechSynthesisUtterance('语音已关闭');
        closeMsg.lang = 'zh-CN';
        speechSynthesis.speak(closeMsg);
    }
}

function triggerVoice(poi) {
    if (!voiceEnabled) return;
    speechSynthesis.cancel();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (poi.voice_mp3) {
        const audio = new Audio(poi.voice_mp3);
        currentAudio = audio;
        audio.play().catch(() => playTTS(poi));
        return;
    }
    if (poi.voice_cn && poi.voice_cn.startsWith('http')) {
        const audio = new Audio(poi.voice_cn);
        currentAudio = audio;
        audio.play().catch(() => playTTS(poi));
        return;
    }
    playTTS(poi);
}

function playTTS(poi) {
    const lang = document.getElementById('langSelect')?.value || 'cn';
    let text = poi['voice_' + lang] || poi.voice_cn || poi.description || poi.name;
    if (text && text.startsWith('http')) text = poi.description || poi.name;
    if (!text) return;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = { cn:'zh-CN', en:'en-US', ja:'ja-JP', ko:'ko-KR' }[lang] || 'zh-CN';
    utterance.rate = 0.9;
    speechSynthesis.speak(utterance);
}

function checkVoiceTrigger(userLat, userLng) {
    if (!voiceEnabled || !allPois.length) return;
    const today = getTodayStr();
    const threshold = TRIGGER_RADIUS + GPS_ACCURACY_TOLERANCE;
    allPois.forEach(poi => {
        if (!poi.lat || !poi.lng) return;
        const dist = getDistance(userLat, userLng, poi.lat, poi.lng);
        if (dist <= threshold && lastTriggeredPoiIds[poi.id] !== today) {
            triggerVoice(poi);
            lastTriggeredPoiIds[poi.id] = today;
        }
    });
}

// ==================== 定位 ====================
function locateUser() {
    if (!navigator.geolocation) { alert('您的浏览器不支持定位'); return; }
    activateSpeech();
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const raw = { lat: position.coords.latitude, lng: position.coords.longitude };
            const gcj = wgs84ToGcj02(raw.lat, raw.lng);
            currentGcjPos = gcj;
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker([gcj.lat, gcj.lng], {
                icon: L.divIcon({
                    html: '<div style="background:#2196F3; width:20px; height:20px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px rgba(0,0,0,0.3);"></div>',
                    iconSize: [20,20]
                })
            }).addTo(map).bindPopup('我的位置').openPopup();
            map.setView([gcj.lat, gcj.lng], 15);
            startWatching();
            checkVoiceTrigger(gcj.lat, gcj.lng);
        },
        (error) => { console.warn('定位失败:', error.message); },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function startWatching() {
    if (!navigator.geolocation) return;
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(
        (pos) => {
            const raw = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            const gcj = wgs84ToGcj02(raw.lat, raw.lng);
            currentGcjPos = gcj;
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker([gcj.lat, gcj.lng], { icon: L.divIcon({ html: '<div style="background:#2196F3; width:20px; height:20px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px rgba(0,0,0,0.3);"></div>', iconSize: [20,20] }) }).addTo(map);
            checkVoiceTrigger(gcj.lat, gcj.lng);
        },
        (err) => { console.warn('定位监听错误', err); },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
}

function setSimulatedPosition(lat, lng) {
    currentGcjPos = { lat, lng };
    if (simMarker) map.removeLayer(simMarker);
    simMarker = L.marker([lat, lng], {
        icon: L.divIcon({
            html: '<div style="background:#FF5722; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px rgba(0,0,0,0.3);"></div>',
            iconSize: [16,16]
        })
    }).addTo(map).bindPopup('模拟位置').openPopup();
    checkVoiceTrigger(lat, lng);
    map.setView([lat, lng], 15);
}

    const { data } = await sb.from('ztj_transport_presets').select('*');
    transportPresets = {};

function getTransportTime(fromId, toId, mode) {
    if (fromId === 'mylocation' || toId === 'mylocation') {
        const fromPoi = fromId === 'mylocation' ? { lat: currentGcjPos?.lat || 0, lng: currentGcjPos?.lng || 0 } : allPois.find(p => p.id == fromId) || COUNTY;
        const toPoi = toId === 'mylocation' ? { lat: currentGcjPos?.lat || 0, lng: currentGcjPos?.lng || 0 } : allPois.find(p => p.id == toId) || COUNTY;
        if (!fromPoi || !toPoi) return null;
        const dist = getDistance(fromPoi.lat, fromPoi.lng, toPoi.lat, toPoi.lng);
        const speed = mode === 'auto' ? 40000 : (mode === 'bus' ? 20000 : 5000);
        return Math.round(dist / speed * 60);
    }
    const fId = fromId === 'county' ? 0 : fromId;
    const tId = toId === 'county' ? 0 : toId;
    let t = transportPresets[`${fId}_${tId}`];
    if (t !== undefined) return t;
    t = transportPresets[`${tId}_${fId}`];
    return t !== undefined ? t : null;
}

function renderPOIs(pois) {
    poiMarkers.forEach(m => map.removeLayer(m));
    poiMarkers = [];
    pois.forEach(p => {
        const cat = (p.category||'').split(',')[0]||'其他';
        const color = poiColors[cat]||'#999';
        const icon = L.divIcon({html:`<div style="background:${color}; width:20px; height:20px; border-radius:50%; border:2px solid white;"></div>`, iconSize:[20,20]});
        const marker = L.marker([p.lat,p.lng],{icon}).addTo(map).on('click', ()=> showPoiDetail(p));
        marker.poiData = p;

}

// ==================== 分类筛选 ====================
function filterPOI(category) {
    currentFilterCategory = category;
    applyFilter(category);
    clearTimeout(filterTimeoutId);
    filterTimeoutId = setTimeout(() => {
        document.getElementById('categoryBar').classList.remove('show');
        document.getElementById('catTrigger').style.display = 'block';
    }, 5000);
    document.getElementById('categoryBar').classList.add('show');
    document.getElementById('catTrigger').style.display = 'none';
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.category === category);
    });
}

function applyFilter(category) {
    poiMarkers.forEach(marker => {
        const poi = marker.poiData;
        if (!poi) return;
        const cats = (poi.category||'').split(',').map(c => c.trim());
        const match = cats.some(c => c === category);
        if (match) {
            if (!marker._icon) map.addLayer(marker);
            marker.setIcon(L.divIcon({
                html: `<div style="background:${poiColors[category]||'#999'}; width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 12px rgba(0,0,0,0.5);"></div>`,
                iconSize: [30,30]
            }));
        } else {
            if (marker._icon) map.removeLayer(marker);
        }
    });
}

function clearFilter() {
    currentFilterCategory = null;
    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
    poiMarkers.forEach(marker => {
        if (!marker._icon) map.addLayer(marker);
        const poi = marker.poiData;
        if (poi) {
            const cat = (poi.category||'').split(',')[0]||'其他';
            const color = poiColors[cat]||'#999';
            marker.setIcon(L.divIcon({
                html: `<div style="background:${color}; width:20px; height:20px; border-radius:50%; border:2px solid white;"></div>`,
                iconSize: [20,20]
            }));
        }
    });
    document.getElementById('categoryBar').classList.remove('show');
    document.getElementById('catTrigger').style.display = 'block';
    clearTimeout(filterTimeoutId);
}

function toggleCategoryBar() {
    const bar = document.getElementById('categoryBar');
    if (bar.classList.contains('show')) {
        bar.classList.remove('show');
        document.getElementById('catTrigger').style.display = 'block';
    } else {
        bar.classList.add('show');
        document.getElementById('catTrigger').style.display = 'none';
        if (currentFilterCategory) {
            clearTimeout(filterTimeoutId);
            filterTimeoutId = setTimeout(() => {
                document.getElementById('categoryBar').classList.remove('show');
                document.getElementById('catTrigger').style.display = 'block';
            }, 5000);
        }
    }
}

// ==================== 核心行程生成算法（完全重构，满足所有需求） ====================

// 判断长耗时景区
function isLongSpot(spot) {
    return LONG_SPOT_NAMES.some(name => spot.name.includes(name));
}

// 获取县城景点列表
function getCountySpots() {
    return allPois.filter(p => {
        if (!p.name) return false;
        return COUNTY_SPOT_KEYWORDS.some(kw => p.name.includes(kw));
    }).map(p => ({
        id: p.id,
        name: p.name,
        lat: p.lat,
        lng: p.lng,
        visitDuration: p.visit_duration || 90,
        isCounty: true
    }));
}

// 获取交通耗时（分钟）
function getTravelTime(fromId, toId, mode) {
    return getTransportTime(fromId, toId, mode);
}

// ---- 核心函数：生成行程节点列表 ----
function generateTrip(selectedSpots, startDate, startTime, mode) {
    // 深拷贝
    let spots = selectedSpots.map(s => ({ ...s }));
    // 分类
    const longSpots = spots.filter(s => isLongSpot(s));
    const halfSpots = spots.filter(s => !isLongSpot(s) && s.visitDuration >= 100);
    const shortSpots = spots.filter(s => !isLongSpot(s) && s.visitDuration < 100);
    halfSpots.sort((a,b) => b.visitDuration - a.visitDuration);
    const countySpots = getCountySpots();
    const usedCountyIds = new Set();
    const usedShortIds = new Set();

    const orderedPois = []; // 存储所有节点（含交通、游览、就餐、返回）
    let currentDate = new Date(startDate);
    let currentMin = startTime;
    // 规范起始时间
    if (currentMin >= DAY_END) {
        currentDate.setDate(currentDate.getDate() + 1);
        currentMin = DAY_START;
    }
    if (currentMin < DAY_START) currentMin = DAY_START;
    let lastPoi = { id: 'county', name: '红军广场', lat: COUNTY.lat, lng: COUNTY.lng, visitDuration: 0, transportTime: 0 };

    // 辅助：插入就餐（午餐/晚餐），返回是否插入
    function insertMealIfNeeded() {
        if (currentMin >= LUNCH_TRIGGER && currentMin < LUNCH_END && (DAY_END - currentMin) >= 30) {
            const node = { id: 'meal_lunch', name: '午餐', visitDuration: MEAL_DURATION, transportTime: 0, isMeal: true };
            orderedPois.push(node);
            currentMin += MEAL_DURATION;
            return true;
        }
        if (currentMin >= DINNER_TRIGGER && currentMin < DINNER_END && (DAY_END - currentMin) >= 30) {
            const node = { id: 'meal_dinner', name: '晚餐', visitDuration: MEAL_DURATION, transportTime: 0, isMeal: true };
            orderedPois.push(node);
            currentMin += MEAL_DURATION;
            return true;
        }
        return false;
    }

    // 辅助：填充空窗期（使用短时或县城景点），尽量安排到 endMin
    function fillGap(endMin) {
        while (currentMin < endMin) {
            if (insertMealIfNeeded()) continue;
            let inserted = false;
            // 尝试短时
            for (let i = 0; i < shortSpots.length; i++) {
                const spot = shortSpots[i];
                if (usedShortIds.has(spot.id)) continue;
                let travel = getTravelTime(lastPoi.id, spot.id, mode);
                if (travel === null || travel === undefined) travel = 0;
                let needed = travel + spot.visitDuration;
                if (currentMin + needed <= endMin) {
                    const node = {
                        id: spot.id, name: spot.name, lat: spot.lat, lng: spot.lng,
                        visitDuration: spot.visitDuration, transportTime: travel,
                        isShort: true
                    };
                    orderedPois.push(node);
                    lastPoi = node;
                    currentMin += needed;
                    usedShortIds.add(spot.id);
                    inserted = true;
                    break;
                }
            }
            if (inserted) continue;
            // 尝试县城
            for (let c of countySpots) {
                if (usedCountyIds.has(c.id)) continue;
                let travel = getTravelTime(lastPoi.id, c.id, mode);
                if (travel === null || travel === undefined) travel = 0;
                let needed = travel + c.visitDuration;
                if (currentMin + needed <= endMin) {
                    const node = {
                        id: c.id, name: c.name, lat: c.lat, lng: c.lng,
                        visitDuration: c.visitDuration, transportTime: travel,
                        isCounty: true
                    };
                    orderedPois.push(node);
                    lastPoi = node;
                    currentMin += needed;
                    usedCountyIds.add(c.id);
                    inserted = true;
                    break;
                }
            }
            if (!inserted) break;
        }
    }

    // ---- 处理长耗时景区 ----
    for (let spot of longSpots) {
        // 如果当前不是08:00，则先结束当天，跳到次日08:00
        if (currentMin !== DAY_START) {
            // 填充当天剩余
            fillGap(DAY_END);
            // 如果当天已安排活动，则添加返回县城（仅当最后一项不是返回）
            if (orderedPois.length > 0 && !orderedPois[orderedPois.length-1].isReturn) {
                let travelBack = getTravelTime(lastPoi.id, 'county', mode);
                if (travelBack === null || travelBack === undefined) travelBack = 0;
                const returnNode = {
                    id: 'county', name: '返回县城', lat: COUNTY.lat, lng: COUNTY.lng,
                    visitDuration: 0, transportTime: travelBack, isReturn: true
                };
                orderedPois.push(returnNode);
                lastPoi = returnNode;
                currentMin += travelBack;
            }
            // 跳到次日08:00
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
        }

        // 计算交通
        let travelTime = getTravelTime(lastPoi.id, spot.id, mode);
        if (travelTime === null || travelTime === undefined) travelTime = 0;
        let needed = travelTime + spot.visitDuration;

        // 检查是否能在当天完成（必须 <= DAY_END）
        if (currentMin + needed > DAY_END) {
            // 无法完成，需顺延到次日（但长耗时不允许顺延，提示用户）
            // 这里采用：填充当天剩余，次日再试（但长耗时只能一天，如果超出则提示）
            // 但此处我们简化处理：如果超出，则尝试先安排短时，次日再安排长耗时
            // 但用户要求长耗时当天必须完成，所以若超出则报错
            alert(`长耗时景区 "${spot.name}" 所需时间（含交通）${needed}分钟，当天剩余时间不足，无法安排。请调整出发时间或减少景点。`);
            return { nodes: [], error: true };
        }

        // 安排长耗时景区
        const node = {
            id: spot.id, name: spot.name, lat: spot.lat, lng: spot.lng,
            visitDuration: spot.visitDuration, transportTime: travelTime,
            isLong: true
        };
        orderedPois.push(node);
        lastPoi = node;
        currentMin += needed;

        // 长耗时景区游览结束后，若还有剩余时间（<30分钟忽略），填充短时/县城
        if (DAY_END - currentMin >= 30) {
            fillGap(DAY_END);
        }

        // 必须返回县城
        if (orderedPois.length > 0 && !orderedPois[orderedPois.length-1].isReturn) {
            let travelBack = getTravelTime(lastPoi.id, 'county', mode);
            if (travelBack === null || travelBack === undefined) travelBack = 0;
            const returnNode = {
                id: 'county', name: '返回县城', lat: COUNTY.lat, lng: COUNTY.lng,
                visitDuration: 0, transportTime: travelBack, isReturn: true
            };
            orderedPois.push(returnNode);
            lastPoi = returnNode;
            currentMin += travelBack;
        }

        // 跳到次日08:00
        currentDate.setDate(currentDate.getDate() + 1);
        currentMin = DAY_START;
    }

    // ---- 处理半日景区（100-300分钟） ----
    let halfQueue = [...halfSpots];
    let attempts = 0;
    while (halfQueue.length > 0 && attempts < 100) {
        attempts++;
        let spot = halfQueue.shift();
        let travelTime = getTravelTime(lastPoi.id, spot.id, mode);
        if (travelTime === null || travelTime === undefined) travelTime = 0;
        let needed = travelTime + spot.visitDuration;

        // 判断当前时段
        let currentSlot = 'morning';
        if (currentMin >= LUNCH_END && currentMin < DINNER_TRIGGER) currentSlot = 'afternoon';
        else if (currentMin >= DINNER_TRIGGER) currentSlot = 'night';

        if (currentSlot === 'night') {
            // 结束当天
            fillGap(DAY_END);
            if (orderedPois.length > 0 && !orderedPois[orderedPois.length-1].isReturn) {
                let travelBack = getTravelTime(lastPoi.id, 'county', mode);
                if (travelBack === null || travelBack === undefined) travelBack = 0;
                const returnNode = {
                    id: 'county', name: '返回县城', lat: COUNTY.lat, lng: COUNTY.lng,
                    visitDuration: 0, transportTime: travelBack, isReturn: true
                };
                orderedPois.push(returnNode);
                lastPoi = returnNode;
                currentMin += travelBack;
            }
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
            currentSlot = 'morning';
            travelTime = getTravelTime(lastPoi.id, spot.id, mode);
            if (travelTime === null || travelTime === undefined) travelTime = 0;
            needed = travelTime + spot.visitDuration;
        }

        if (currentMin >= LUNCH_TRIGGER && currentMin < LUNCH_END) {
            currentMin = LUNCH_END;
            currentSlot = 'afternoon';
        }

        // 尝试上午（08:00-11:30）
        if (currentSlot === 'morning') {
            let blockStart = Math.max(currentMin, DAY_START);
            let blockEnd = LUNCH_TRIGGER;
            let available = blockEnd - blockStart;
            if (needed <= available) {
                const node = {
                    id: spot.id, name: spot.name, lat: spot.lat, lng: spot.lng,
                    visitDuration: spot.visitDuration, transportTime: travelTime,
                    isHalf: true
                };
                orderedPois.push(node);
                lastPoi = node;
                currentMin = blockStart + needed;
                // 填充上午剩余
                if (currentMin < blockEnd) fillGap(blockEnd);
                // 强制插入午餐（如果还没吃且时间进入午餐窗口）
                if (currentMin < LUNCH_END) {
                    const mealNode = { id: 'meal_lunch', name: '午餐', visitDuration: MEAL_DURATION, transportTime: 0, isMeal: true };
                    orderedPois.push(mealNode);
                    currentMin += MEAL_DURATION;
                }
                continue;
            } else {
                // 上午不够，填充上午，转入下午
                fillGap(LUNCH_TRIGGER);
                currentMin = LUNCH_END;
                currentSlot = 'afternoon';
                travelTime = getTravelTime(lastPoi.id, spot.id, mode);
                if (travelTime === null || travelTime === undefined) travelTime = 0;
                needed = travelTime + spot.visitDuration;
            }
        }

        // 尝试下午（12:30-17:30）
        if (currentSlot === 'afternoon') {
            let blockStart = Math.max(currentMin, LUNCH_END);
            let blockEnd = DINNER_TRIGGER;
            let available = blockEnd - blockStart;
            // 检查17:00后是否新安排（17:00 = 1020分钟）
            const NEW_ARRIVAL_CUTOFF = 1020; // 17:00
            if (blockStart >= NEW_ARRIVAL_CUTOFF) {
                // 已过17:00，不能安排新游览
                // 填充剩余时间，然后结束当天
                fillGap(DAY_END);
                if (orderedPois.length > 0 && !orderedPois[orderedPois.length-1].isReturn) {
                    let travelBack = getTravelTime(lastPoi.id, 'county', mode);
                    if (travelBack === null || travelBack === undefined) travelBack = 0;
                    const returnNode = {
                        id: 'county', name: '返回县城', lat: COUNTY.lat, lng: COUNTY.lng,
                        visitDuration: 0, transportTime: travelBack, isReturn: true
                    };
                    orderedPois.push(returnNode);
                    lastPoi = returnNode;
                    currentMin += travelBack;
                }
                currentDate.setDate(currentDate.getDate() + 1);
                currentMin = DAY_START;
                // 将该半日景区放回队列，次日再试
                halfQueue.push(spot);
                continue;
            }

            if (needed <= available) {
                const node = {
                    id: spot.id, name: spot.name, lat: spot.lat, lng: spot.lng,
                    visitDuration: spot.visitDuration, transportTime: travelTime,
                    isHalf: true
                };
                orderedPois.push(node);
                lastPoi = node;
                currentMin = blockStart + needed;
                if (currentMin < blockEnd) fillGap(blockEnd);
                // 填充剩余到18:00
                if (currentMin < DAY_END) fillGap(DAY_END);
                // 当天结束必须返回县城（半日景区）
                if (orderedPois.length > 0 && !orderedPois[orderedPois.length-1].isReturn) {
                    let travelBack = getTravelTime(lastPoi.id, 'county', mode);
                    if (travelBack === null || travelBack === undefined) travelBack = 0;
                    const returnNode = {
                        id: 'county', name: '返回县城', lat: COUNTY.lat, lng: COUNTY.lng,
                        visitDuration: 0, transportTime: travelBack, isReturn: true
                    };
                    orderedPois.push(returnNode);
                    lastPoi = returnNode;
                    currentMin += travelBack;
                }
                currentDate.setDate(currentDate.getDate() + 1);
                currentMin = DAY_START;
                continue;
            } else {
                // 下午不够，填充剩余，返回县城，次日再试
                fillGap(DINNER_TRIGGER);
                if (orderedPois.length > 0 && !orderedPois[orderedPois.length-1].isReturn) {
                    let travelBack = getTravelTime(lastPoi.id, 'county', mode);
                    if (travelBack === null || travelBack === undefined) travelBack = 0;
                    const returnNode = {
                        id: 'county', name: '返回县城', lat: COUNTY.lat, lng: COUNTY.lng,
                        visitDuration: 0, transportTime: travelBack, isReturn: true
                    };
                    orderedPois.push(returnNode);
                    lastPoi = returnNode;
                    currentMin += travelBack;
                }
                currentDate.setDate(currentDate.getDate() + 1);
                currentMin = DAY_START;
                halfQueue.push(spot);
                continue;
            }
        }
    }

    // ---- 处理剩余的短时景区和县城 ----
    let anyInserted = true;
    while (anyInserted) {
        anyInserted = false;
        // 检查是否已过17:00
        if (currentMin >= 1020) {
            // 不再安排新游览，直接跳出
            break;
        }
        // 尝试短时
        for (let i = 0; i < shortSpots.length; i++) {
            const spot = shortSpots[i];
            if (usedShortIds.has(spot.id)) continue;
            let travel = getTravelTime(lastPoi.id, spot.id, mode);
            if (travel === null || travel === undefined) travel = 0;
            let needed = travel + spot.visitDuration;
            let remaining = DAY_END - currentMin;
            if (needed <= remaining) {
                const node = {
                    id: spot.id, name: spot.name, lat: spot.lat, lng: spot.lng,
                    visitDuration: spot.visitDuration, transportTime: travel,
                    isShort: true
                };
                orderedPois.push(node);
                lastPoi = node;
                currentMin += needed;
                usedShortIds.add(spot.id);
                anyInserted = true;
                insertMealIfNeeded();
                break;
            }
        }
        if (anyInserted) continue;
        // 尝试县城
        for (let c of countySpots) {
            if (usedCountyIds.has(c.id)) continue;
            let travel = getTravelTime(lastPoi.id, c.id, mode);
            if (travel === null || travel === undefined) travel = 0;
            let needed = travel + c.visitDuration;
            let remaining = DAY_END - currentMin;
            if (needed <= remaining) {
                const node = {
                    id: c.id, name: c.name, lat: c.lat, lng: c.lng,
                    visitDuration: c.visitDuration, transportTime: travel,
                    isCounty: true
                };
                orderedPois.push(node);
                lastPoi = node;
                currentMin += needed;
                usedCountyIds.add(c.id);
                anyInserted = true;
                insertMealIfNeeded();
                break;
            }
        }
    }

    // 当天结束，如果还有剩余时间且最后一项不是返回县城，则根据最后一项类型决定
    if (currentMin < DAY_END) {
        if (orderedPois.length > 0 && !orderedPois[orderedPois.length-1].isReturn) {
            let lastNode = orderedPois[orderedPois.length-1];
            // 如果最后一项是长耗时或半日，强制返回
            if (lastNode.isLong || lastNode.isHalf) {
                let travelBack = getTravelTime(lastPoi.id, 'county', mode);
                if (travelBack === null || travelBack === undefined) travelBack = 0;
                const returnNode = {
                    id: 'county', name: '返回县城', lat: COUNTY.lat, lng: COUNTY.lng,
                    visitDuration: 0, transportTime: travelBack, isReturn: true
                };
                orderedPois.push(returnNode);
                lastPoi = returnNode;
                currentMin += travelBack;
            }
            // 短耗时景区不返回，但为了住宿，我们仍然添加返回，但仅在当天有活动且非短耗时情况下
            // 但规则是短耗时结束后不返回，所以不添加
        }
    }

    return { nodes: orderedPois, lastDate: currentDate, lastMin: currentMin };
}

// ---- 生成时间线显示 ----
function generateTimelineNew(nodes, startDate, startTime) {
    let curDate = new Date(startDate);
    let [h, m] = startTime.split(':').map(Number);
    let curMin = h * 60 + m;
    const lines = [];
    let mealCount = 0;

    function addLine(start, end, text, date) {
        const dateCopy = new Date(date);
        lines.push({ start, end, text, date: dateCopy });
    }

    // 遍历节点（跳过起点）
    for (let i = 1; i < nodes.length; i++) {
        const cur = nodes[i];
        if (cur.isMeal) {
            const start = curMin;
            curMin += cur.visitDuration;
            const end = curMin;
            addLine(start, end, `🍽️ ${cur.name} (${formatTime(start)}-${formatTime(end)})`, curDate);
            mealCount++;
            continue;
        }

        // 交通
        if (cur.transportTime > 0) {
            const start = curMin;
            curMin += cur.transportTime;
            // 跨天处理（交通可能跨天，但需求不允许跨天，但这里保留）
            let daysPassed = Math.floor(curMin / 1440);
            if (daysPassed > 0) {
                curDate.setDate(curDate.getDate() + daysPassed);
                curMin = curMin % 1440;
            }
            const end = curMin;
            let destName = cur.name;
            if (cur.isReturn || cur.name === '返回县城') {
                destName = '返回县城';
            } else if (!destName.startsWith('前往 ')) {
                destName = '前往 ' + destName;
            }
            addLine(start, end, `🚗 ${formatTime(start)}-${formatTime(end)} ${destName} (交通${cur.transportTime}分钟)`, curDate);
        }

        // 游览（非就餐、非返回）
        if (cur.visitDuration > 0 && !cur.isMeal && !cur.isReturn && cur.name !== '返回县城') {
            const start = curMin;
            curMin += cur.visitDuration;
            let daysPassed = Math.floor(curMin / 1440);
            if (daysPassed > 0) {
                curDate.setDate(curDate.getDate() + daysPassed);
                curMin = curMin % 1440;
            }
            const end = curMin;
            addLine(start, end, `⏱️ ${formatTime(start)}-${formatTime(end)} 游览 ${cur.name} (游览${cur.visitDuration}分钟)`, curDate);
        } else if (cur.visitDuration === 0 && !cur.isMeal && !cur.isReturn && cur.name !== '返回县城') {
            // 非游览POI（如美食街）
            addLine(curMin, curMin, `📍 ${formatTime(curMin)} 到达 ${cur.name}`, curDate);
        }
    }

    // 按天分组
    const daysMap = {};
    lines.forEach(l => {
        const key = l.date.toLocaleDateString('zh-CN');
        if (!daysMap[key]) daysMap[key] = [];
        daysMap[key].push(l.text);
    });
    // 添加“当天行程结束，住宿休息”行
    Object.keys(daysMap).forEach(date => {
        if (daysMap[date].length > 0) {
            daysMap[date].push('🌙 当天行程结束，住宿休息');
        }
    });
    const days = Object.keys(daysMap).map(date => ({ date, lines: daysMap[date] }));
    return { days, mealCount };
}

// ---- 自设行程生成入口 ----
async function generateCustomTrip() {
    const checkboxes = document.querySelectorAll('#dynamic-route input[type="checkbox"]:checked');
    const selectedIds = [];
    checkboxes.forEach(cb => {
        const id = cb.value;
        if (id && id !== 'county' && id !== 'mylocation') {
            selectedIds.push(id);
        }
    });
    if (selectedIds.length === 0) return alert('请至少选择一个景区');

    const dateStr = document.getElementById('trip-date').value;
    const startTime = getSelectedTime();
    if (!dateStr) return alert('选择出发日期');
    if (!startTime) return alert('选择出发时间');
    const now = new Date();
    if (new Date(dateStr + 'T' + startTime) < now) {
        alert('出发时间不能早于当前时间');
        return;
    }
    const mode = document.getElementById('trip-mode').value;
    const people = document.getElementById('trip-people').value;

    const userSpots = [];
    for (let id of selectedIds) {
        const poi = allPois.find(p => p.id == id);
        if (!poi) continue;
        userSpots.push({
            id: poi.id,
            name: poi.name,
            lat: poi.lat,
            lng: poi.lng,
            visitDuration: poi.visit_duration || 60
        });
    }

    // 调用生成算法
    const { nodes, error } = generateTrip(userSpots, dateStr, parseInt(startTime.slice(0,2))*60 + parseInt(startTime.slice(3)), mode);
    if (error) return;

    const { days, mealCount } = generateTimelineNew(nodes, dateStr, startTime);

    // 天气
    const weatherForecast = await fetchWeatherForecast();
    const daysWithWeather = days.map((d, i) => {
        let weatherTip = '⚠️ 天气信息暂不可用。';
        if (weatherForecast && i < weatherForecast.length) {
            weatherTip = getDayWeatherTip(weatherForecast[i]);
        }
        return { ...d, weatherTip };
    });

    // 构建HTML
    let html = '';
    daysWithWeather.forEach((d, i) => {
        html += `<div class="day-header">📅 第${i+1}天 (${d.date})</div>`;
        if (d.lines.length === 0) {
            html += `<div class="trip-line">🚫 当天无行程安排</div>`;
        } else {
            d.lines.forEach(l => html += `<div class="trip-line">${l}</div>`);
        }
        html += `<div class="trip-line" style="color:#0d47a1;">${d.weatherTip}</div>`;
    });

    // 统计
    let totalTransport = 0, totalVisit = 0;
    nodes.forEach(n => {
        if (n.isReturn || n.name === '返回县城') return;
        if (n.transportTime) totalTransport += n.transportTime;
        if (n.visitDuration) totalVisit += n.visitDuration;
    });
    let totalActivity = totalTransport + totalVisit;
    let tips = [];
    tips.push(`📊 活动总时长：${totalActivity}分钟（约${(totalActivity/60).toFixed(1)}小时），其中交通${totalTransport}分钟，游览${totalVisit}分钟。`);
    if (mealCount > 0) tips.push(`🍴 包含 ${mealCount} 次用餐。`);
    if (days.length > 1) tips.push(`🏨 行程跨${days.length}天，请合理安排住宿。`);

    generatedTripData = {
        name: '自设行程',
        date: dateStr,
        time: startTime,
        mode: mode,
        people: people,
        nodes: nodes.map(n => ({ id: n.id, name: n.name })),
        days: daysWithWeather,
        tips: tips
    };

    document.getElementById('generated-trip').innerHTML = `<div class="card">${html}</div>`;
    document.getElementById('trip-warnings').innerHTML = tips.length ? `<div class="warn-list"><strong>💡 温馨提示：</strong>${tips.map(t=>`<div>${t}</div>`).join('')}</div>` : '';
    document.getElementById('saveGeneratedTripBtn').classList.remove('hidden');
}

// ---- 推荐路线使用（自动保存） ----
async function useRoute(routeId) {
    const detailPanel = document.getElementById('routeDetailPanel');
    if(detailPanel) detailPanel.remove();
    openPanel('routesPanel');
    document.getElementById('customTripSection').classList.remove('hidden');
    
    // 获取路线信息
    const { data: route } = await sb.from('ztj_routes').select('*').eq('id', routeId).single();
    if (!route) { alert('路线不存在'); return; }

    // 获取节点
    const { data: nodes } = await sb.from('ztj_route_nodes').select('poi_id').eq('route_id', routeId).order('order_num');
    if (!nodes || nodes.length === 0) { alert('该路线无节点'); return; }
    const poiIds = nodes.map(n => n.poi_id);

    // 勾选对应节点
    document.querySelectorAll('#dynamic-route input[type="checkbox"]').forEach(cb => cb.checked = false);
    poiIds.forEach(id => {
        const cb = document.querySelector(`#dynamic-route input[value="${id}"]`);
        if(cb) cb.checked = true;
    });
    routeLegs = poiIds.map(id => {
        const poi = allPois.find(p => p.id == id);
        return poi ? { id: poi.id, name: poi.name, lat: poi.lat, lng: poi.lng } : null;
    }).filter(p => p);

    // 生成行程
    await generateCustomTrip();

    // 自动保存到我的行程
    if (generatedTripData) {
        // 生成名称：路线名称-日期
        const today = new Date().toISOString().slice(0,10);
        generatedTripData.name = `${route.name}-${today}`;
        const trips = JSON.parse(localStorage.getItem('trips')||'[]');
        trips.push(generatedTripData);
        localStorage.setItem('trips', JSON.stringify(trips));
        alert(`✅ 推荐路线 "${route.name}" 已自动保存到“我的行程”`);
        // 清空生成数据以便重新生成
        document.getElementById('saveGeneratedTripBtn').classList.add('hidden');
        // 注意：保留generatedTripData以便后续手动保存，但这里自动保存后，用户可继续修改
        // 为了不重复保存，可在保存后重置generatedTripData? 但用户可能想手动再次保存，所以保留
        // 但手动保存时会用新名称，所以保留
    }
}

    if(!document.getElementById('customTripSection').classList.contains('hidden')){
        buildMainPoiOptions();

function buildMainPoiOptions(){
    const allMain = allPois.filter(p => !p.parent_id);
    mainPoiOptions = allMain.filter(p => p.id !== 'county');
    if (currentGcjPos) mainPoiOptions.unshift({ id:'mylocation', name:'📍 我的位置', lat: currentGcjPos.lat, lng: currentGcjPos.lng });
    mainPoiOptions.unshift(COUNTY);
    const allowedLower = ALLOWED_CATEGORIES.map(c => c.toLowerCase());
    allowedPoiOptions = allMain.filter(p => {
        if(!p.category) return false;
        const cats = p.category.split(',').map(c => c.trim().toLowerCase());
        return cats.some(c => allowedLower.includes(c));
    });
    if(!allowedPoiOptions.some(p => p.id === 'county')) allowedPoiOptions.unshift(COUNTY);
}

function resetRouteLegs(){ routeLegs=[]; renderDynamicRoute(); }

function renderDynamicRoute(){
    const poiList = allowedPoiOptions.filter(p => p.id !== 'county' && p.id !== 'mylocation');
    let html = '';
    poiList.forEach(p => {
        const dur = p.visit_duration || 0;
        const checked = routeLegs.some(l => l.id === p.id) ? 'checked' : '';
        html += `<div class="checkbox-item">
            <input type="checkbox" value="${p.id}" ${checked} onchange="toggleSpot('${p.id}')" id="chk-${p.id}">
            <label for="chk-${p.id}">${p.name}（${dur}分钟）</label>
        </div>`;
    });
    document.getElementById('dynamic-route').innerHTML = html || '<p>暂无可用景点</p>';
}

function toggleSpot(id) {
    const idx = routeLegs.findIndex(l => l.id === id);
    if (idx >= 0) routeLegs.splice(idx, 1);
    else {
        const poi = allPois.find(p => p.id == id);
        if (poi) routeLegs.push({ id: poi.id, name: poi.name, lat: poi.lat, lng: poi.lng });
    }
}

// ==================== 保存行程（手动） ====================
function saveGeneratedTrip() {
    if(!generatedTripData) return;
    const name = prompt('行程名称', generatedTripData.name);
    if(!name) return;
    generatedTripData.name = name;
    const trips = JSON.parse(localStorage.getItem('trips')||'[]');
    trips.push(generatedTripData);
    localStorage.setItem('trips', JSON.stringify(trips));
    alert('行程已保存');
    document.getElementById('saveGeneratedTripBtn').classList.add('hidden');
    document.getElementById('generated-trip').innerHTML = '';
    generatedTripData = null;
    resetRouteLegs();
}

// ==================== 我的面板功能 ====================
function switchMyTab(tab) {
    document.querySelectorAll('.my-tab').forEach(btn => btn.classList.remove('active'));
    document.getElementById('my-tab-' + tab).classList.add('active');
    document.getElementById('myTripContent').classList.toggle('hidden', tab !== 'trip');
    document.getElementById('myReservationContent').classList.toggle('hidden', tab !== 'reservation');
    document.getElementById('myFeedbackContent').classList.toggle('hidden', tab !== 'feedback');
    if(tab === 'trip') renderMyTrip();
    if(tab === 'reservation') loadMyReservations();
    if(tab === 'feedback') loadFeedbackHistory();
}

function renderMyTrip() {
    const trips = JSON.parse(localStorage.getItem('trips')||'[]');
    let html = '';
    trips.forEach((trip, i) => {
        html += `<div class="card"><div class="collapse-header" onclick="toggleTripDetail(${i})">📅 ${trip.name} | ${trip.date} ${trip.time}</div><div id="trip-detail-${i}" class="hidden">`;
        if(trip.days) trip.days.forEach(day => {
            html += `<div class="day-header">📅 ${day.date}</div>`;
            day.lines.forEach(l => html += `<div class="trip-line">${l}</div>`);
            if (day.weatherTip) {
                html += `<div class="trip-line" style="color:#0d47a1;">${day.weatherTip}</div>`;
            }
        });
        if(trip.tips) html += `<div class="warn-list">${trip.tips.map(t=>`<div>${t}</div>`).join('')}</div>`;
        html += `<button class="btn btn-danger" onclick="event.stopPropagation(); deleteTrip(${i})">删除</button></div></div>`;
    });
    document.getElementById('myTripContent').innerHTML = html || '<p>暂无保存的行程</p>';
}

window.toggleTripDetail = function(idx){ document.getElementById('trip-detail-'+idx).classList.toggle('hidden'); };

function deleteTrip(idx){
    const trips = JSON.parse(localStorage.getItem('trips')||'[]');
    trips.splice(idx,1);
    localStorage.setItem('trips', JSON.stringify(trips));
    renderMyTrip();
}

async function loadMyReservations() {
    const { data } = await sb.from('reservations').select('*').eq('user_id', getUserId()).order('created_at', { ascending: false });
    let html = '';
    if(data && data.length) {
        data.forEach(r => {
            html += `<div class="card"><p><b>${r.reservation_date}</b> ${r.time_slot_start}-${r.time_slot_end}</p><p>${r.name} | ${r.phone}</p><p>${r.remark||''}</p><p>状态：${r.status}</p></div>`;
        });
    } else {
        html = '<p>暂无预约</p>';
    }
    document.getElementById('myReservationContent').innerHTML = html;
}

async function loadFeedbackHistory() {
    const { data } = await sb.from('ztj_feedbacks').select('*').eq('user_id', getUserId()).order('created_at', { ascending: false });
    let html = '';
    if(data && data.length) {
        data.forEach(f => {
            html += `<div class="card"><p>${f.message}</p><small>${new Date(f.created_at).toLocaleString()}</small>`;
            if(f.reply) html += `<div class="feedback-reply">回复：${f.reply}</div>`;
            html += `</div>`;
        });
    } else {
        html = '<p>暂无留言</p>';
    }
    document.getElementById('feedbackHistory').innerHTML = html;
}

async function submitFeedback() {
    const msg = document.getElementById('feedbackMsg').value.trim();
    if(!msg) return alert('请输入内容');
    const { error } = await sb.from('ztj_feedbacks').insert({
        user_id: getUserId(),
        message: msg,
        merchant_id: null
    });
    if(error) alert('提交失败：'+error.message);
    else {
        alert('提交成功');
        document.getElementById('feedbackMsg').value = '';
        loadFeedbackHistory();
    }
}

// ==================== 面板控制 ====================
function openPanel(id){
    document.getElementById(id).classList.add('active');
    if(id === 'routesPanel') {
        loadRoutes();
        buildMainPoiOptions();
        resetRouteLegs();
    }
    if(id === 'myPanel') {
        switchMyTab('trip');
    }
}
function closePanel(id){ document.getElementById(id).classList.remove('active'); }

function startSimulation(){ alert('模拟导航功能即将上线'); }

    initMap();

};
