<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智游通江 - 智能行程规划</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; background: #f0f2f5; }
        .hidden { display: none !important; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .top-bar { position: fixed; top: max(12px, env(safe-area-inset-top, 12px)); left: 50%; transform: translateX(-50%); z-index: 1700; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.92); padding: 6px 16px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); backdrop-filter: blur(8px); height: 44px; cursor: pointer; white-space: nowrap; }
        .top-bar .brand { font-weight: 700; color: #1b5e20; font-size: 18px; display: flex; align-items: center; gap: 6px; user-select: none; }
        .top-bar .brand i { font-size: 20px; }
        .category-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1600; background: rgba(255,255,255,0.98); box-shadow: 0 4px 20px rgba(0,0,0,0.1); transform: translateY(-100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-wrap: wrap; padding: 12px 16px; gap: 8px; border-bottom: 1px solid #e8f5e9; backdrop-filter: blur(8px); pointer-events: none; max-height: 70vh; overflow-y: auto; padding-top: calc(60px + env(safe-area-inset-top, 12px)); }
        .category-bar.show { transform: translateY(0); pointer-events: auto; }
        .category-bar .cat-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #e0e0e0; background: white; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; color: #333; }
        .category-bar .cat-btn:hover { background: #e8f5e9; border-color: #2e7d32; }
        .bottom-nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1500; display: flex; gap: 6px; background: rgba(255,255,255,0.95); padding: 8px 16px; border-radius: 40px; box-shadow: 0 4px 24px rgba(0,0,0,0.18); backdrop-filter: blur(8px); align-items: center; max-width: 95%; }
        .bottom-nav .nav-btn { padding: 8px 16px; border: none; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; background: transparent; color: #555; white-space: nowrap; }
        .bottom-nav .nav-btn:hover { background: #e8f5e9; color: #1b5e20; }
        .bottom-nav .nav-btn.primary { background: #1b5e20; color: white; }
        .float-btn { position: fixed; z-index: 1500; background: white; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.25); cursor: pointer; font-size: 20px; border: none; transition: all 0.2s; }
        .float-btn:hover { transform: scale(1.08); }
        .locate-btn { bottom: 110px; right: 20px; }
        .voice-btn { bottom: 170px; right: 20px; }
        .panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 2000; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; display: flex; flex-direction: column; }
        .panel.active { transform: translateY(0); }
        .panel-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; position: sticky; top: 0; z-index: 10; min-height: 64px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
        .panel-header h2 { font-size: 18px; font-weight: 700; margin: 0; color: #1b5e20; }
        .panel-header .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; padding: 4px 8px; border-radius: 8px; }
        .panel-body { flex: 1; padding: 16px 20px; overflow-y: auto; padding-bottom: 30px; }
        .card-modern { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
        .card-modern .card-title { font-weight: 600; font-size: 16px; margin-bottom: 6px; color: #1b5e20; }
        .card-modern .card-sub { font-size: 13px; color: #888; }
        .trip-day-container { background: white; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; border-left: 5px solid #1b5e20; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .trip-day-title { font-weight: 700; font-size: 17px; color: #1b5e20; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e8f5e9; padding-bottom: 8px; }
        .trip-timeline { position: relative; padding-left: 24px; }
        .trip-timeline::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 3px; background: #e0e0e0; border-radius: 2px; }
        .trip-node { position: relative; padding: 6px 0 6px 16px; margin-bottom: 2px; display: flex; align-items: flex-start; gap: 12px; border-radius: 6px; transition: 0.2s; }
        .trip-node::before { content: ''; position: absolute; left: -18px; top: 12px; width: 12px; height: 12px; border-radius: 50%; border: 3px solid #1b5e20; background: white; }
        .trip-node:hover { background: #f8f9fa; }
        .trip-node .node-time { min-width: 110px; font-weight: 500; color: #333; font-size: 14px; font-family: monospace; flex-shrink: 0; }
        .trip-node .node-icon { width: 28px; text-align: center; flex-shrink: 0; font-size: 16px; }
        .trip-node .node-content { flex: 1; font-size: 14px; color: #333; padding: 2px 0; line-height: 1.5; }
        .trip-node .node-content .node-duration { color: #666; font-size: 12px; background: #f0f0f0; padding: 1px 8px; border-radius: 12px; margin-left: 6px; white-space: nowrap; }
        .trip-node.type-transport::before { border-color: #1565C0; background: #1565C0; }
        .trip-node.type-visit::before { border-color: #2E7D32; background: #2E7D32; }
        .trip-node.type-meal::before { border-color: #E65100; background: #E65100; }
        .trip-node.type-accommodation::before { border-color: #6A1B9A; background: #6A1B9A; }
        .trip-node.type-weather::before { border-color: #00BCD4; background: #00BCD4; }
        .trip-node.type-reminder::before { border-color: #C62828; background: #C62828; }
        .trip-node.type-waiting::before { border-color: #FF6F00; background: #FF6F00; }
        .trip-node.type-rest::before { border-color: #8D6E63; background: #8D6E63; }
        .trip-node.type-trip_end::before { border-color: #2E7D32; background: #2E7D32; }
        .trip-node .icon-transport { color: #1565C0; }
        .trip-node .icon-visit { color: #2E7D32; }
        .trip-node .icon-meal { color: #E65100; }
        .trip-node .icon-accommodation { color: #6A1B9A; }
        .trip-node .icon-weather { color: #00BCD4; }
        .trip-node .icon-reminder { color: #C62828; }
        .trip-node .icon-rest { color: #8D6E63; }
        .trip-node .icon-trip_end { color: #2E7D32; }
        .trip-node .weather-text { color: #0D47A1; font-weight: 500; }
        .trip-node .reminder-text { color: #C62828; font-weight: 500; background: #ffebee; padding: 2px 10px; border-radius: 12px; }
        .trip-node .trip-end-text { color: #2E7D32; font-weight: 700; font-size: 15px; }
        .poi-category-group { margin-bottom: 12px; }
        .poi-category-title { font-weight: 600; color: #1b5e20; background: #e8f5e9; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .poi-category-title:hover { background: #c8e6c9; }
        .poi-category-content { padding-left: 12px; margin-top: 4px; }
        .poi-item { padding: 4px 0; border-bottom: 1px solid #f5f5f5; }
        .poi-item .poi-name { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .poi-item .poi-name input[type="checkbox"] { margin-right: 4px; }
        .poi-item .poi-sub-list { padding-left: 24px; margin-top: 4px; }
        .poi-item .poi-sub-list .sub-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
        .poi-item .poi-sub-list .sub-item input[type="checkbox"] { margin-right: 4px; }
        .poi-item .poi-duration-badge { font-size: 12px; color: #888; margin-left: 8px; }
        .sub-type-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 600; }
        .sub-type-core { background: #fff3e0; color: #e65100; }
        .sub-type-spot { background: #f3e5f5; color: #6a1b9a; }
        .total-duration { font-weight: 600; color: #1b5e20; background: #e8f5e9; padding: 6px 12px; border-radius: 6px; text-align: center; margin-top: 10px; }
        .poi-select-list { max-height: 400px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; padding: 8px; }
        .reservation-form { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-top: 10px; }
        .reservation-form .form-group { margin-bottom: 8px; }
        .reservation-form label { font-weight: 500; font-size: 14px; }
        .reservation-form input, .reservation-form select, .reservation-form textarea { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .biz-image-box { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-top: 8px; }
        .biz-image-box img { width: 100%; height: 100%; object-fit: cover; }
        @media (max-width: 640px) {
            .top-bar { top: max(8px, env(safe-area-inset-top, 8px)); padding: 4px 12px; height: 38px; }
            .top-bar .brand { font-size: 15px; }
            .bottom-nav { padding: 6px 12px; gap: 4px; }
            .bottom-nav .nav-btn { font-size: 12px; padding: 6px 12px; }
            .float-btn { width: 40px; height: 40px; font-size: 16px; }
            .locate-btn { bottom: 100px; right: 12px; }
            .voice-btn { bottom: 155px; right: 12px; }
            .panel-body { padding: 12px 14px; }
            .category-bar { padding-top: calc(54px + env(safe-area-inset-top, 8px)); }
            .category-bar .cat-btn { font-size: 12px; padding: 4px 10px; }
            .trip-node .node-time { min-width: 80px; font-size: 12px; }
            .trip-timeline { padding-left: 16px; }
            .trip-node { padding: 4px 0 4px 12px; gap: 8px; }
            .trip-node::before { left: -14px; top: 10px; width: 10px; height: 10px; }
        }
        .text-green { color: #1b5e20; }
        .btn-primary-custom { background: #1b5e20; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .btn-primary-custom:hover { background: #2e7d32; }
        .btn-outline-custom { background: transparent; color: #1b5e20; border: 2px solid #1b5e20; padding: 8px 16px; border-radius: 8px; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .btn-outline-custom:hover { background: #1b5e20; color: white; }
        .btn-warning-custom { background: #ff9800; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .btn-warning-custom:hover { background: #fb8c00; }
        .btn-danger-custom { background: #dc3545; color: white; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .order-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #f0f0f0; }
        .order-item:last-child { border-bottom: none; }
        .order-item .order-name { font-size: 14px; color: #333; }
        .order-item .order-actions button { padding: 2px 8px; font-size: 12px; margin-left: 4px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar" id="topBar">
    <span class="brand" id="brandToggle"><i class="fas fa-leaf"></i> 智游通江</span>
</div>

<div class="category-bar" id="categoryBar">
    <button class="cat-btn" onclick="window.filterPOI('自然景区')">🏔️ 自然景区</button>
    <button class="cat-btn" onclick="window.filterPOI('红色景区')">🔴 红色景区</button>
    <button class="cat-btn" onclick="window.filterPOI('文博场馆')">🏛️ 文博场馆</button>
    <button class="cat-btn" onclick="window.filterPOI('餐饮住宿')">🍽️ 餐饮住宿</button>
    <button class="cat-btn" onclick="window.filterPOI('交通枢纽')">🚌 交通枢纽</button>
    <button class="cat-btn" onclick="window.filterPOI('游玩娱乐')">🎢 游玩娱乐</button>
    <button class="cat-btn" onclick="window.filterPOI('购物消费')">🛍️ 购物消费</button>
    <button class="cat-btn" onclick="window.filterPOI('公共服务')">🏛️ 公共服务</button>
    <button class="cat-btn" onclick="window.clearFilter()">✕ 清除筛选</button>
</div>

<div class="bottom-nav" id="bottomNav">
    <button class="nav-btn primary" onclick="window.openPanel('planPanel')"><i class="fas fa-wand-magic-sparkles"></i> 智能规划</button>
    <button class="nav-btn" onclick="window.openPanel('myPanel')"><i class="fas fa-user"></i> 我的</button>
</div>

<button class="float-btn locate-btn" onclick="window.locateUser()"><i class="fas fa-crosshairs"></i></button>
<button class="float-btn voice-btn" id="voiceToggleBtn" onclick="window.toggleVoice()"><i class="fas fa-volume-high"></i></button>

<!-- 面板：智能规划 -->
<div class="panel" id="planPanel">
    <div class="panel-header">
        <h2><i class="fas fa-route text-green"></i> 智能行程规划</h2>
        <button class="close-btn" onclick="window.closePanel('planPanel')">&times;</button>
    </div>
    <div class="panel-body">
        <div id="stepPreferences">
            <div class="row g-2 mt-2">
                <div class="col-6"><label class="form-label fw-semibold">出发日期</label><input type="date" id="planStartDate" class="form-control" /></div>
                <div class="col-6"><label class="form-label fw-semibold">出发时间</label><select id="planStartTime" class="form-select"></select></div>
                <div class="col-6">
                    <label class="form-label fw-semibold">出发地点</label>
                    <select id="planStartLocation" class="form-select">
                        <option value="county">红军广场（县城）</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold">住宿地点</label>
                    <select id="planLodging" class="form-select">
                        <option value="all" selected>全部（智能决定）</option>
                        <option value="county">县城（每天返回县城）</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">行程风格</label>
                    <select id="planStyle" class="form-select" onchange="window.onStyleChange()">
                        <option value="compact">🚀 紧凑型（仅核心节点）</option>
                        <option value="relaxed" selected>🌿 舒适型（核心节点+经典景点）</option>
                        <option value="indepth">🔍 深度游（核心节点+全部景点）</option>
                    </select>
                </div>
            </div>

            <div class="mt-2">
                <label class="form-label fw-semibold">选择景点</label>
                <div id="poiSelectContainer" class="poi-select-list" style="max-height:400px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:8px;padding:8px;">
                    <div class="text-secondary text-center py-2">加载景点中...</div>
                </div>
                <div class="total-duration" id="selectedDurationDisplay">已选景点总游览时长：0 分钟</div>
                <div class="mt-1">
                    <button class="btn btn-sm btn-outline-secondary" onclick="window.selectAllPois(true)">全选</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="window.selectAllPois(false)">取消全选</button>
                    <span class="ms-2 text-secondary" id="selectedPoiCount">已选 0 个</span>
                </div>
            </div>

            <div class="mt-2">
                <label class="form-label fw-semibold">景点顺序（可上下调整）</label>
                <div id="selectedOrderContainer" class="border rounded p-2" style="min-height:40px;background:#fafafa;">
                    <span class="text-secondary">尚未选择景点</span>
                </div>
            </div>

            <button class="btn btn-primary-custom w-100 mt-3" id="generatePlanBtn"><i class="fas fa-wand-magic-sparkles"></i> 生成行程方案</button>
            <div id="planLoading" class="text-center mt-3 hidden">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-2 text-secondary">正在为您规划最优行程，请稍候...</p>
            </div>
        </div>

        <div id="stepDetail" class="hidden">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5><i class="fas fa-map text-green"></i> 我的行程</h5>
                <div>
                    <button class="btn btn-secondary btn-sm me-1" onclick="window.backToPreferences()"><i class="fas fa-arrow-left"></i> 重新选择</button>
                </div>
            </div>
            <div id="tripDetailContainer"></div>
            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-primary-custom flex-grow-1" onclick="window.saveTripSolution()"><i class="fas fa-save"></i> 保存行程</button>
                <button class="btn btn-outline-custom" onclick="window.startNavigation()"><i class="fas fa-location-dot"></i> 开始导航</button>
                <button class="btn btn-warning-custom" onclick="window.regenerateTrip()"><i class="fas fa-rotate"></i> 重新生成</button>
            </div>
        </div>
    </div>
</div>

<!-- 面板：我的 -->
<div class="panel" id="myPanel">
    <div class="panel-header"><h2><i class="fas fa-user text-green"></i> 我的</h2><button class="close-btn" onclick="window.closePanel('myPanel')">&times;</button></div>
    <div class="panel-body">
        <ul class="nav nav-tabs" id="myTabs">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#myTrips">📅 行程</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#myReservations">📋 预约</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#myFeedback">💬 留言</a></li>
        </ul>
        <div class="tab-content mt-3">
            <div class="tab-pane active" id="myTrips"><div id="myTripsContent"></div></div>
            <div class="tab-pane" id="myReservations"><div id="myReservationsContent"></div></div>
            <div class="tab-pane" id="myFeedback"><textarea id="feedbackMsg" class="form-control" rows="3" placeholder="建议或问题..."></textarea><button class="btn btn-primary-custom mt-2" onclick="window.submitFeedback()">提交</button><div id="feedbackHistory" class="mt-3"></div></div>
        </div>
    </div>
</div>

<!-- 商户详情面板 -->
<div class="panel" id="merchantDetailPanel">
    <div class="panel-header"><h2 id="merchantDetailTitle">商户详情</h2><button class="close-btn" onclick="window.closePanel('merchantDetailPanel')">&times;</button></div>
    <div class="panel-body" id="merchantDetailContent"></div>
</div>

<!-- 导航面板 -->
<div class="panel" id="navPanel">
    <div class="panel-header"><h2><i class="fas fa-compass text-green"></i> 实时导航</h2><button class="close-btn" onclick="window.closePanel('navPanel')">&times;</button></div>
    <div class="panel-body"><div id="navContent"><div class="d-flex justify-content-between align-items-center"><span class="fw-bold">今日进度</span><span id="navProgressText">0%</span></div><div class="progress-bar-custom"><div class="fill" id="navProgressBar" style="width:0%"></div></div><div id="navCurrentNode" class="card-modern"><div class="card-title" id="navPoiName">准备出发</div><div class="card-sub" id="navPoiStatus">等待开始导航...</div></div><div id="navTimeline" class="mt-3"></div><button class="btn btn-danger w-100 mt-3" onclick="window.endNavigation()"><i class="fas fa-stop"></i> 结束导航</button></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="importmap">
{
    "imports": {
        "./config.js": "./js/config.js",
        "./api.js": "./js/api.js",
        "./auth.js": "./js/auth.js",
        "./utils.js": "./js/utils.js",
        "./map.js": "./js/map.js",
        "./trip-planner.js": "./js/trip-planner.js",
        "./trip-executor.js": "./js/trip-executor.js",
        "./user.js": "./js/user.js"
    }
}
</script>

<script type="module">
import {
    getPois, getMerchantsByPoi, getTransportPresets,
    insertReservation, insertFeedback,
    getReservationsByDevice, getFeedbacksByDevice,
    deleteReservation, deleteFeedback
} from './js/api.js';
import { initMap, loadPoisToMap, locateUser, setVoiceEnabled, clearFilter, applyFilter } from './js/map.js';
import { generateTripPlan } from './js/trip-planner.js';
import { startNavigation, endNavigation } from './js/trip-executor.js';

// ===== 设备ID =====
function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        localStorage.setItem('deviceId', id);
    }
    return id;
}
const DEVICE_ID = getDeviceId();

function getLocalData(key) {
    try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
}
function setLocalData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

// ===== 缓存 =====
const CACHE_TTL = 5 * 60 * 1000;
const CACHE_PREFIX = 'ztj_cache_';
function getCache(key) {
    try {
        const raw = localStorage.getItem(CACHE_PREFIX + key);
        if (!raw) return null;
        const { data, ts } = JSON.parse(raw);
        if (Date.now() - ts > CACHE_TTL) return null;
        return data;
    } catch { return null; }
}
function setCache(key, data) {
    try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ data, ts: Date.now() })); } catch {}
}
async function getPoisCached() {
    const cached = getCache('pois');
    if (cached) return cached;
    const data = await getPois();
    setCache('pois', data);
    return data;
}
async function getTransportPresetsCached() {
    const cached = getCache('transport');
    if (cached) return cached;
    const data = await getTransportPresets();
    setCache('transport', data);
    return data;
}

// ===== 状态中文 =====
const STATUS_MAP = { pending: '待确认', confirmed: '已确认', rejected: '已拒绝', cancelled: '已取消' };
function translateStatus(s) { return STATUS_MAP[s] || s || '未知'; }

// ===== 全局状态 =====
let allPois = [];
let currentTripData = null;
let selectedPoiIds = new Set();       // 已勾选的顶层 POI id（字符串）
let selectedSubItems = {};            // { poiId: Set of subItemId }
let selectedPoiOrder = [];            // 顶层 POI 顺序
let accommodationPois = [];

// ===== 工具 =====
function fmtTime(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// ===== 行程风格自动勾选规则 =====
function getStyleAutoSelection(style, subItems) {
    // subItems: 该 POI 的所有子项
    const coreNodes = subItems.filter(s => s.type === 'core_node');
    const spots = subItems.filter(s => s.type === 'spot');

    if (style === 'compact') {
        return { coreNodes: coreNodes.map(s => s.id), spots: [] };
    } else if (style === 'relaxed') {
        const featured = spots.filter(s => s.is_featured).slice(0, 2);
        return { coreNodes: coreNodes.map(s => s.id), spots: featured.map(s => s.id) };
    } else if (style === 'indepth') {
        return { coreNodes: coreNodes.map(s => s.id), spots: spots.map(s => s.id) };
    }
    return { coreNodes: coreNodes.map(s => s.id), spots: [] };
}

// ===== 切换行程风格时重新应用自动勾选 =====
window.onStyleChange = function() {
    const style = document.getElementById('planStyle').value;
    const allPoisData = window.__allPois || [];

    // 对所有已勾选的顶层 POI，重新应用自动勾选规则
    selectedPoiIds.forEach(poiId => {
        const subItems = allPoisData.filter(p => String(p.parent_id) === String(poiId));
        const auto = getStyleAutoSelection(style, subItems);
        const newSet = new Set();
        auto.coreNodes.forEach(id => newSet.add(id));
        auto.spots.forEach(id => newSet.add(id));
        selectedSubItems[poiId] = newSet;
    });

    renderPoiSelection(allPoisData);
    updateSelectedInfo();
};

// ===== 时间选择器 =====
function initTimeSelectors() {
    const sel = document.getElementById('planStartTime');
    if (!sel) return;
    sel.innerHTML = '';
    for (let h = 6; h < 24; h++) {
        for (let m = 0; m < 60; m += 10) {
            const val = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            sel.innerHTML += `<option value="${val}">${val}</option>`;
        }
    }
    setDefaultStartTime();
}
function setDefaultStartTime() {
    const now = new Date();
    now.setMinutes(now.getMinutes() + 10);
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const timeStr = h + ':' + m;
    const sel = document.getElementById('planStartTime');
    if (sel) {
        let exists = false;
        for (let opt of sel.options) if (opt.value === timeStr) { exists = true; break; }
        if (!exists) {
            const opt = document.createElement('option');
            opt.value = timeStr; opt.textContent = timeStr;
            sel.appendChild(opt);
        }
        sel.value = timeStr;
    }
    const dateInput = document.getElementById('planStartDate');
    if (dateInput) dateInput.value = now.toISOString().slice(0, 10);
}

// ===== 出发地点下拉 =====
function initStartLocationSelect(pois) {
    const sel = document.getElementById('planStartLocation');
    if (!sel) return;
    sel.innerHTML = '<option value="county">红军广场（县城）</option>';

    const candidates = pois.filter(p => {
        if (p.parent_id) return false;
        if (p.type === 'scenic') return true;
        if (p.category && p.category.includes('住宿')) return true;
        return false;
    });

    candidates.forEach(p => {
        const icon = p.type === 'scenic' ? '🏞️' : '🏨';
        sel.innerHTML += `<option value="${p.id}">${icon} ${p.name}</option>`;
    });
}

// ===== 渲染景点选择列表 =====
function renderPoiSelection(pois) {
    const container = document.getElementById('poiSelectContainer');
    if (!container) return;
    if (!pois || pois.length === 0) {
        container.innerHTML = '<div class="text-secondary text-center py-2">暂无景点数据</div>';
        return;
    }

    // 顶层 POI：不显示公共场所（facility），不显示子项
    const topPois = pois.filter(p => !p.parent_id && p.type !== 'facility');

    // 子项映射
    const childrenMap = {};
    pois.forEach(p => {
        if (p.parent_id) {
            if (!childrenMap[p.parent_id]) childrenMap[p.parent_id] = [];
            childrenMap[p.parent_id].push(p);
        }
    });

    // 按分类分组
    const categories = {};
    const categoryOrder = ['自然景区', '红色景区', '文博场馆', '餐饮住宿', '交通枢纽', '游玩娱乐', '购物消费', '公共服务', '其他'];
    topPois.forEach(p => {
        const cat = p.category ? p.category.split(',')[0].trim() : '其他';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
    });

    let html = '';
    categoryOrder.forEach(cat => {
        const items = categories[cat] || [];
        if (items.length === 0) return;

        const isScenicCategory = ['自然景区', '红色景区', '文博场馆'].includes(cat);
        const contentHiddenClass = isScenicCategory ? '' : 'hidden';

        html += `<div class="poi-category-group">`;
        html += `<div class="poi-category-title" onclick="this.nextElementSibling.classList.toggle('hidden')">${cat} (${items.length}) <span>▼</span></div>`;
        html += `<div class="poi-category-content ${contentHiddenClass}">`;

        items.forEach(p => {
            const subItems = childrenMap[p.id] || [];
            const hasChildren = subItems.length > 0;
            const isChecked = selectedPoiIds.has(String(p.id));
            const isScenic = p.type === 'scenic';

            // 计算总时长
            const totalDur = getPoiTotalDuration(p, subItems);

            html += `<div class="poi-item" data-poi-id="${p.id}">`;
            html += `<div class="poi-name" onclick="window.togglePoiChildren('${p.id}')">`;
            html += `<input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); window.togglePoiSelection('${p.id}')">`;
            html += `<span>${isScenic ? '🏞️ ' : ''}${p.name}</span>`;
            html += `<span class="poi-duration-badge">${totalDur}分钟</span>`;
            if (hasChildren) html += `<span class="text-secondary" style="font-size:12px;"> (${subItems.length}个子项)</span>`;
            html += `</div>`;

            if (hasChildren) {
                // 子项列表（核心节点 + 景点；不显示公共场所）
                const visibleSubs = subItems.filter(s => s.type === 'core_node' || s.type === 'spot');
                const selectedSet = selectedSubItems[p.id] || new Set();

                html += `<div class="poi-sub-list hidden" id="sub-${p.id}">`;
                visibleSubs.forEach(sub => {
                    const isSubChecked = selectedSet.has(sub.id);
                    const typeBadge = sub.type === 'core_node'
                        ? '<span class="sub-type-badge sub-type-core">⭐核心</span>'
                        : '<span class="sub-type-badge sub-type-spot">📍景点</span>';
                    const featuredTag = sub.is_featured ? ' <span style="color:#f57f17;font-size:10px;">⭐</span>' : '';
                    html += `<div class="sub-item">`;
                    html += `<input type="checkbox" ${isSubChecked ? 'checked' : ''} onclick="event.stopPropagation(); window.toggleSubItem('${p.id}', '${sub.id}')">`;
                    html += `${typeBadge} <span>${sub.name}${featuredTag}</span>`;
                    html += `<span class="poi-duration-badge">${sub.visit_duration || 0}分钟</span>`;
                    html += `</div>`;
                });
                html += `</div>`;
            }
            html += `</div>`;
        });

        html += `</div></div>`;
    });

    container.innerHTML = html;
    updateSelectedInfo();
}

// 计算 POI 的总时长
function getPoiTotalDuration(poi, subItems) {
    if (poi.type === 'scenic' && subItems.length > 0) {
        const selectedSet = selectedSubItems[poi.id] || new Set();
        let total = 0;
        subItems.forEach(s => {
            if (selectedSet.has(s.id)) total += (s.visit_duration || 0);
        });
        return total;
    }
    return poi.visit_duration || 0;
}

// ===== 勾选/取消顶层 POI =====
window.togglePoiSelection = function(poiId) {
    const idStr = String(poiId);
    const allPoisData = window.__allPois || [];
    const poi = allPoisData.find(p => String(p.id) === idStr);
    if (!poi) return;

    if (selectedPoiIds.has(idStr)) {
        selectedPoiIds.delete(idStr);
        delete selectedSubItems[idStr];
    } else {
        selectedPoiIds.add(idStr);

        // 景区类型：按行程风格自动勾选
        if (poi.type === 'scenic') {
            const style = document.getElementById('planStyle').value;
            const subItems = allPoisData.filter(p => String(p.parent_id) === idStr);
            const auto = getStyleAutoSelection(style, subItems);
            const newSet = new Set();
            auto.coreNodes.forEach(id => newSet.add(id));
            auto.spots.forEach(id => newSet.add(id));
            selectedSubItems[idStr] = newSet;
        }
    }

    // 同步顺序数组
    if (selectedPoiIds.has(idStr)) {
        if (!selectedPoiOrder.includes(idStr)) selectedPoiOrder.push(idStr);
    } else {
        selectedPoiOrder = selectedPoiOrder.filter(x => x !== idStr);
    }

    renderPoiSelection(allPoisData);
    renderSelectedOrder();
    updateSelectedInfo();
};

// ===== 勾选/取消子项 =====
window.toggleSubItem = function(poiId, subId) {
    const idStr = String(poiId);
    const subIdStr = String(subId);
    if (!selectedSubItems[idStr]) selectedSubItems[idStr] = new Set();

    const set = selectedSubItems[idStr];
    if (set.has(subIdStr)) {
        set.delete(subIdStr);
    } else {
        set.add(subIdStr);
    }

    // 如果有任何子项被勾选，主 POI 也应勾选
    if (!selectedPoiIds.has(idStr) && set.size > 0) {
        selectedPoiIds.add(idStr);
        if (!selectedPoiOrder.includes(idStr)) selectedPoiOrder.push(idStr);
    }
    // 如果所有子项都取消勾选，主 POI 也取消勾选
    if (set.size === 0) {
        selectedPoiIds.delete(idStr);
        selectedPoiOrder = selectedPoiOrder.filter(x => x !== idStr);
    }

    // 只更新该 POI 的时长显示（不重新渲染整个列表，避免展开状态丢失）
    const durBadge = document.querySelector(`.poi-item[data-poi-id="${poiId}"] .poi-duration-badge`);
    if (durBadge) {
        const allPoisData = window.__allPois || [];
        const poi = allPoisData.find(p => String(p.id) === idStr);
        const subItems = allPoisData.filter(p => String(p.parent_id) === idStr);
        const total = getPoiTotalDuration(poi, subItems);
        durBadge.textContent = `${total}分钟`;
    }

    // 更新主 POI 的 checkbox 状态
    const mainCheckbox = document.querySelector(`.poi-item[data-poi-id="${poiId}"] .poi-name input[type="checkbox"]`);
    if (mainCheckbox) mainCheckbox.checked = selectedPoiIds.has(idStr);

    renderSelectedOrder();
    updateSelectedInfo();
};

window.togglePoiChildren = function(poiId) {
    const subEl = document.getElementById(`sub-${poiId}`);
    if (subEl) subEl.classList.toggle('hidden');
};

window.selectAllPois = function(select) {
    const allPoisData = window.__allPois || [];
    const topPois = allPoisData.filter(p => !p.parent_id && p.type !== 'facility');

    if (select) {
        const style = document.getElementById('planStyle').value;
        topPois.forEach(poi => {
            selectedPoiIds.add(String(poi.id));
            if (!selectedPoiOrder.includes(String(poi.id))) selectedPoiOrder.push(String(poi.id));

            if (poi.type === 'scenic') {
                const subItems = allPoisData.filter(p => String(p.parent_id) === String(poi.id));
                const auto = getStyleAutoSelection(style, subItems);
                const newSet = new Set();
                auto.coreNodes.forEach(id => newSet.add(id));
                auto.spots.forEach(id => newSet.add(id));
                selectedSubItems[String(poi.id)] = newSet;
            }
        });
    } else {
        selectedPoiIds.clear();
        selectedSubItems = {};
        selectedPoiOrder = [];
    }

    renderPoiSelection(allPoisData);
    renderSelectedOrder();
    updateSelectedInfo();
};

function updateSelectedInfo() {
    const total = selectedPoiIds.size;
    document.getElementById('selectedPoiCount').textContent = `已选 ${total} 个`;

    const allPoisData = window.__allPois || [];
    let totalDuration = 0;
    selectedPoiIds.forEach(id => {
        const poi = allPoisData.find(p => String(p.id) === id);
        if (!poi) return;
        if (poi.type === 'scenic') {
            const subItems = allPoisData.filter(p => String(p.parent_id) === id);
            totalDuration += getPoiTotalDuration(poi, subItems);
        } else {
            totalDuration += poi.visit_duration || 0;
        }
    });
    document.getElementById('selectedDurationDisplay').textContent = `已选景点总游览时长：${totalDuration} 分钟`;
}

// ===== 景点顺序 =====
window.renderSelectedOrder = function() {
    const container = document.getElementById('selectedOrderContainer');
    if (!container) return;
    if (selectedPoiOrder.length === 0) {
        container.innerHTML = '<span class="text-secondary">尚未选择景点</span>';
        return;
    }
    const allPoisData = window.__allPois || [];
    let html = '';
    selectedPoiOrder.forEach((id, idx) => {
        const poi = allPoisData.find(p => String(p.id) === id);
        if (!poi) return;
        html += `
            <div class="order-item">
                <span class="order-name"><b>${idx + 1}.</b> ${poi.name}</span>
                <div class="order-actions">
                    <button class="btn btn-sm btn-outline-secondary" onclick="window.movePoiUp('${id}')" ${idx === 0 ? 'disabled' : ''}>↑</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="window.movePoiDown('${id}')" ${idx === selectedPoiOrder.length - 1 ? 'disabled' : ''}>↓</button>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
};

window.movePoiUp = function(id) {
    const idx = selectedPoiOrder.indexOf(id);
    if (idx > 0) {
        [selectedPoiOrder[idx - 1], selectedPoiOrder[idx]] = [selectedPoiOrder[idx], selectedPoiOrder[idx - 1]];
        renderSelectedOrder();
    }
};
window.movePoiDown = function(id) {
    const idx = selectedPoiOrder.indexOf(id);
    if (idx >= 0 && idx < selectedPoiOrder.length - 1) {
        [selectedPoiOrder[idx + 1], selectedPoiOrder[idx]] = [selectedPoiOrder[idx], selectedPoiOrder[idx + 1]];
        renderSelectedOrder();
    }
};

// ===== 生成行程 =====
window.generatePlans = async function() {
    const loadingEl = document.getElementById('planLoading');
    const stepPrefs = document.getElementById('stepPreferences');
    const stepDetail = document.getElementById('stepDetail');
    const generateBtn = document.getElementById('generatePlanBtn');

    const startDate = document.getElementById('planStartDate').value;
    const startTime = document.getElementById('planStartTime').value;
    const mode = document.getElementById('planStyle').value;
    const lodgingMode = document.getElementById('planLodging')?.value || 'all';
    const startLocation = document.getElementById('planStartLocation')?.value || 'county';

    if (!startDate) { alert('请选择出发日期'); return; }
    if (selectedPoiOrder.length === 0) { alert('请至少选择一个景点'); return; }

    const allPoisData = window.__allPois || [];

    // 构造传给 planner 的 POI 数组：
    // 顶层 POI 保留，其 visit_duration 用子项总时长覆盖
    const selectedPois = selectedPoiOrder.map(id => {
        const poi = allPoisData.find(p => String(p.id) === id);
        if (!poi) return null;

        if (poi.type === 'scenic') {
            const subItems = allPoisData.filter(p => String(p.parent_id) === id);
            const selectedSet = selectedSubItems[id] || new Set();
            let total = 0;
            subItems.forEach(s => {
                if (selectedSet.has(s.id)) total += (s.visit_duration || 0);
            });
            return { ...poi, visit_duration: total };
        }
        return { ...poi };
    }).filter(Boolean);

    if (selectedPois.length === 0) { alert('未找到选中的景点数据'); return; }

    generateBtn.disabled = true;
    loadingEl.classList.remove('hidden');
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    try {
        const presets = await getTransportPresetsCached();
        const travelTimes = {};
        presets.forEach(p => { travelTimes[`${p.from_poi_id}_${p.to_poi_id}`] = p.time_min; });

        accommodationPois = allPoisData.filter(p => p.category && p.category.includes('住宿'));

        const result = await generateTripPlan(
            selectedPois, startDate, startTime, mode,
            travelTimes, {}, accommodationPois, lodgingMode, startLocation
        );

        if (!result.days || result.days.length === 0) {
            const msg = result.warnings && result.warnings.length > 0 ? result.warnings.join('；') : '请调整选择或检查景点数据';
            alert('无法生成有效的行程方案：' + msg);
            loadingEl.classList.add('hidden');
            stepPrefs.classList.remove('hidden');
            return;
        }

        currentTripData = result;
        showTripDetail(result);
        loadingEl.classList.add('hidden');
        stepPrefs.classList.add('hidden');
        stepDetail.classList.remove('hidden');
    } catch (e) {
        alert('生成方案失败：' + e.message);
        console.error(e);
        loadingEl.classList.add('hidden');
    } finally {
        generateBtn.disabled = false;
    }
};

// ===== 节点渲染 =====
function renderTripNodeHtml(node) {
    const typeClass = node.type || 'other';
    const iconMap = { transport: '🚗', visit: '📍', meal: '🍽️', accommodation: '🏨', weather: '🌤️', reminder: '⚠️', waiting: '⏳', rest: '☕', trip_end: '🏁' };
    const icon = iconMap[typeClass] || '•';

    if (typeClass === 'weather' || typeClass === 'reminder' || typeClass === 'accommodation' || typeClass === 'trip_end') {
        const text = typeClass === 'accommodation' ? (node.name || '住宿休息')
                   : typeClass === 'trip_end' ? (node.name || '整个行程规划结束')
                   : (node.message || '');
        const textClass = typeClass === 'weather' ? 'weather-text'
                        : typeClass === 'reminder' ? 'reminder-text'
                        : typeClass === 'trip_end' ? 'trip-end-text'
                        : '';
        return `
            <div class="trip-node type-${typeClass}">
                <span class="node-icon icon-${typeClass}">${icon}</span>
                <span class="node-content"><span class="${textClass}">${text}</span></span>
            </div>
        `;
    }

    let timeDisplay = '';
    if (node.startTime !== undefined && node.endTime !== undefined) {
        timeDisplay = `${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}`;
    } else if (node.startTime !== undefined) {
        timeDisplay = fmtTime(node.startTime);
    }

    let content = '';
    if (node.type === 'transport') content = `${node.name || '交通'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else if (node.type === 'visit') content = `${node.name || '游览'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else if (node.type === 'meal') content = `${node.name || '就餐'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else if (node.type === 'waiting') content = `${node.name || '等待'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else if (node.type === 'rest') content = `${node.name || '休息调整'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else content = node.name || '未知节点';

    return `
        <div class="trip-node type-${typeClass}">
            <span class="node-time">${timeDisplay}</span>
            <span class="node-icon icon-${typeClass}">${icon}</span>
            <span class="node-content">${content}</span>
        </div>
    `;
}

function showTripDetail(data) {
    const container = document.getElementById('tripDetailContainer');
    if (!container) return;
    let html = '';
    if (data.days) {
        data.days.forEach((day, dayIdx) => {
            html += `<div class="trip-day-container">`;
            html += `<div class="trip-day-title"><span>📅 第${dayIdx + 1}天 (${day.date})</span></div>`;
            html += `<div class="trip-timeline">`;
            if (day.nodes) day.nodes.forEach(node => { html += renderTripNodeHtml(node); });
            html += `</div></div>`;
        });
    }
    container.innerHTML = html;
}

// ===== 重新生成 =====
window.regenerateTrip = async function() {
    if (!currentTripData) { alert('没有可重新生成的行程'); return; }
    await window.generatePlans();
    alert('行程已重新生成！');
};

// ===== 保存行程 =====
window.saveTripSolution = function() {
    if (!currentTripData) { alert('没有可保存的行程'); return; }
    const defaultName = `行程_${new Date().toISOString().slice(0, 10)}`;
    const name = prompt('请输入行程名称：', defaultName);
    if (name === null) return;
    const tripName = name.trim() || defaultName;
    const trips = getLocalData('trips');
    trips.push({ id: 'trip_' + Date.now(), deviceId: DEVICE_ID, name: tripName, data: currentTripData, savedAt: new Date().toISOString() });
    setLocalData('trips', trips);
    alert('行程已保存');
    window.renderMyTrips();
};

// ===== 我的行程 =====
window.renderMyTrips = function() {
    const container = document.getElementById('myTripsContent');
    if (!container) return;
    const trips = getLocalData('trips').filter(t => t.deviceId === DEVICE_ID);
    if (trips.length === 0) { container.innerHTML = '<p class="text-secondary">暂无保存的行程</p>'; return; }
    let html = '';
    trips.forEach((trip) => {
        const data = trip.data || {};
        html += `
            <div class="card-modern">
                <div class="d-flex justify-content-between align-items-center" style="cursor:pointer;" onclick="window.toggleTripDetail('${trip.id}')">
                    <div class="card-title">📅 ${trip.name || '未命名'}</div>
                    <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); window.deleteTripSolution('${trip.id}')">删除</button>
                </div>
                <div class="card-sub">天数: ${data.days ? data.days.length : 0} 天</div>
                <div id="trip-detail-${trip.id}" class="hidden mt-2"></div>
            </div>
        `;
    });
    container.innerHTML = html;
};

window.toggleTripDetail = function(tripId) {
    const container = document.getElementById(`trip-detail-${tripId}`);
    if (!container) return;
    if (!container.classList.contains('hidden')) { container.classList.add('hidden'); container.innerHTML = ''; return; }
    const trips = getLocalData('trips');
    const trip = trips.find(t => t.id === tripId);
    if (!trip) return;
    renderTripDetailInline(container, trip.data);
    container.classList.remove('hidden');
};

function renderTripDetailInline(container, data) {
    let html = '';
    if (data && data.days) {
        data.days.forEach((day, dayIdx) => {
            html += `<div class="trip-day-container" style="margin-top:8px;">`;
            html += `<div class="trip-day-title"><span>📅 第${dayIdx + 1}天 (${day.date})</span></div>`;
            html += `<div class="trip-timeline">`;
            if (day.nodes) day.nodes.forEach(node => { html += renderTripNodeHtml(node); });
            html += `</div></div>`;
        });
    }
    container.innerHTML = html || '<p class="text-secondary">暂无详情</p>';
}

window.deleteTripSolution = function(id) {
    if (!confirm('确认删除此行程？')) return;
    let trips = getLocalData('trips');
    trips = trips.filter(t => t.id !== id);
    setLocalData('trips', trips);
    window.renderMyTrips();
};

// ===== 预约 =====
window.renderMyReservations = async function() {
    const container = document.getElementById('myReservationsContent');
    if (!container) return;
    container.innerHTML = '<p class="text-secondary">加载中...</p>';
    try {
        const reservations = await getReservationsByDevice(DEVICE_ID);
        if (!reservations || reservations.length === 0) { container.innerHTML = '<p class="text-secondary">暂无预约</p>'; return; }
        const sorted = reservations.sort((a, b) => new Date(b.reservation_date || b.created_at) - new Date(a.reservation_date || a.created_at));
        let html = '';
        sorted.forEach((r, idx) => {
            html += `
                <div class="card-modern">
                    <div onclick="window.toggleReservationDetail(${idx})" style="cursor:pointer;">
                        <div class="card-title">📅 ${r.reservation_date} | ${r.merchant_name || '商户'}</div>
                        <div class="card-sub">状态：${translateStatus(r.status)}</div>
                    </div>
                    <div id="res-detail-${idx}" class="hidden mt-2">
                        <p><b>单位：</b>${r.unit || ''}</p>
                        <p><b>联系人：</b>${r.name || ''}</p>
                        <p><b>电话：</b>${r.phone || ''}</p>
                        <p><b>人数：</b>${r.visitor_count || 1}</p>
                        <p><b>时段：</b>${r.time_slot_start || ''} - ${r.time_slot_end || ''}</p>
                        <p><b>预约内容：</b>${r.reservation_content || '未选择'}</p>
                        <p><b>备注：</b>${r.remark || ''}</p>
                        <p><b>状态：</b>${translateStatus(r.status)}</p>
                        <button class="btn btn-sm btn-danger" onclick="window.deleteReservationHandler('${r.id}')">删除</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    } catch (e) {
        console.error('加载预约失败:', e);
        container.innerHTML = '<p class="text-danger">加载失败，请刷新重试</p>';
    }
};

window.toggleReservationDetail = function(idx) {
    const el = document.getElementById(`res-detail-${idx}`);
    if (el) el.classList.toggle('hidden');
};

window.deleteReservationHandler = async function(id) {
    if (!confirm('确认删除此预约？')) return;
    try { await deleteReservation(id); alert('已删除'); window.renderMyReservations(); }
    catch (e) { alert('删除失败：' + e.message); }
};

window.submitReservation = async function(merchantId, merchantName, category) {
    const date = document.getElementById(`res-date-${merchantId}`).value;
    const timeRange = document.getElementById(`res-time-${merchantId}`).value;
    const [start, end] = (timeRange || '-').split('-');
    const name = document.getElementById(`res-name-${merchantId}`).value.trim();
    const phone = document.getElementById(`res-phone-${merchantId}`).value.trim();
    const count = parseInt(document.getElementById(`res-count-${merchantId}`).value) || 1;
    const remark = document.getElementById(`res-remark-${merchantId}`).value.trim();
    const content = document.getElementById(`res-content-${merchantId}`)?.value || '';

    if (!date || !name || !phone) { alert('请填写日期、联系人和电话'); return; }
    if (!content) { alert('请选择预约内容'); return; }

    try {
        await insertReservation({
            merchant_id: merchantId, merchant_name: merchantName, device_id: DEVICE_ID,
            reservation_date: date, time_slot_start: start || '', time_slot_end: end || '',
            name, phone, visitor_count: count, reservation_content: content,
            remark, category: category || '', status: 'pending'
        });
        alert('预约提交成功！');
        document.getElementById(`res-date-${merchantId}`).value = '';
        document.getElementById(`res-name-${merchantId}`).value = '';
        document.getElementById(`res-phone-${merchantId}`).value = '';
        document.getElementById(`res-count-${merchantId}`).value = '1';
        document.getElementById(`res-remark-${merchantId}`).value = '';
        const contentSel = document.getElementById(`res-content-${merchantId}`);
        if (contentSel) contentSel.value = '';
        window.toggleReservationForm(merchantId);
        window.renderMyReservations();
    } catch (e) { alert('预约提交失败：' + e.message); }
};

window.toggleReservationForm = function(merchantId) {
    const form = document.getElementById(`reservation-form-${merchantId}`);
    if (form) form.classList.toggle('hidden');
};

window.updateResContent = function(merchantId) {
    const catSel = document.getElementById(`res-cat-${merchantId}`);
    const contentSel = document.getElementById(`res-content-${merchantId}`);
    if (!catSel || !contentSel) return;
    const cat = catSel.value;
    if (!cat) { contentSel.innerHTML = '<option value="">请选择具体项目</option>'; return; }
    const items = window.__currentMerchantItems || [];
    const catItems = items.filter(item => item.category === cat);
    contentSel.innerHTML = '<option value="">请选择具体项目</option>' +
        catItems.map(item => `<option value="${item.name}">${item.name}${item.price ? ' ' + item.price : ''}</option>`).join('');
};

// ===== 留言 =====
window.renderFeedbackHistory = async function() {
    const container = document.getElementById('feedbackHistory');
    if (!container) return;
    container.innerHTML = '<p class="text-secondary">加载中...</p>';
    try {
        const feedbacks = await getFeedbacksByDevice(DEVICE_ID);
        if (!feedbacks || feedbacks.length === 0) { container.innerHTML = '<p class="text-secondary">暂无留言</p>'; return; }
        let html = '';
        feedbacks.forEach(f => {
            html += `
                <div class="card-modern">
                    <p>${f.message}</p>
                    <small class="text-secondary">${new Date(f.created_at).toLocaleString()}</small>
                    ${f.reply ? `<div class="bg-green-light p-2 mt-2 rounded">📌 回复：${f.reply}</div>` : ''}
                    <button class="btn btn-sm btn-danger mt-2" onclick="window.deleteFeedbackHandler('${f.id}')">删除</button>
                </div>
            `;
        });
        container.innerHTML = html;
    } catch (e) {
        console.error('加载留言失败:', e);
        container.innerHTML = '<p class="text-danger">加载失败</p>';
    }
};

window.submitFeedback = async function() {
    const msg = document.getElementById('feedbackMsg')?.value.trim();
    if (!msg) { alert('请输入内容'); return; }
    try {
        await insertFeedback({ device_id: DEVICE_ID, message: msg, reply: null });
        alert('留言提交成功');
        document.getElementById('feedbackMsg').value = '';
        window.renderFeedbackHistory();
    } catch (e) { alert('提交失败：' + e.message); }
};

window.deleteFeedbackHandler = async function(id) {
    if (!confirm('确认删除此留言？')) return;
    try { await deleteFeedback(id); alert('已删除'); window.renderFeedbackHistory(); }
    catch (e) { alert('删除失败：' + e.message); }
};

// ===== 商户详情 =====
window.showPoiDetail = async function(poi) {
    try {
        const merchants = await getMerchantsByPoi(poi.id);
        const merchant = merchants && merchants.length > 0 ? merchants[0] : null;
        document.getElementById('merchantDetailTitle').textContent = poi.name;
        let html = '';
        let categories = [];
        let items = [];
        if (merchant) {
            const sd = merchant.service_data || {};
            categories = sd.businessCategories || [];
            items = sd.businessItems || [];
            window.__currentMerchantCategories = categories;
            window.__currentMerchantItems = items;

            if (categories.length > 0 && items.length > 0) {
                categories.forEach(cat => {
                    const catItems = items.filter(item => item.category === cat);
                    if (catItems.length === 0) return;
                    html += `<div><div onclick="this.nextElementSibling.classList.toggle('hidden')" style="cursor:pointer;background:#f9f9f9;padding:8px;border:1px solid #ddd;border-radius:4px;margin:4px 0;">📁 ${cat} (${catItems.length})</div><div class="hidden">`;
                    catItems.forEach((item, idx) => {
                        if (!item.name) return;
                        let priceStr = item.price ? ` ${item.price}` : '';
                        let descStr = item.description ? `<p>${item.description}</p>` : '';
                        let imgHtml = item.image ? `<div class="biz-image-box"><img src="${item.image}"></div>` : '';
                        html += `<div class="card-modern"><div><b>${idx+1}. ${item.name}</b>${priceStr}${descStr}</div>${imgHtml}</div>`;
                    });
                    html += `</div></div>`;
                });
            } else {
                const flatItems = sd.items || [];
                flatItems.filter(item => item.name).forEach((item, idx) => {
                    let priceStr = item.price ? ` ${item.price}` : '';
                    let descStr = item.description ? `<p>${item.description}</p>` : '';
                    let imgHtml = item.image ? `<div class="biz-image-box"><img src="${item.image}"></div>` : '';
                    html += `<div class="card-modern"><div><b>${idx+1}. ${item.name}</b>${priceStr}${descStr}</div>${imgHtml}</div>`;
                });
            }
            let phone = merchant.phone || '未提供';
            let status = merchant.status === 'open' ? '营业中' : (merchant.status === 'closed' ? '休息' : '繁忙');
            let parking = merchant.parking_spots ?? 0;
            html += `<hr><p><i class="fas fa-phone"></i> ${phone} | ${status} | ${parking} 个车位</p><p>${poi.description || ''}</p>`;

            const categoryOptions = categories.map(c => `<option value="${c}">${c}</option>`).join('');
            html += `
                <div class="mt-3">
                    <button class="btn btn-primary-custom" onclick="window.toggleReservationForm('${merchant.id}')"><i class="fas fa-calendar-plus"></i> 预约</button>
                    <div id="reservation-form-${merchant.id}" class="reservation-form hidden mt-2">
                        <h6>预约信息</h6>
                        <div class="form-group"><label>预约日期</label><input type="date" id="res-date-${merchant.id}" class="form-control" /></div>
                        <div class="form-group"><label>时段</label>
                            <select id="res-time-${merchant.id}" class="form-select">
                                <option value="08:00-09:00">08:00-09:00</option>
                                <option value="09:00-10:00">09:00-10:00</option>
                                <option value="10:00-11:00">10:00-11:00</option>
                                <option value="11:00-12:00">11:00-12:00</option>
                                <option value="13:00-14:00">13:00-14:00</option>
                                <option value="14:00-15:00">14:00-15:00</option>
                                <option value="15:00-16:00">15:00-16:00</option>
                                <option value="16:00-17:00">16:00-17:00</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>预约内容</label>
                            <select id="res-cat-${merchant.id}" class="form-select mb-1" onchange="window.updateResContent('${merchant.id}')">
                                <option value="">请选择大类</option>${categoryOptions}
                            </select>
                            <select id="res-content-${merchant.id}" class="form-select"><option value="">请选择具体项目</option></select>
                        </div>
                        <div class="form-group"><label>联系人</label><input type="text" id="res-name-${merchant.id}" class="form-control"></div>
                        <div class="form-group"><label>电话</label><input type="tel" id="res-phone-${merchant.id}" class="form-control"></div>
                        <div class="form-group"><label>人数</label><input type="number" id="res-count-${merchant.id}" class="form-control" min="1" value="1"></div>
                        <div class="form-group"><label>备注</label><textarea id="res-remark-${merchant.id}" class="form-control" rows="2"></textarea></div>
                        <button class="btn btn-primary-custom btn-sm" onclick="window.submitReservation('${merchant.id}', '${merchant.display_name || poi.name}', '${merchant.business_type || ''}')">提交预约</button>
                        <button class="btn btn-secondary btn-sm" onclick="window.toggleReservationForm('${merchant.id}')">取消</button>
                    </div>
                </div>
            `;
        } else {
            html += '<p style="color:#999;">该商户信息暂未录入</p><hr><p>' + (poi.description || '') + '</p>';
        }
        document.getElementById('merchantDetailContent').innerHTML = html;
        window.openPanel('merchantDetailPanel');
    } catch (e) {
        console.error('加载商户详情失败:', e);
        alert('加载失败：' + e.message);
    }
};

// ===== 全局UI =====
window.locateUser = locateUser;
window.clearFilter = clearFilter;
window.filterPOI = (category) => { applyFilter(category); };
window.openPanel = (id) => { document.getElementById(id).classList.add('active'); };
window.closePanel = (id) => { document.getElementById(id).classList.remove('active'); };
window._voiceEnabled = true;
window.toggleVoice = () => {
    window._voiceEnabled = !window._voiceEnabled;
    setVoiceEnabled(window._voiceEnabled);
    const icon = window._voiceEnabled ? 'fa-volume-high' : 'fa-volume-xmark';
    document.querySelector('#voiceToggleBtn i').className = 'fas ' + icon;
};
window.backToPreferences = function() {
    document.getElementById('stepDetail').classList.add('hidden');
    document.getElementById('stepPreferences').classList.remove('hidden');
};
window.startNavigation = startNavigation;
window.endNavigation = endNavigation;

// ===== 分类栏 =====
const brandToggle = document.getElementById('brandToggle');
const categoryBar = document.getElementById('categoryBar');
let hideTimer = null;
brandToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const isShowing = categoryBar.classList.contains('show');
    if (isShowing) { categoryBar.classList.remove('show'); clearTimeout(hideTimer); }
    else {
        categoryBar.classList.add('show');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => categoryBar.classList.remove('show'), 3000);
    }
});
document.addEventListener('click', function(e) {
    if (!categoryBar.contains(e.target) && e.target !== brandToggle) {
        categoryBar.classList.remove('show');
        clearTimeout(hideTimer);
    }
});

// ===== 初始化 =====
async function init() {
    try {
        const pois = await getPoisCached();
        allPois = pois;
        window.__allPois = pois;

        initMap('map');
        loadPoisToMap(pois);

        initTimeSelectors();
        initStartLocationSelect(pois);
        renderPoiSelection(pois);
        renderSelectedOrder();

        await Promise.all([
            Promise.resolve(window.renderMyTrips()),
            Promise.resolve(window.renderMyReservations()),
            Promise.resolve(window.renderFeedbackHistory())
        ]);

        locateUser();
        document.getElementById('generatePlanBtn').addEventListener('click', window.generatePlans);

        console.log('[系统] 初始化完成, POI数量:', pois.length);
    } catch (e) {
        console.error('[系统] 初始化失败:', e);
        alert('初始化失败：' + e.message);
    }
}
init();
</script>
