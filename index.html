// ==================== 辅助函数 ====================
function wgs84ToGcj02(lat, lon) {
    const a = 6378245.0;
    const ee = 0.00669342162296594323;
    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }
    function transformLon(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
    }
    const dLat = transformLat(lon - 105.0, lat - 35.0);
    const dLon = transformLon(lon - 105.0, lat - 35.0);
    const radLat = lat / 180.0 * Math.PI;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    const dLatFinal = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
    const dLonFinal = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
    return { lat: lat + dLatFinal, lng: lon + dLonFinal };
}

function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ==================== 智能规划（核心修复） ====================
function classifySpot(spot) {
    const dur = spot.visitDuration || 0;
    if (dur > 300) return 'long';
    if (dur >= 100) return 'half';
    return 'short';
}

function getCountySpots() {
    const keywords = ['轿房沟美食街', '银耳博物馆', '红四方面军总指挥部旧址纪念馆', '省委党校旧址纪念馆', '通江花月夜'];
    return allPois.filter(p => {
        if (!p.name) return false;
        return keywords.some(kw => p.name.includes(kw));
    }).map(p => ({
        id: p.id,
        name: p.name,
        lat: p.lat,
        lng: p.lng,
        visitDuration: p.visit_duration || 90,
        isCounty: true
    }));
}

function fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, remaining, currentDate, orderedPois, mode) {
    let totalInserted = 0;
    let tryCount = 0;
    while (remaining > 0 && tryCount < 10) {
        tryCount++;
        let candidate = null;
        for (let c of availableCounty) {
            if (!usedCountyIds.has(c.id)) {
                candidate = c;
                break;
            }
        }
        if (!candidate) break;
        let travel = getTransportTime(lastPoi.id, candidate.id, mode);
        if (travel === null || travel === undefined) travel = 0;
        const needed = travel + candidate.visitDuration;
        if (needed <= remaining) {
            const countyNode = {
                id: candidate.id,
                name: candidate.name,
                lat: candidate.lat,
                lng: candidate.lng,
                visitDuration: candidate.visitDuration,
                transportTime: travel,
                isCounty: true
            };
            orderedPois.push(countyNode);
            lastPoi = countyNode;
            usedCountyIds.add(candidate.id);
            totalInserted += needed;
            remaining -= needed;
        } else {
            break;
        }
    }
    return { totalInserted, lastPoi };
}

// 核心规划函数（长耗时从08:00开始，游览时长固定）
function smartSchedule(spots, startDate, startTime, mode) {
    const countySpots = getCountySpots();
    const usedCountyIds = new Set();
    const allSpotIds = new Set(spots.map(s => s.id));
    const availableCounty = countySpots.filter(c => !allSpotIds.has(c.id));

    // 按类型分组
    const longSpots = spots.filter(s => s.visitDuration > 300);
    const halfSpots = spots.filter(s => s.visitDuration >= 100 && s.visitDuration <= 300);
    const shortSpots = spots.filter(s => s.visitDuration < 100);

    // 排序：长耗时按游览时长降序（先安排大的），半日、短时降序
    longSpots.sort((a,b) => b.visitDuration - a.visitDuration);
    halfSpots.sort((a,b) => b.visitDuration - a.visitDuration);
    shortSpots.sort((a,b) => b.visitDuration - a.visitDuration);

    const orderedPois = [];
    const startPoi = { id: 'county', name: '红军广场', lat: COUNTY.lat, lng: COUNTY.lng, visitDuration: 0, transportTime: 0 };
    orderedPois.push(startPoi);
    let lastPoi = startPoi;

    let currentDate = new Date(startDate);
    let currentMin = startTime;
    if (currentMin < DAY_START) currentMin = DAY_START;
    if (currentMin >= DAY_END) {
        currentDate.setDate(currentDate.getDate() + 1);
        currentMin = DAY_START;
    }

    // 1. 处理长耗时景区
    for (let spot of longSpots) {
        // 确保从08:00开始
        if (currentMin !== DAY_START) {
            // 填充当天剩余时间（用县城景点）
            let rem = DAY_END - currentMin;
            if (rem > 0) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            // 无论是否填充，都跳到次日08:00
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
        }
        // 现在 currentMin == DAY_START
        let travelTime = getTransportTime(lastPoi.id, spot.id, mode);
        if (travelTime === null || travelTime === undefined) travelTime = 0;
        // 检查当天剩余时间是否足够（从08:00到18:00）
        let totalNeeded = travelTime + spot.visitDuration;
        let remainingToday = DAY_END - currentMin;
        if (totalNeeded > remainingToday) {
            // 不足，顺延到次日08:00
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
            travelTime = getTransportTime(lastPoi.id, spot.id, mode);
            if (travelTime === null || travelTime === undefined) travelTime = 0;
            totalNeeded = travelTime + spot.visitDuration;
            // 如果还是不够（极少数情况），继续顺延，但最多顺延3天
            let tryCount = 0;
            while (totalNeeded > DAY_END - currentMin && tryCount < 5) {
                currentDate.setDate(currentDate.getDate() + 1);
                currentMin = DAY_START;
                travelTime = getTransportTime(lastPoi.id, spot.id, mode);
                if (travelTime === null || travelTime === undefined) travelTime = 0;
                totalNeeded = travelTime + spot.visitDuration;
                tryCount++;
            }
        }
        // 安排景点
        const node = {
            id: spot.id,
            name: spot.name,
            lat: spot.lat,
            lng: spot.lng,
            visitDuration: spot.visitDuration,  // 固定游览时长
            transportTime: travelTime,
            isCounty: false
        };
        orderedPois.push(node);
        lastPoi = node;
        // 更新当前时间
        currentMin = currentMin + travelTime + spot.visitDuration;
        // 如果当前时间超过DAY_END，则顺延到次日（但实际上我们已确保不超过）
        if (currentMin > DAY_END) {
            // 极少数情况，若超过，则截断到DAY_END并跳转次日
            currentMin = DAY_END;
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
        }
    }

    // 2. 处理半日景区（100-300分钟）
    let halfQueue = [...halfSpots];
    let attempts = 0;
    while (halfQueue.length > 0 && attempts < 100) {
        attempts++;
        let spot = halfQueue.shift();
        let travelTime = getTransportTime(lastPoi.id, spot.id, mode);
        if (travelTime === null || travelTime === undefined) travelTime = 0;
        let needed = travelTime + spot.visitDuration;

        // 如果当前时间不在有效时间块，跳到下一个合适时间
        if (currentMin >= DAY_END) {
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
        }
        if (currentMin < DAY_START) currentMin = DAY_START;
        if (currentMin >= DINNER_TRIGGER && currentMin < DAY_END) {
            // 当前在晚餐后，跳到次日8:00
            let rem = DAY_END - currentMin;
            if (rem > 0) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
        }

        // 尝试上午块（08:00 - 11:30）
        let morningStart = Math.max(currentMin, DAY_START);
        let morningEnd = LUNCH_TRIGGER;
        let morningAvailable = morningEnd - morningStart;
        if (needed <= morningAvailable && currentMin < LUNCH_TRIGGER) {
            const node = {
                id: spot.id,
                name: spot.name,
                lat: spot.lat,
                lng: spot.lng,
                visitDuration: spot.visitDuration,
                transportTime: travelTime,
                isCounty: false
            };
            orderedPois.push(node);
            lastPoi = node;
            currentMin = morningStart + needed;
            // 填充上午剩余
            if (currentMin < morningEnd) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, morningEnd - currentMin, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            currentMin = LUNCH_END; // 跳到下午
            continue;
        }

        // 上午不足，填充上午剩余，跳到下午
        if (currentMin < LUNCH_TRIGGER) {
            let rem = LUNCH_TRIGGER - currentMin;
            if (rem > 0) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            currentMin = LUNCH_END;
            travelTime = getTransportTime(lastPoi.id, spot.id, mode);
            if (travelTime === null || travelTime === undefined) travelTime = 0;
            needed = travelTime + spot.visitDuration;
        }

        // 尝试下午块（12:30 - 17:30）
        let afternoonStart = Math.max(currentMin, LUNCH_END);
        let afternoonEnd = DINNER_TRIGGER;
        let afternoonAvailable = afternoonEnd - afternoonStart;
        if (needed <= afternoonAvailable && currentMin < DINNER_TRIGGER) {
            const node = {
                id: spot.id,
                name: spot.name,
                lat: spot.lat,
                lng: spot.lng,
                visitDuration: spot.visitDuration,
                transportTime: travelTime,
                isCounty: false
            };
            orderedPois.push(node);
            lastPoi = node;
            currentMin = afternoonStart + needed;
            if (currentMin < afternoonEnd) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, afternoonEnd - currentMin, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            currentMin = DINNER_END;
            continue;
        }

        // 下午也不足，填充下午剩余，顺延到次日
        if (currentMin < DINNER_TRIGGER) {
            let rem = DINNER_TRIGGER - currentMin;
            if (rem > 0) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
        }
        currentDate.setDate(currentDate.getDate() + 1);
        currentMin = DAY_START;
        if (attempts < 100) halfQueue.push(spot);
    }

    // 3. 处理短耗时景区和县城填充（作为填充）
    let fillers = [...shortSpots, ...availableCounty];
    fillers.sort((a,b) => b.visitDuration - a.visitDuration);
    for (let spot of fillers) {
        let travelTime = getTransportTime(lastPoi.id, spot.id, mode);
        if (travelTime === null || travelTime === undefined) travelTime = 0;
        let needed = travelTime + spot.visitDuration;
        let remaining = DAY_END - currentMin;
        if (needed <= remaining) {
            const node = {
                id: spot.id,
                name: spot.name,
                lat: spot.lat,
                lng: spot.lng,
                visitDuration: spot.visitDuration,
                transportTime: travelTime,
                isCounty: spot.isCounty || false
            };
            orderedPois.push(node);
            lastPoi = node;
            currentMin += needed;
        } else {
            // 放不下，跳过（允许空闲）
        }
    }

    // 最后填充县城剩余
    let rem = DAY_END - currentMin;
    if (rem > 0) {
        let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
        if (result.totalInserted > 0) {
            lastPoi = result.lastPoi;
            currentMin += result.totalInserted;
        }
    }

    return orderedPois;
}

// ==================== 自设行程生成 ====================
async function generateCustomTrip() {
    const checkboxes = document.querySelectorAll('#dynamic-route input[type="checkbox"]:checked');
    const selectedIds = [];
    checkboxes.forEach(cb => {
        const id = cb.value;
        if (id && id !== 'county' && id !== 'mylocation') {
            selectedIds.push(id);
        }
    });
    if (selectedIds.length === 0) return alert('请至少选择一个景区');

    const dateStr = document.getElementById('trip-date').value;
    const startTime = getSelectedTime();
    if (!dateStr) return alert('选择出发日期');
    if (!startTime) return alert('选择出发时间');
    const now = new Date();
    if (new Date(dateStr + 'T' + startTime) < now) {
        alert('出发时间不能早于当前时间');
        return;
    }
    const mode = document.getElementById('trip-mode').value;
    const people = document.getElementById('trip-people').value;

    const userSpots = [];
    for (let id of selectedIds) {
        const poi = allPois.find(p => p.id == id);
        if (!poi) continue;
        userSpots.push({
            id: poi.id,
            name: poi.name,
            lat: poi.lat,
            lng: poi.lng,
            visitDuration: poi.visit_duration || 60
        });
    }

    const orderedPois = smartSchedule(userSpots, dateStr, parseInt(startTime.slice(0,2))*60 + parseInt(startTime.slice(3)), mode);
    const nodes = [];
    for (let i = 0; i < orderedPois.length; i++) {
        const p = orderedPois[i];
        const visitDur = (i === 0) ? 0 : p.visitDuration;
        const transportTime = (i === 0) ? 0 : p.transportTime;
        nodes.push({
            id: p.id,
            name: p.name,
            lat: p.lat,
            lng: p.lng,
            visitDuration: visitDur,
            transportTime: transportTime,
            isCounty: p.isCounty || false
        });
    }

    const { days, mealCount } = generateTimeline(nodes, dateStr, startTime);
    const weatherForecast = await fetchWeatherForecast();
    const daysWithWeather = days.map((d, i) => {
        let weatherTip = '⚠️ 天气信息暂不可用。';
        if (weatherForecast && i < weatherForecast.length) {
            weatherTip = getDayWeatherTip(weatherForecast[i]);
        }
        return { ...d, weatherTip };
    });

    let html = '';
    daysWithWeather.forEach((d, i) => {
        html += `<div class="day-header">📅 第${i+1}天 (${d.date})</div>`;
        d.lines.forEach(l => html += `<div class="trip-line">${l}</div>`);
        html += `<div class="trip-line" style="color:#0d47a1;">${d.weatherTip}</div>`;
    });

    let totalTransport = 0, totalVisit = 0;
    nodes.forEach(n => { totalTransport += n.transportTime || 0; totalVisit += n.visitDuration || 0; });
    let totalActivity = totalTransport + totalVisit;
    let tips = [];
    tips.push(`📊 活动总时长：${totalActivity}分钟（约${(totalActivity/60).toFixed(1)}小时），其中交通${totalTransport}分钟，游览${totalVisit}分钟。`);
    if (mealCount > 0) tips.push(`🍴 包含 ${mealCount} 次用餐，预计总耗时约 ${Math.round((totalActivity + mealCount*60)/60)} 小时。`);
    if (days.length > 1) tips.push(`🏨 行程跨${days.length}天，请合理安排住宿。`);
    if (days.length === 1 && (totalTransport > 120 || totalVisit > 240)) {
        tips.push(`💡 由于当日行程时间较长，建议您考虑将部分景点调整到第二天，或选择更近的景点。`);
    }

    generatedTripData = {
        name: '自设行程',
        date: dateStr,
        time: startTime,
        mode: mode,
        people: people,
        nodes: nodes.map(n => ({ id: n.id, name: n.name })),
        days: daysWithWeather,
        tips: tips
    };

    document.getElementById('generated-trip').innerHTML = `<div class="card">${html}</div>`;
    document.getElementById('trip-warnings').innerHTML = tips.length ? `<div class="warn-list"><strong>💡 温馨提示：</strong>${tips.map(t=>`<div>${t}</div>`).join('')}</div>` : '';
    document.getElementById('saveGeneratedTripBtn').classList.remove('hidden');
}

// ==================== 时间线生成 ====================
function generateTimeline(nodes, startDate, startTime) {
    // 同前，略
    let curDate = new Date(startDate);
    let [h, m] = startTime.split(':').map(Number);
    let curMin = h * 60 + m;
    const lines = [];
    let lunchDone = false, dinnerDone = false;
    if (curMin >= LUNCH_TRIGGER) lunchDone = true;
    if (curMin >= DINNER_TRIGGER) dinnerDone = true;
    let mealCount = 0;
    let currentVisitLeft = 0;

    function addLine(start, end, text, date) {
        if (text.startsWith('⏱️') && lines.length > 0) {
            const last = lines[lines.length - 1];
            if (last.text && last.text.startsWith('⏱️')) {
                const lastParts = last.text.split('游览 ');
                if (lastParts.length > 1) {
                    const lastSpot = lastParts[1].replace(/\(.*\)/, '').trim();
                    const curParts = text.split('游览 ');
                    if (curParts.length > 1) {
                        const curSpot = curParts[1].replace(/\(.*\)/, '').trim();
                        if (lastSpot === curSpot && last.end === start) {
                            const newEnd = end;
                            const newText = `⏱️ ${formatTime(last.start)}-${formatTime(newEnd)} 游览 ${lastSpot} (${newEnd - last.start}分钟)`;
                            lines[lines.length - 1] = { start: last.start, end: newEnd, text: newText, date: last.date };
                            return;
                        }
                    }
                }
            }
        }
        const dateCopy = new Date(date);
        lines.push({ start, end, text, date: dateCopy });
    }

    function tryInsertLunch() {
        if (!lunchDone && curMin >= LUNCH_TRIGGER) {
            if (currentVisitLeft > 0 && currentVisitLeft < 60) return false;
            const start = curMin;
            const end = curMin + MEAL_DURATION;
            addLine(start, end, `🍽️ 午餐时间 (${formatTime(start)}-${formatTime(end)})`, curDate);
            curMin = end;
            lunchDone = true;
            mealCount++;
            return true;
        }
        return false;
    }

    function tryInsertDinner() {
        if (!dinnerDone && curMin >= DINNER_TRIGGER) {
            if (currentVisitLeft > 0 && currentVisitLeft < 60) return false;
            const start = curMin;
            const end = curMin + MEAL_DURATION;
            addLine(start, end, `🍽️ 晚餐时间 (${formatTime(start)}-${formatTime(end)})`, curDate);
            curMin = end;
            dinnerDone = true;
            mealCount++;
            return true;
        }
        return false;
    }

    function ensureMealsForDay() {
        if (!lunchDone) {
            let t = Math.max(curMin, LUNCH_TRIGGER);
            const start = t;
            const end = t + MEAL_DURATION;
            addLine(start, end, `🍽️ 午餐时间 (${formatTime(start)}-${formatTime(end)})`, curDate);
            curMin = end;
            lunchDone = true;
            mealCount++;
        }
        if (!dinnerDone) {
            let t = Math.max(curMin, DINNER_TRIGGER);
            const start = t;
            const end = t + MEAL_DURATION;
            addLine(start, end, `🍽️ 晚餐时间 (${formatTime(start)}-${formatTime(end)})`, curDate);
            curMin = end;
            dinnerDone = true;
            mealCount++;
        }
    }

    function gotoNextDay() {
        if (curMin >= DAY_END) {
            if (currentVisitLeft > 0 && currentVisitLeft < 60) {
                let spend = currentVisitLeft;
                const start = curMin;
                const end = curMin + spend;
                addLine(start, end, `⏱️ ${formatTime(start)}-${formatTime(end)} 游览剩余 (${spend}分钟)`, curDate);
                curMin = end;
                currentVisitLeft = 0;
            }
            ensureMealsForDay();
            const start = DAY_END;
            const end = DAY_END;
            addLine(start, end, `🌙 当天行程结束，住宿休息`, curDate);
            curDate.setDate(curDate.getDate() + 1);
            curMin = DAY_START;
            lunchDone = false; dinnerDone = false;
            if (curMin >= LUNCH_TRIGGER) lunchDone = true;
            if (curMin >= DINNER_TRIGGER) dinnerDone = true;
        }
    }

    addLine(curMin, curMin, `🚩 ${formatTime(curMin)} 从 ${nodes[0].name} 出发`, curDate);

    for (let i = 1; i < nodes.length; i++) {
        const cur = nodes[i];
        let travelTime = cur.transportTime || 0;
        if (travelTime > 0) {
            if (curMin >= DAY_END) gotoNextDay();
            const start = curMin;
            curMin += travelTime;
            let daysPassed = Math.floor(curMin / 1440);
            if (daysPassed > 0) {
                curDate.setDate(curDate.getDate() + daysPassed);
                curMin = curMin % 1440;
                lunchDone = false; dinnerDone = false;
                if (curMin >= LUNCH_TRIGGER) lunchDone = true;
                if (curMin >= DINNER_TRIGGER) dinnerDone = true;
            }
            const end = curMin;
            addLine(start, end, `🚗 ${formatTime(start)}-${formatTime(end)} 前往 ${cur.name} (交通${travelTime}分钟)`, curDate);
        } else if (cur.transportTime === null) {
            addLine(curMin, curMin, `⚠️ 前往 ${cur.name} 交通耗时未知`, curDate);
        }

        if (cur.visitDuration > 0 && !isNonVisitPoi(cur.id)) {
            let visitLeft = cur.visitDuration;
            currentVisitLeft = visitLeft;
            while (visitLeft > 0) {
                if (curMin < DAY_START) curMin = DAY_START;
                if (curMin >= DAY_END) gotoNextDay();

                let lunchInserted = tryInsertLunch();
                let dinnerInserted = false;
                if (!lunchInserted) {
                    dinnerInserted = tryInsertDinner();
                }
                if (lunchInserted || dinnerInserted) {
                    continue;
                }

                if (visitLeft < 60) {
                    const start = curMin;
                    const spend = visitLeft;
                    const end = curMin + spend;
                    addLine(start, end, `⏱️ ${formatTime(start)}-${formatTime(end)} 游览 ${cur.name} (游览${cur.visitDuration}分钟)`, curDate);
                    curMin = end;
                    visitLeft = 0;
                    currentVisitLeft = 0;
                } else {
                    let nextBreak = DAY_END;
                    if (!lunchDone && curMin < LUNCH_TRIGGER) nextBreak = LUNCH_TRIGGER;
                    else if (!dinnerDone && curMin < DINNER_TRIGGER) nextBreak = DINNER_TRIGGER;
                    let timeToBreak = nextBreak - curMin;
                    if (timeToBreak <= 0) timeToBreak = 1;
                    const start = curMin;
                    const spend = Math.min(visitLeft, timeToBreak);
                    const end = curMin + spend;
                    addLine(start, end, `⏱️ ${formatTime(start)}-${formatTime(end)} 游览 ${cur.name} (游览${cur.visitDuration}分钟)`, curDate);
                    curMin = end;
                    visitLeft -= spend;
                    currentVisitLeft = visitLeft;
                }
            }
            if (curMin < DAY_END) {
                tryInsertLunch();
                tryInsertDinner();
            }
        } else if (isNonVisitPoi(cur.id)) {
            addLine(curMin, curMin, `📍 ${formatTime(curMin)} 到达 ${cur.name}`, curDate);
            if (curMin < DAY_END) {
                tryInsertLunch();
                tryInsertDinner();
            }
            if (curMin >= DAY_END) {
                ensureMealsForDay();
                const start = DAY_END;
                const end = DAY_END;
                addLine(start, end, `🌙 当天行程结束，住宿休息`, curDate);
                curDate.setDate(curDate.getDate() + 1);
                curMin = DAY_START;
                lunchDone = false; dinnerDone = false;
                if (curMin >= LUNCH_TRIGGER) lunchDone = true;
                if (curMin >= DINNER_TRIGGER) dinnerDone = true;
            }
        }
        if (curMin >= DAY_END) gotoNextDay();
    }

    if (curMin < DAY_END) {
        tryInsertLunch();
        tryInsertDinner();
    } else {
        ensureMealsForDay();
    }

    const daysMap = {};
    lines.forEach(l => {
        const key = l.date.toLocaleDateString('zh-CN');
        if (!daysMap[key]) daysMap[key] = [];
        daysMap[key].push(l.text);
    });
    const days = Object.keys(daysMap).map(date => ({ date, lines: daysMap[date] }));
    return { days, mealCount };
}

// ==================== 自设行程界面操作（数据源限制为自然景区、红色景区、文博场馆） ====================
function toggleCustomTripSection(){
    document.getElementById('customTripSection').classList.toggle('hidden');
    if(!document.getElementById('customTripSection').classList.contains('hidden')){
        buildMainPoiOptions();
        resetRouteLegs();
    }
}
function buildMainPoiOptions(){
    const allMain = allPois.filter(p => !p.parent_id);
    mainPoiOptions = allMain.filter(p => p.id !== 'county');
    if (currentGcjPos) mainPoiOptions.unshift({ id:'mylocation', name:'📍 我的位置', lat: currentGcjPos.lat, lng: currentGcjPos.lng });
    mainPoiOptions.unshift(COUNTY);
    // 只允许分类为自然景区、红色景区、文博场馆的POI
    const allowedCategoriesLower = ALLOWED_CATEGORIES.map(c => c.toLowerCase());
    allowedPoiOptions = allMain.filter(p => {
        if(!p.category) return false;
        const cats = p.category.split(',').map(c => c.trim().toLowerCase());
        return cats.some(c => allowedCategoriesLower.includes(c));
    });
    // 确保起点存在
    if(!allowedPoiOptions.some(p => p.id === 'county')) allowedPoiOptions.unshift(COUNTY);
    console.log('✅ 自设行程可用POI（仅自然/红色/文博）:', allowedPoiOptions.length);
}
function resetRouteLegs(){ routeLegs=[]; renderDynamicRoute(); }
function renderDynamicRoute(){
    const poiList = allowedPoiOptions.filter(p => p.id !== 'county' && p.id !== 'mylocation');
    // 按分类分组但只显示名称和时长
    let html = '';
    poiList.forEach(p => {
        const dur = p.visit_duration || 0;
        const checked = routeLegs.some(l => l.id === p.id) ? 'checked' : '';
        html += `<div style="margin:4px 0;"><label><input type="checkbox" value="${p.id}" ${checked} onchange="toggleSpot('${p.id}')"> ${p.name}（${dur}分钟）</label></div>`;
    });
    document.getElementById('dynamic-route').innerHTML = html || '<p>暂无可用景点</p>';
}

function toggleSpot(id) {
    const idx = routeLegs.findIndex(l => l.id === id);
    if (idx >= 0) routeLegs.splice(idx, 1);
    else {
        const poi = allPois.find(p => p.id == id);
        if (poi) routeLegs.push({ id: poi.id, name: poi.name, lat: poi.lat, lng: poi.lng });
    }
}
