<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智游通江 - 智能行程规划</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 样式与之前相同，省略以节省篇幅，实际部署时请保留完整样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; background: #f0f2f5; }
        .hidden { display: none !important; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .top-bar {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 12px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1700;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.92);
            padding: 6px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            backdrop-filter: blur(8px);
            height: 44px;
            cursor: pointer;
            white-space: nowrap;
        }
        .top-bar .brand {
            font-weight: 700;
            color: #1b5e20;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        .top-bar .brand i { font-size: 20px; }
        .category-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1600;
            background: rgba(255,255,255,0.98);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-wrap: wrap;
            padding: 12px 16px;
            gap: 8px;
            border-bottom: 1px solid #e8f5e9;
            backdrop-filter: blur(8px);
            pointer-events: none;
            max-height: 70vh;
            overflow-y: auto;
            padding-top: calc(60px + env(safe-area-inset-top, 12px));
        }
        .category-bar.show {
            transform: translateY(0);
            pointer-events: auto;
        }
        .category-bar .cat-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #e0e0e0;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            color: #333;
        }
        .category-bar .cat-btn:hover { background: #e8f5e9; border-color: #2e7d32; }
        .category-bar .cat-btn.active { background: #2e7d32; color: white; border-color: #2e7d32; }
        .bottom-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;
            display: flex;
            gap: 6px;
            background: rgba(255,255,255,0.95);
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            backdrop-filter: blur(8px);
            align-items: center;
            max-width: 95%;
        }
        .bottom-nav .nav-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: #555;
            white-space: nowrap;
        }
        .bottom-nav .nav-btn:hover { background: #e8f5e9; color: #1b5e20; }
        .bottom-nav .nav-btn.primary { background: #1b5e20; color: white; }
        .bottom-nav .nav-btn.primary:hover { background: #2e7d32; }
        .float-btn {
            position: fixed;
            z-index: 1500;
            background: white;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            cursor: pointer;
            font-size: 20px;
            border: none;
            transition: all 0.2s;
        }
        .float-btn:hover { transform: scale(1.08); }
        .locate-btn { bottom: 110px; right: 20px; }
        .voice-btn { bottom: 170px; right: 20px; }
        .panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 2000;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .panel.active { transform: translateY(0); }
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 64px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
        }
        .panel-header h2 { font-size: 18px; font-weight: 700; margin: 0; color: #1b5e20; }
        .panel-header .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; padding: 4px 8px; border-radius: 8px; transition: 0.2s; }
        .panel-body { flex: 1; padding: 16px 20px; overflow-y: auto; padding-bottom: 30px; }
        .card-modern { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
        .card-modern .card-title { font-weight: 600; font-size: 16px; margin-bottom: 6px; color: #1b5e20; }
        .card-modern .card-sub { font-size: 13px; color: #888; }
        .solution-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #e8f5e9;
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .solution-card:hover { border-color: #1b5e20; transform: translateY(-4px); }
        .solution-card.selected { border-color: #1b5e20; background: #f1f8e9; }
        .solution-card .badge-style { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .badge-compact { background: #fff3e0; color: #e65100; }
        .badge-relaxed { background: #e3f2fd; color: #0d47a1; }
        .badge-indepth { background: #fce4ec; color: #880e4f; }
        .solution-card .stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid #f5f5f5; }
        .solution-card .stat-row:last-child { border-bottom: none; }
        .solution-card .day-detail { margin-top: 12px; border-top: 1px solid #eee; padding-top: 12px; }
        .solution-card .day-detail .day-title { font-weight: 600; color: #1b5e20; margin-bottom: 6px; }
        .solution-card .day-detail .time-line { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; }
        .solution-card .day-detail .time-line .time { color: #888; min-width: 80px; }
        .solution-card .day-detail .time-line .icon { width: 24px; text-align: center; }
        .poi-category-group { margin-bottom: 12px; }
        .poi-category-title {
            font-weight: 600;
            color: #1b5e20;
            background: #e8f5e9;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .poi-category-title:hover { background: #c8e6c9; }
        .poi-category-content { padding-left: 12px; margin-top: 4px; }
        .poi-item { padding: 4px 0; border-bottom: 1px solid #f5f5f5; }
        .poi-item .poi-name { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .poi-item .poi-name input[type="checkbox"] { margin-right: 4px; }
        .poi-item .poi-sub-list { padding-left: 24px; margin-top: 4px; }
        .poi-item .poi-sub-list .sub-item { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
        .poi-item .poi-sub-list .sub-item input[type="checkbox"] { margin-right: 4px; }
        .poi-item .poi-duration-badge { font-size: 12px; color: #888; margin-left: 8px; }
        .total-duration { font-weight: 600; color: #1b5e20; background: #e8f5e9; padding: 6px 12px; border-radius: 6px; text-align: center; margin-top: 10px; }
        .pref-tag { display: inline-block; padding: 4px 14px; border-radius: 20px; background: #e8f5e9; color: #1b5e20; font-size: 13px; margin: 4px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .pref-tag:hover { background: #c8e6c9; }
        .pref-tag.active { border-color: #1b5e20; background: #1b5e20; color: white; }
        .day-block { background: #f8f9fa; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; border-left: 4px solid #1b5e20; }
        .day-block .day-title { font-weight: 700; color: #1b5e20; margin-bottom: 8px; }
        .node-item { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .node-item .node-time { color: #888; font-size: 13px; min-width: 80px; flex-shrink: 0; }
        .node-item .node-icon { width: 28px; text-align: center; flex-shrink: 0; color: #1b5e20; }
        .reservation-form { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-top: 10px; }
        .reservation-form .form-group { margin-bottom: 8px; }
        .reservation-form label { font-weight: 500; font-size: 14px; }
        .reservation-form input, .reservation-form select, .reservation-form textarea { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .biz-image-box { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-top: 8px; }
        .biz-image-box img { width: 100%; height: 100%; object-fit: cover; }
        @media (max-width: 640px) {
            .top-bar { top: max(8px, env(safe-area-inset-top, 8px)); padding: 4px 12px; height: 38px; }
            .top-bar .brand { font-size: 15px; }
            .bottom-nav { padding: 6px 12px; gap: 4px; }
            .bottom-nav .nav-btn { font-size: 12px; padding: 6px 12px; }
            .float-btn { width: 40px; height: 40px; font-size: 16px; }
            .locate-btn { bottom: 100px; right: 12px; }
            .voice-btn { bottom: 155px; right: 12px; }
            .panel-body { padding: 12px 14px; }
            .category-bar { padding-top: calc(54px + env(safe-area-inset-top, 8px)); }
            .category-bar .cat-btn { font-size: 12px; padding: 4px 10px; }
        }
        .text-green { color: #1b5e20; }
        .btn-primary-custom { background: #1b5e20; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .btn-primary-custom:hover { background: #2e7d32; }
        .btn-outline-custom { background: transparent; color: #1b5e20; border: 2px solid #1b5e20; padding: 8px 16px; border-radius: 8px; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .btn-outline-custom:hover { background: #1b5e20; color: white; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar" id="topBar">
    <span class="brand" id="brandToggle"><i class="fas fa-leaf"></i> 智游通江</span>
</div>

<div class="category-bar" id="categoryBar">
    <button class="cat-btn" onclick="window.filterPOI('自然景区')">🏔️ 自然景区</button>
    <button class="cat-btn" onclick="window.filterPOI('红色景区')">🔴 红色景区</button>
    <button class="cat-btn" onclick="window.filterPOI('文博场馆')">🏛️ 文博场馆</button>
    <button class="cat-btn" onclick="window.filterPOI('餐饮住宿')">🍽️ 餐饮住宿</button>
    <button class="cat-btn" onclick="window.filterPOI('交通枢纽')">🚌 交通枢纽</button>
    <button class="cat-btn" onclick="window.filterPOI('游玩娱乐')">🎢 游玩娱乐</button>
    <button class="cat-btn" onclick="window.filterPOI('购物消费')">🛍️ 购物消费</button>
    <button class="cat-btn" onclick="window.filterPOI('公共服务')">🏛️ 公共服务</button>
    <button class="cat-btn" onclick="window.clearFilter()">✕ 清除筛选</button>
</div>

<div class="bottom-nav" id="bottomNav">
    <button class="nav-btn primary" onclick="window.openPanel('planPanel')">
        <i class="fas fa-wand-magic-sparkles"></i> 智能规划
    </button>
    <button class="nav-btn" onclick="window.openPanel('myPanel')">
        <i class="fas fa-user"></i> 我的
    </button>
</div>

<button class="float-btn locate-btn" onclick="window.locateUser()"><i class="fas fa-crosshairs"></i></button>
<button class="float-btn voice-btn" id="voiceToggleBtn" onclick="window.toggleVoice()"><i class="fas fa-volume-high"></i></button>

<!-- 面板：智能规划 -->
<div class="panel" id="planPanel">
    <div class="panel-header">
        <h2><i class="fas fa-route text-green"></i> 智能行程规划</h2>
        <button class="close-btn" onclick="window.closePanel('planPanel')">&times;</button>
    </div>
    <div class="panel-body">
        <div id="stepPreferences">
            <h5><i class="fas fa-sliders-h text-green"></i> 旅行偏好</h5>
            <div class="row g-2 mt-2">
                <div class="col-6"><label class="form-label fw-semibold">出发日期</label><input type="date" id="planStartDate" class="form-control" /></div>
                <div class="col-6"><label class="form-label fw-semibold">出发时间</label><select id="planStartTime" class="form-select"></select></div>
                <div class="col-6"><label class="form-label fw-semibold">天数</label><select id="planDays" class="form-select"><option value="1">1 天</option><option value="2" selected>2 天</option><option value="3">3 天</option><option value="4">4 天</option><option value="5">5 天</option></select></div>
                <div class="col-6"><label class="form-label fw-semibold">行程风格</label><select id="planStyle" class="form-select"><option value="compact">🚀 紧凑型</option><option value="relaxed" selected>🌿 舒适型</option><option value="indepth">🔍 深度游</option></select></div>
            </div>
            <div class="mt-2"><label class="form-label fw-semibold">景点类型偏好</label><div id="prefCategories" class="d-flex flex-wrap gap-1"><span class="pref-tag" data-value="自然景区">🌿 自然</span><span class="pref-tag" data-value="红色景区">🔴 红色</span><span class="pref-tag" data-value="文博场馆">🏛️ 文博</span><span class="pref-tag" data-value="餐饮住宿">🍽️ 餐饮</span><span class="pref-tag" data-value="交通枢纽">🚌 交通</span><span class="pref-tag" data-value="游玩娱乐">🎢 游玩</span><span class="pref-tag" data-value="购物消费">🛍️ 购物</span><span class="pref-tag" data-value="公共服务">🏛️ 服务</span></div></div>
            <div class="mt-2"><label class="form-label fw-semibold">用餐偏好</label><div id="prefCuisine" class="d-flex flex-wrap gap-1"><span class="pref-tag" data-value="川菜">🌶️ 川菜</span><span class="pref-tag" data-value="火锅">🫕 火锅</span><span class="pref-tag" data-value="小吃">🍢 小吃</span><span class="pref-tag" data-value="家常">🍳 家常</span><span class="pref-tag" data-value="简餐">🥪 简餐</span></div></div>

            <div class="mt-2">
                <label class="form-label fw-semibold">选择景点 <span class="text-secondary" style="font-weight:400;font-size:13px;">（点击主景点展开子景点）</span></label>
                <div id="poiSelectContainer" class="poi-select-list" style="max-height:400px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:8px;padding:8px;">
                    <div class="text-secondary text-center py-2">加载景点中...</div>
                </div>
                <div class="total-duration" id="selectedDurationDisplay">已选景点总游览时长：0 分钟</div>
                <div class="mt-1">
                    <button class="btn btn-sm btn-outline-secondary" onclick="window.selectAllPois(true)">全选</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="window.selectAllPois(false)">取消全选</button>
                    <span class="ms-2 text-secondary" id="selectedPoiCount">已选 0 个</span>
                </div>
            </div>

            <button class="btn btn-primary-custom w-100 mt-3" id="generatePlanBtn"><i class="fas fa-wand-magic-sparkles"></i> 生成行程方案</button>
            <div id="planLoading" class="text-center mt-3 hidden"><div class="spinner-border text-success" role="status"></div><p class="mt-2 text-secondary">正在为您规划最优行程...</p></div>
        </div>

        <div id="stepCompare" class="hidden">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5><i class="fas fa-chart-simple text-green"></i> 方案对比</h5>
                <button class="btn btn-secondary btn-sm" onclick="window.backToPreferences()"><i class="fas fa-arrow-left"></i> 重新设置</button>
            </div>
            <div id="solutionCompareContainer" class="solution-compare"></div>
            <div class="mt-3">
                <button class="btn btn-primary-custom w-100" onclick="window.selectSolution()" id="selectSolutionBtn" disabled>
                    <i class="fas fa-check"></i> 选择此方案
                </button>
            </div>
        </div>

        <div id="stepDetail" class="hidden">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5><i class="fas fa-map text-green"></i> 我的行程</h5>
                <button class="btn btn-secondary btn-sm" onclick="window.backToCompare()"><i class="fas fa-arrow-left"></i> 返回对比</button>
            </div>
            <div id="tripDetailContainer"></div>
            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-primary-custom flex-grow-1" onclick="window.saveTripSolution()"><i class="fas fa-save"></i> 保存行程</button>
                <button class="btn btn-outline-custom" onclick="window.startNavigation()"><i class="fas fa-location-dot"></i> 开始导航</button>
            </div>
        </div>
    </div>
</div>

<!-- 面板：我的 -->
<div class="panel" id="myPanel">
    <div class="panel-header"><h2><i class="fas fa-user text-green"></i> 我的</h2><button class="close-btn" onclick="window.closePanel('myPanel')">&times;</button></div>
    <div class="panel-body">
        <ul class="nav nav-tabs" id="myTabs">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#myTrips">📅 行程</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#myReservations">📋 预约</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#myFeedback">💬 留言</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#mySettings">⚙️ 偏好</a></li>
        </ul>
        <div class="tab-content mt-3">
            <div class="tab-pane active" id="myTrips"><div id="myTripsContent"></div></div>
            <div class="tab-pane" id="myReservations"><div id="myReservationsContent"></div></div>
            <div class="tab-pane" id="myFeedback"><textarea id="feedbackMsg" class="form-control" rows="3" placeholder="建议或问题..."></textarea><button class="btn btn-primary-custom mt-2" onclick="window.submitFeedback()">提交</button><div id="feedbackHistory" class="mt-3"></div></div>
            <div class="tab-pane" id="mySettings">
                <h6><i class="fas fa-sliders-h text-green"></i> 旅行偏好设置</h6>
                <div class="mb-2"><label class="form-label fw-semibold">景点类型</label><div id="settingsCategories" class="d-flex flex-wrap gap-1"><span class="pref-tag" data-value="自然景区">🌿 自然</span><span class="pref-tag" data-value="红色景区">🔴 红色</span><span class="pref-tag" data-value="文博场馆">🏛️ 文博</span><span class="pref-tag" data-value="餐饮住宿">🍽️ 餐饮</span><span class="pref-tag" data-value="交通枢纽">🚌 交通</span><span class="pref-tag" data-value="游玩娱乐">🎢 游玩</span><span class="pref-tag" data-value="购物消费">🛍️ 购物</span><span class="pref-tag" data-value="公共服务">🏛️ 服务</span></div></div>
                <div class="mb-2"><label class="form-label fw-semibold">用餐偏好</label><div id="settingsCuisine" class="d-flex flex-wrap gap-1"><span class="pref-tag" data-value="川菜">🌶️ 川菜</span><span class="pref-tag" data-value="火锅">🫕 火锅</span><span class="pref-tag" data-value="小吃">🍢 小吃</span><span class="pref-tag" data-value="家常">🍳 家常</span><span class="pref-tag" data-value="简餐">🥪 简餐</span></div></div>
                <div class="mb-2"><label class="form-label fw-semibold">行程风格</label><select id="settingsPace" class="form-select"><option value="compact">🚀 紧凑型</option><option value="relaxed" selected>🌿 舒适型</option><option value="indepth">🔍 深度游</option></select></div>
                <button class="btn btn-primary-custom" onclick="window.savePreferences()"><i class="fas fa-save"></i> 保存偏好</button>
            </div>
        </div>
    </div>
</div>

<!-- 商户详情面板 -->
<div class="panel" id="merchantDetailPanel">

<script type="module">
// =============================================================
// 完全移除认证，使用设备ID（localStorage）管理所有用户数据
// =============================================================
import { getPois, getMerchantsByPoi, getTransportPresets } from './js/api.js';
import { initMap, loadPoisToMap, locateUser, setVoiceEnabled, getAllPois, clearFilter, applyFilter } from './js/map.js';
import { formatTime, timeToMinutes, fetchWeatherForecast, getDayWeatherTip, speak, cancelSpeech } from './js/utils.js';

// ===== 设备ID（本地唯一标识） =====
function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        localStorage.setItem('deviceId', id);
    }
    return id;
}
const DEVICE_ID = getDeviceId();

// ===== localStorage 数据操作 =====
function getLocalData(key) {
    try {
        return JSON.parse(localStorage.getItem(key) || '[]');
    } catch { return []; }
}
function setLocalData(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
}

// ===== 全局状态 =====
let allPois = [];
let currentSolutions = [];
let selectedSolutionIndex = -1;
let currentTripData = null;
let selectedPoiIds = new Set();

// ===== 工具函数 =====
function fmtTime(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// ===== 初始化时间选择器 =====
function initTimeSelectors() {
    const sel = document.getElementById('planStartTime');
    if (!sel) return;
    sel.innerHTML = '';
    for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 10) {
            const val = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            sel.innerHTML += `<option value="${val}">${val}</option>`;
        }
    }
    const now = new Date();
    let h = now.getHours(), m = Math.floor(now.getMinutes() / 10) * 10;
    if (m === 60) { m = 0; h = (h + 1) % 24; }
    sel.value = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    const dateInput = document.getElementById('planStartDate');
    if (dateInput) dateInput.value = now.toISOString().slice(0, 10);
}

// ===== 渲染景点选择列表（分类+子景点） =====
function renderPoiSelection(pois) {
    const container = document.getElementById('poiSelectContainer');
    if (!container) return;
    if (!pois || pois.length === 0) {
        container.innerHTML = '<div class="text-secondary text-center py-2">暂无景点数据</div>';
        return;
    }

    const categories = {};
    const categoryOrder = ['自然景区', '红色景区', '文博场馆', '餐饮住宿', '交通枢纽', '游玩娱乐', '购物消费', '公共服务', '其他'];
    pois.forEach(p => {
        const cat = p.category ? p.category.split(',')[0].trim() : '其他';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
    });

    const childrenMap = {};
    pois.forEach(p => {
        if (p.parent_id) {
            if (!childrenMap[p.parent_id]) childrenMap[p.parent_id] = [];
            childrenMap[p.parent_id].push(p);
        }
    });

    let html = '';
    categoryOrder.forEach(cat => {
        const items = categories[cat] || [];
        if (items.length === 0) return;
        const mainItems = items.filter(p => !p.parent_id);
        if (mainItems.length === 0) return;

        html += `<div class="poi-category-group">`;
        html += `<div class="poi-category-title" onclick="this.nextElementSibling.classList.toggle('hidden')">${cat} (${mainItems.length}) <span>▼</span></div>`;
        html += `<div class="poi-category-content">`;

        mainItems.forEach(p => {
            const hasChildren = childrenMap[p.id] && childrenMap[p.id].length > 0;
            const isChecked = selectedPoiIds.has(p.id);
            const dur = p.visit_duration || 0;

            html += `<div class="poi-item" data-poi-id="${p.id}">`;
            html += `<div class="poi-name" onclick="window.togglePoiChildren('${p.id}')">`;
            html += `<input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); window.togglePoiSelection('${p.id}')">`;
            html += `<span>${p.name}</span>`;
            html += `<span class="poi-duration-badge">${dur}分钟</span>`;
            if (hasChildren) html += `<span class="text-secondary" style="font-size:12px;"> (${childrenMap[p.id].length}个子景点)</span>`;
            html += `</div>`;

            if (hasChildren) {
                html += `<div class="poi-sub-list hidden" id="sub-${p.id}">`;
                childrenMap[p.id].forEach(child => {
                    const childChecked = selectedPoiIds.has(child.id);
                    const childDur = child.visit_duration || 0;
                    html += `<div class="sub-item">`;
                    html += `<input type="checkbox" ${childChecked ? 'checked' : ''} onclick="event.stopPropagation(); window.togglePoiSelection('${child.id}')">`;
                    html += `<span>${child.name}</span>`;
                    html += `<span class="poi-duration-badge">${childDur}分钟</span>`;
                    html += `</div>`;
                });
                html += `</div>`;
            }
            html += `</div>`;
        });

        html += `</div></div>`;
    });

    container.innerHTML = html;
    updateSelectedInfo();
}

window.togglePoiChildren = function(poiId) {
    const subEl = document.getElementById(`sub-${poiId}`);
    if (subEl) subEl.classList.toggle('hidden');
};

window.togglePoiSelection = function(poiId) {
    const idStr = String(poiId);
    if (selectedPoiIds.has(idStr)) {
        selectedPoiIds.delete(idStr);
    } else {
        selectedPoiIds.add(idStr);
    }
    // 同步UI
    const container = document.getElementById('poiSelectContainer');
    const allCheckboxes = container.querySelectorAll('input[type="checkbox"]');
    allCheckboxes.forEach(cb => {
        const val = cb.value || cb.getAttribute('value');
        if (String(val) === idStr) {
            cb.checked = selectedPoiIds.has(idStr);
        }
    });
    // 子景点联动
    const allPoisData = window.__allPois || [];
    const children = allPoisData.filter(p => String(p.parent_id) === idStr);
    if (children.length > 0) {
        container.querySelectorAll(`#sub-${poiId} input[type="checkbox"]`).forEach(cb => {
            const childId = cb.value || cb.getAttribute('value');
            cb.checked = selectedPoiIds.has(idStr);
            if (selectedPoiIds.has(idStr)) {
                selectedPoiIds.add(String(childId));
            } else {
                selectedPoiIds.delete(String(childId));
            }
        });
    }
    updateSelectedInfo();
};

window.selectAllPois = function(select) {
    const checkboxes = document.querySelectorAll('#poiSelectContainer input[type="checkbox"]');
    checkboxes.forEach(cb => {
        const id = cb.value || cb.getAttribute('value');
        if (id) {
            if (select) selectedPoiIds.add(id);
            else selectedPoiIds.delete(id);
            cb.checked = select;
        }
    });
    updateSelectedInfo();
};

function updateSelectedInfo() {
    const total = selectedPoiIds.size;
    document.getElementById('selectedPoiCount').textContent = `已选 ${total} 个`;
    const allPoisData = window.__allPois || [];
    let totalDuration = 0;
    selectedPoiIds.forEach(id => {
        const poi = allPoisData.find(p => String(p.id) === id);
        if (poi) totalDuration += poi.visit_duration || 0;
    });
    document.getElementById('selectedDurationDisplay').textContent = `已选景点总游览时长：${totalDuration} 分钟`;
}

// ===== 生成行程方案 =====
window.generatePlans = async function() {
    const loadingEl = document.getElementById('planLoading');
    const stepPrefs = document.getElementById('stepPreferences');
    const stepCompare = document.getElementById('stepCompare');
    const generateBtn = document.getElementById('generatePlanBtn');

    const startDate = document.getElementById('planStartDate').value;
    const startTime = document.getElementById('planStartTime').value;
    const days = parseInt(document.getElementById('planDays').value);
    const style = document.getElementById('planStyle').value;

    if (!startDate) { alert('请选择出发日期'); return; }
    if (selectedPoiIds.size === 0) { alert('请至少选择一个景点'); return; }

    const allPoisData = window.__allPois || [];
    const selectedPois = allPoisData.filter(p => selectedPoiIds.has(String(p.id)));
    if (selectedPois.length === 0) {
        alert('未找到选中的景点数据，请重新选择');
        return;
    }

    const presets = await getTransportPresets();
    const travelTimes = {};
    presets.forEach(p => {
        travelTimes[`${p.from_poi_id}_${p.to_poi_id}`] = p.time_min;
    });

    generateBtn.disabled = true;
    loadingEl.classList.remove('hidden');

    try {
        const result = generateSimplePlan(selectedPois, startDate, startTime, days, style, travelTimes);
        currentSolutions = [{
            style: style,
            data: result,
            score: 0.8
        }];
        selectedSolutionIndex = -1;

        renderDetailedSolutions(currentSolutions);
        loadingEl.classList.add('hidden');
        stepPrefs.classList.add('hidden');
        stepCompare.classList.remove('hidden');
    } catch (e) {
        alert('生成方案失败：' + e.message);
        console.error(e);
        loadingEl.classList.add('hidden');
        generateBtn.disabled = false;
    } finally {
        generateBtn.disabled = false;
    }
};

function generateSimplePlan(pois, startDate, startTime, days, style, travelTimes) {
    const sorted = [...pois].sort((a, b) => (a.visit_duration || 0) - (b.visit_duration || 0));
    const dayStart = 480;
    const dayEnd = 1080;
    const lunchStart = 690;
    const lunchEnd = 750;
    const dinnerStart = 1050;
    const dinnerEnd = 1110;
    const mealDuration = 60;

    let currentTime = timeToMinutes(startTime) || dayStart;
    let currentDay = 1;
    let lastPoiId = 'county';
    let dayNodes = [];
    const daysData = [];

    for (let poi of sorted) {
        const travelKey = `${lastPoiId}_${poi.id}`;
        const travel = travelTimes[travelKey] || 0;

        if (currentTime + travel + poi.visit_duration > dayEnd) {
            if (dayNodes.length > 0) {
                daysData.push({ day: currentDay, date: startDate, nodes: dayNodes });
                dayNodes = [];
            }
            currentDay++;
            currentTime = dayStart;
            lastPoiId = 'county';
            const newTravel = travelTimes[`${lastPoiId}_${poi.id}`] || 0;
            currentTime += newTravel;
        } else {
            currentTime += travel;
        }

        if (!dayNodes.some(n => n.type === 'meal' && n.name === '午餐') && 
            currentTime < lunchStart && currentTime + poi.visit_duration > lunchStart) {
            dayNodes.push({ type: 'meal', name: '午餐时间', startTime: lunchStart, endTime: lunchStart + mealDuration });
            currentTime = lunchStart + mealDuration;
        }
        if (!dayNodes.some(n => n.type === 'meal' && n.name === '晚餐') &&
            currentTime < dinnerStart && currentTime + poi.visit_duration > dinnerStart) {
            dayNodes.push({ type: 'meal', name: '晚餐时间', startTime: dinnerStart, endTime: dinnerStart + mealDuration });
            currentTime = dinnerStart + mealDuration;
        }

        dayNodes.push({
            type: 'visit',
            poi_id: poi.id,
            poi_name: poi.name,
            startTime: currentTime,
            endTime: currentTime + poi.visit_duration,
            duration: poi.visit_duration || 0
        });
        currentTime += poi.visit_duration;
        lastPoiId = poi.id;
    }

    if (dayNodes.length > 0) {
        daysData.push({ day: currentDay, date: startDate, nodes: dayNodes });
    }

    return {
        days: daysData,
        total_days: daysData.length,
        total_pois: sorted.length
    };
}

function renderDetailedSolutions(solutions) {
    const container = document.getElementById('solutionCompareContainer');
    if (!container) return;

    const styleLabels = {
        compact: { label: '紧凑型', badge: 'badge-compact', icon: '🚀' },
        relaxed: { label: '舒适型', badge: 'badge-relaxed', icon: '🌿' },
        indepth: { label: '深度游', badge: 'badge-indepth', icon: '🔍' }
    };

    let html = '';
    solutions.forEach((sol, idx) => {
        const info = styleLabels[sol.style] || styleLabels.relaxed;
        const data = sol.data || {};
        const totalPois = data.total_pois || 0;
        const totalDays = data.total_days || 1;

        html += `
            <div class="solution-card" onclick="window.selectSolutionCard(${idx})" id="sol-card-${idx}">
                <div class="badge-style ${info.badge}">${info.icon} ${info.label}</div>
                <div class="stat-row"><span>📅 天数</span><span>${totalDays} 天</span></div>
                <div class="stat-row"><span>📍 景点</span><span>${totalPois} 个</span></div>
        `;

        if (data.days) {
            data.days.forEach(day => {
                html += `<div class="day-detail"><div class="day-title">📅 第${day.day}天 (${day.date})</div>`;
                if (day.nodes) {
                    day.nodes.forEach(node => {
                        if (node.type === 'meal') {
                            html += `<div class="time-line"><span class="time">${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}</span><span class="icon">🍽️</span><span>${node.name}</span></div>`;
                        } else if (node.type === 'visit') {
                            html += `<div class="time-line"><span class="time">${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}</span><span class="icon">📍</span><span>${node.poi_name}</span></div>`;
                        }
                    });
                }
                html += `</div>`;
            });
        }

        html += `
                <button class="btn btn-sm btn-outline-custom mt-2 w-100" onclick="event.stopPropagation(); window.previewSolution(${idx})">
                    <i class="fas fa-eye"></i> 预览详情
                </button>
            </div>
        `;
    });

    container.innerHTML = html;
    document.getElementById('selectSolutionBtn').disabled = true;
}

window.selectSolutionCard = function(idx) {
    document.querySelectorAll('.solution-card').forEach(el => el.classList.remove('selected'));
    const card = document.getElementById(`sol-card-${idx}`);
    if (card) card.classList.add('selected');
    selectedSolutionIndex = idx;
    document.getElementById('selectSolutionBtn').disabled = false;
};

window.previewSolution = function(idx) {
    const sol = currentSolutions[idx];
    if (!sol) return;
    const data = sol.data || {};
    let msg = `📋 ${sol.style === 'compact' ? '紧凑型' : sol.style === 'relaxed' ? '舒适型' : '深度游'} 方案\n`;
    msg += `📅 ${data.total_days || 0} 天 | 📍 ${data.total_pois || 0} 个景点\n\n`;
    if (data.days) {
        data.days.forEach(day => {
            msg += `--- 第${day.day}天 (${day.date}) ---\n`;
            if (day.nodes) {
                day.nodes.forEach(node => {
                    if (node.type === 'meal') {
                        msg += `  ${fmtTime(node.startTime)} - ${fmtTime(node.endTime)} 🍽️ ${node.name}\n`;
                    } else if (node.type === 'visit') {
                        msg += `  ${fmtTime(node.startTime)} - ${fmtTime(node.endTime)} 📍 ${node.poi_name}\n`;
                    }
                });
            }
            msg += '\n';
        });
    }
    alert(msg);
};

window.selectSolution = function() {
    if (selectedSolutionIndex < 0 || selectedSolutionIndex >= currentSolutions.length) {
        alert('请先选择一个方案');
        return;
    }
    const sol = currentSolutions[selectedSolutionIndex];
    currentTripData = sol.data;
    showTripDetail(sol.data);
    document.getElementById('stepCompare').classList.add('hidden');
    document.getElementById('stepDetail').classList.remove('hidden');
};

function showTripDetail(data) {
    const container = document.getElementById('tripDetailContainer');
    if (!container) return;
    let html = '';
    if (data.days) {
        data.days.forEach(day => {
            html += `<div class="day-block"><div class="day-title">📅 第${day.day}天 (${day.date})</div>`;
            if (day.nodes) {
                day.nodes.forEach(node => {
                    if (node.type === 'meal') {
                        html += `<div class="node-item"><span class="node-time">${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}</span><span class="node-icon">🍽️</span><span>${node.name}</span></div>`;
                    } else if (node.type === 'visit') {
                        html += `<div class="node-item"><span class="node-time">${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}</span><span class="node-icon">📍</span><span>${node.poi_name}</span></div>`;
                    }
                });
            }
            html += `</div>`;
        });
    }
    html += `
        <div class="card-modern mt-2">
            <div class="card-title">📊 行程摘要</div>
            <div class="stat-row"><span>总天数</span><span>${data.total_days || 0} 天</span></div>
            <div class="stat-row"><span>景点数</span><span>${data.total_pois || 0} 个</span></div>
        </div>
    `;
    container.innerHTML = html;
}

// ===== 保存行程（到localStorage） =====
window.saveTripSolution = function() {
    if (!currentTripData) { alert('没有可保存的行程'); return; }
    const trips = getLocalData('trips');
    trips.push({
        id: 'trip_' + Date.now(),
        deviceId: DEVICE_ID,
        data: currentTripData,
        savedAt: new Date().toISOString()
    });
    setLocalData('trips', trips);
    alert('行程已保存');
    window.renderMyTrips();
};

// ===== 我的行程（从localStorage读取） =====
window.renderMyTrips = function() {
    const container = document.getElementById('myTripsContent');
    if (!container) return;
    const trips = getLocalData('trips').filter(t => t.deviceId === DEVICE_ID);
    if (trips.length === 0) {
        container.innerHTML = '<p class="text-secondary">暂无保存的行程</p>';
        return;
    }
    let html = '';
    trips.forEach((trip) => {
        const data = trip.data || {};
        html += `
            <div class="card-modern">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="card-title">📅 ${data.start_date || '未命名'}</div>
                    <button class="btn btn-sm btn-danger" onclick="window.deleteTripSolution('${trip.id}')">删除</button>
                </div>
                <div class="card-sub">天数: ${data.total_days || 0} 天 | 景点: ${data.total_pois || 0} 个</div>
                <button class="btn btn-sm btn-outline-custom mt-2" onclick="window.viewTripSolution('${trip.id}')">
                    <i class="fas fa-eye"></i> 查看详情
                </button>
            </div>
        `;
    });
    container.innerHTML = html;
};

window.deleteTripSolution = function(id) {
    if (!confirm('确认删除此行程？')) return;
    let trips = getLocalData('trips');
    trips = trips.filter(t => t.id !== id);
    setLocalData('trips', trips);
    window.renderMyTrips();
};

window.viewTripSolution = function(id) {
    const trips = getLocalData('trips');
    const trip = trips.find(t => t.id === id);
    if (!trip) return;
    const data = trip.data || {};
    let msg = `📋 行程详情\n📅 ${data.start_date || '未知日期'}\n\n`;
    if (data.days) {
        data.days.forEach(day => {
            msg += `--- 第${day.day}天 (${day.date}) ---\n`;
            if (day.nodes) {
                day.nodes.forEach(node => {
                    if (node.type === 'meal') {
                        msg += `  ${fmtTime(node.startTime)} - ${fmtTime(node.endTime)} 🍽️ ${node.name}\n`;
                    } else if (node.type === 'visit') {
                        msg += `  ${fmtTime(node.startTime)} - ${fmtTime(node.endTime)} 📍 ${node.poi_name}\n`;
                    }
                });
            }
            msg += '\n';
        });
    }
    alert(msg);
};

// ===== 预约（存储到localStorage） =====
window.renderMyReservations = function() {
    const container = document.getElementById('myReservationsContent');
    if (!container) return;
    const reservations = getLocalData('reservations').filter(r => r.deviceId === DEVICE_ID);
    if (reservations.length === 0) {
        container.innerHTML = '<p class="text-secondary">暂无预约</p>';
        return;
    }
    const sorted = reservations.sort((a, b) => new Date(b.reservation_date) - new Date(a.reservation_date));
    let html = '';
    sorted.forEach((r, idx) => {
        html += `
            <div class="card-modern">
                <div onclick="window.toggleReservationDetail(${idx})" style="cursor:pointer;">
                    <div class="card-title">📅 ${r.reservation_date} | ${r.merchantName || '未知商户'}</div>
                    <div class="card-sub">${r.category || '未分类'}</div>
                </div>
                <div id="res-detail-${idx}" class="hidden mt-2">
                    <p><b>单位：</b>${r.unit || ''}</p>
                    <p><b>联系人：</b>${r.name || ''}</p>
                    <p><b>电话：</b>${r.phone || ''}</p>
                    <p><b>人数：</b>${r.visitor_count}</p>
                    <p><b>时段：</b>${r.time_slot_start} - ${r.time_slot_end || ''}</p>
                    <p><b>备注：</b>${r.remark || ''}</p>
                    <p><b>状态：</b>${r.status}</p>
                    <button class="btn btn-sm btn-danger" onclick="window.deleteReservationHandler('${r.id}')">删除</button>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
};

window.toggleReservationDetail = function(idx) {
    const el = document.getElementById(`res-detail-${idx}`);
    if (el) el.classList.toggle('hidden');
};

window.deleteReservationHandler = function(id) {
    if (!confirm('确认删除此预约？')) return;
    let reservations = getLocalData('reservations');
    reservations = reservations.filter(r => r.id !== id);
    setLocalData('reservations', reservations);
    window.renderMyReservations();
};

window.submitReservation = function(merchantId, merchantName, category) {
    const date = document.getElementById(`res-date-${merchantId}`).value;
    const timeRange = document.getElementById(`res-time-${merchantId}`).value;
    const [start, end] = timeRange.split('-');
    const name = document.getElementById(`res-name-${merchantId}`).value.trim();
    const phone = document.getElementById(`res-phone-${merchantId}`).value.trim();
    const count = parseInt(document.getElementById(`res-count-${merchantId}`).value) || 1;
    const remark = document.getElementById(`res-remark-${merchantId}`).value.trim();

    if (!date || !name || !phone) {
        alert('请填写日期、联系人和电话');
        return;
    }

    const reservations = getLocalData('reservations');
    reservations.push({
        id: 'res_' + Date.now(),
        deviceId: DEVICE_ID,
        merchant_id: merchantId,
        merchantName: merchantName,
        category: category,
        reservation_date: date,
        time_slot_start: start,
        time_slot_end: end,
        name: name,
        phone: phone,
        visitor_count: count,
        remark: remark,
        status: 'pending'
    });
    setLocalData('reservations', reservations);
    alert('预约提交成功！');
    // 重置表单
    document.getElementById(`res-date-${merchantId}`).value = '';
    document.getElementById(`res-name-${merchantId}`).value = '';
    document.getElementById(`res-phone-${merchantId}`).value = '';
    document.getElementById(`res-count-${merchantId}`).value = '1';
    document.getElementById(`res-remark-${merchantId}`).value = '';
    window.toggleReservationForm(merchantId);
    window.renderMyReservations();
};

window.toggleReservationForm = function(merchantId) {
    const form = document.getElementById(`reservation-form-${merchantId}`);
    if (form) form.classList.toggle('hidden');
};

// ===== 留言（存储到localStorage） =====
window.renderFeedbackHistory = function() {
    const container = document.getElementById('feedbackHistory');
    if (!container) return;
    const feedbacks = getLocalData('feedbacks').filter(f => f.deviceId === DEVICE_ID);
    if (feedbacks.length === 0) {
        container.innerHTML = '<p class="text-secondary">暂无留言</p>';
        return;
    }
    let html = '';
    feedbacks.forEach(f => {
        html += `
            <div class="card-modern">
                <p>${f.message}</p>
                <small class="text-secondary">${new Date(f.created_at).toLocaleString()}</small>
                ${f.reply ? `<div class="bg-green-light p-2 mt-2 rounded">📌 回复：${f.reply}</div>` : ''}
            </div>
        `;
    });
    container.innerHTML = html;
};

window.submitFeedback = function() {
    const msg = document.getElementById('feedbackMsg')?.value.trim();
    if (!msg) { alert('请输入内容'); return; }
    const feedbacks = getLocalData('feedbacks');
    feedbacks.push({
        id: 'fb_' + Date.now(),
        deviceId: DEVICE_ID,
        message: msg,
        reply: null,
        created_at: new Date().toISOString()
    });
    setLocalData('feedbacks', feedbacks);
    alert('留言提交成功');
    document.getElementById('feedbackMsg').value = '';
    window.renderFeedbackHistory();
};

// ===== 保存偏好（到localStorage） =====
window.savePreferences = function() {
    const selectedCats = [];
    document.querySelectorAll('#settingsCategories .pref-tag.active').forEach(el => {
        selectedCats.push(el.dataset.value);
    });
    const selectedCuisine = [];
    document.querySelectorAll('#settingsCuisine .pref-tag.active').forEach(el => {
        selectedCuisine.push(el.dataset.value);
    });
    const pace = document.getElementById('settingsPace').value;
    const prefs = { preferred_categories: selectedCats, cuisine_prefs: selectedCuisine, pace: pace };
    localStorage.setItem('userPrefs_' + DEVICE_ID, JSON.stringify(prefs));
    alert('偏好已保存');
    // 同步到界面
    document.querySelectorAll('#prefCategories .pref-tag, #settingsCategories .pref-tag').forEach(el => {
        el.classList.toggle('active', selectedCats.includes(el.dataset.value));
    });
    document.querySelectorAll('#prefCuisine .pref-tag, #settingsCuisine .pref-tag').forEach(el => {
        el.classList.toggle('active', selectedCuisine.includes(el.dataset.value));
    });
};

// ===== 商户详情 =====
window.showPoiDetail = async function(poi) {
    try {
        const merchants = await getMerchantsByPoi(poi.id);
        const merchant = merchants && merchants.length > 0 ? merchants[0] : null;
        document.getElementById('merchantDetailTitle').textContent = poi.name;
        let html = '';
        if (merchant) {
            const sd = merchant.service_data || {};
            const categories = sd.businessCategories || [];
            const items = sd.businessItems || [];
            if (categories.length > 0 && items.length > 0) {
                categories.forEach(cat => {
                    const catItems = items.filter(item => item.category === cat);
                    if (catItems.length === 0) return;
                    html += `<div><div onclick="this.nextElementSibling.classList.toggle('hidden')" style="cursor:pointer;background:#f9f9f9;padding:8px;border:1px solid #ddd;border-radius:4px;margin:4px 0;">📁 ${cat} (${catItems.length})</div><div class="hidden">`;
                    catItems.forEach((item, idx) => {
                        if (!item.name) return;
                        let priceStr = item.price ? ` ${item.price}` : '';
                        let durStr = item.duration ? ` ${item.duration}` : '';
                        let descStr = item.description ? `<p>${item.description}</p>` : '';
                        let imgHtml = item.image ? `<div class="biz-image-box"><img src="${item.image}" alt="${item.name}"></div>` : '';
                        html += `<div class="card-modern"><div><b>${idx+1}. ${item.name}</b>${priceStr}${durStr}${descStr}</div>${imgHtml}</div>`;
                    });
                    html += `</div></div>`;
                });
            } else {
                const flatItems = sd.items || [];
                flatItems.filter(item => item.name).forEach((item, idx) => {
                    let priceStr = item.price ? ` ${item.price}` : '';
                    let durStr = item.duration ? ` ${item.duration}` : '';
                    let descStr = item.description ? `<p>${item.description}</p>` : '';
                    let imgHtml = item.image ? `<div class="biz-image-box"><img src="${item.image}" alt="${item.name}"></div>` : '';
                    html += `<div class="card-modern"><div><b>${idx+1}. ${item.name}</b>${priceStr}${durStr}${descStr}</div>${imgHtml}</div>`;
                });
            }
            let phone = merchant.phone || '未提供';
            let status = merchant.status === 'open' ? '营业中' : (merchant.status === 'closed' ? '休息' : '繁忙');
            let parking = merchant.parking_spots ?? 0;
            html += `<hr><p><i class="fas fa-phone"></i> ${phone} | <i class="fas fa-circle ${merchant.status === 'open' ? 'text-success' : 'text-danger'}"></i> ${status} | <i class="fas fa-parking"></i> ${parking} 个车位</p><p>${poi.description || ''}</p>`;
            html += `
                <div class="mt-3">
                    <button class="btn btn-primary-custom" onclick="window.toggleReservationForm('${merchant.id}')">
                        <i class="fas fa-calendar-plus"></i> 预约
                    </button>
                    <div id="reservation-form-${merchant.id}" class="reservation-form hidden mt-2">
                        <h6>预约信息</h6>
                        <div class="form-group"><label>预约日期</label><input type="date" id="res-date-${merchant.id}" class="form-control" /></div>
                        <div class="form-group"><label>时段</label>
                            <select id="res-time-${merchant.id}" class="form-select">
                                <option value="08:00-09:00">08:00-09:00</option>
                                <option value="09:00-10:00">09:00-10:00</option>
                                <option value="10:00-11:00">10:00-11:00</option>
                                <option value="11:00-12:00">11:00-12:00</option>
                                <option value="13:00-14:00">13:00-14:00</option>
                                <option value="14:00-15:00">14:00-15:00</option>
                                <option value="15:00-16:00">15:00-16:00</option>
                                <option value="16:00-17:00">16:00-17:00</option>
                            </select>
                        </div>
                        <div class="form-group"><label>联系人</label><input type="text" id="res-name-${merchant.id}" class="form-control" placeholder="姓名" /></div>
                        <div class="form-group"><label>电话</label><input type="tel" id="res-phone-${merchant.id}" class="form-control" placeholder="手机号" /></div>
                        <div class="form-group"><label>人数</label><input type="number" id="res-count-${merchant.id}" class="form-control" min="1" value="1" /></div>
                        <div class="form-group"><label>备注</label><textarea id="res-remark-${merchant.id}" class="form-control" rows="2" placeholder="可选备注"></textarea></div>
                        <button class="btn btn-primary-custom btn-sm" onclick="window.submitReservation('${merchant.id}', '${merchant.display_name || poi.name}', '${merchant.business_type || ''}')">提交预约</button>
                        <button class="btn btn-secondary btn-sm" onclick="window.toggleReservationForm('${merchant.id}')">取消</button>
                    </div>
                </div>
            `;
        } else {
            html += '<p style="color:#999;">该商户信息暂未录入</p><hr><p>' + (poi.description || '') + '</p>';
        }
        document.getElementById('merchantDetailContent').innerHTML = html;
        window.openPanel('merchantDetailPanel');
    } catch (e) {
        console.error('加载商户详情失败:', e);
        alert('加载失败：' + e.message);
    }
};

// ===== 分类栏切换 =====
const brandToggle = document.getElementById('brandToggle');
const categoryBar = document.getElementById('categoryBar');
let hideTimer = null;

brandToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const isShowing = categoryBar.classList.contains('show');
    if (isShowing) {
        categoryBar.classList.remove('show');
        clearTimeout(hideTimer);
    } else {
        categoryBar.classList.add('show');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            categoryBar.classList.remove('show');
        }, 3000);
    }
});

document.addEventListener('click', function(e) {
    if (!categoryBar.contains(e.target) && e.target !== brandToggle) {
        categoryBar.classList.remove('show');
        clearTimeout(hideTimer);
    }
});

// ===== 加载偏好 =====
function loadPreferences() {
    const prefs = JSON.parse(localStorage.getItem('userPrefs_' + DEVICE_ID) || '{}');
    if (prefs.preferred_categories) {
        document.querySelectorAll('#settingsCategories .pref-tag, #prefCategories .pref-tag').forEach(el => {
            el.classList.toggle('active', prefs.preferred_categories.includes(el.dataset.value));
        });
    }
    if (prefs.cuisine_prefs) {
        document.querySelectorAll('#settingsCuisine .pref-tag, #prefCuisine .pref-tag').forEach(el => {
            el.classList.toggle('active', prefs.cuisine_prefs.includes(el.dataset.value));
        });
    }
    if (prefs.pace) {
        document.getElementById('settingsPace').value = prefs.pace;
    }
}

async function init() {
    try {
        const pois = await getPois();
        allPois = pois;

        initMap('map');
        loadPoisToMap(pois);

        initTimeSelectors();

        await window.renderMyReservations();

        locateUser();

        document.getElementById('generatePlanBtn').addEventListener('click', window.generatePlans);

        console.log('[系统] 初始化完成, POI数量:', pois.length);
    } catch (e) {
        console.error('[系统] 初始化失败:', e);
        alert('初始化失败：' + e.message);
    }
}
init();
