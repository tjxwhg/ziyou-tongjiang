        .category-bar { position:fixed; top:-50px; left:0; right:0; z-index:1600; background:rgba(255,255,255,0.95); box-shadow:0 2px 8px rgba(0,0,0,0.15); transition:top 0.3s ease; display:flex; flex-wrap:wrap; padding:8px 12px; gap:6px; border-bottom:1px solid #ddd; }

        .category-bar .cat-btn.active { background:#2e7d32; color:white; border-color:#2e7d32; }
        .cat-trigger { position:fixed; top:0; left:50%; transform:translateX(-50%); z-index:1599; background:rgba(255,255,255,0.8); padding:2px 16px; border-radius:0 0 12px 12px; font-size:12px; cursor:pointer; border:1px solid #ccc; border-top:none; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
        .cat-trigger:hover { background:white; }
    </style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ==================== 核心配置 ====================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let map, allPois = [], generatedTripData = null;
let userMarker = null, simMarker = null;
let anonymousUserId = null;
let voiceEnabled = true;
let lastTriggeredPoiIds = {};
const TRIGGER_RADIUS = 30;
const GPS_ACCURACY_TOLERANCE = 10;
let watchId = null;
let currentGcjPos = null;
let currentAudio = null;
let weatherCache = null;
let currentFilterCategory = null;
let poiMarkers = [];
let filterTimeoutId = null;

const COUNTY = { lat:31.911705, lng:107.245033, name:'红军广场', id:'county' };
const poiColors = { '自然景区':'#2E7D32', '红色景区':'#9C27B0', '文博场馆':'#9C27B0', '餐饮住宿':'#FF9800', '停车场':'#00BCD4', '公共服务':'#607D8B' };
let transportPresets = {};
const DAY_START=480, DAY_END=1080, LUNCH_TRIGGER=690, LUNCH_END=750, DINNER_TRIGGER=1050, DINNER_END=1110, MEAL_DURATION=60;
// 只允许自然景区、红色景区、文博场馆
const ALLOWED_CATEGORIES = ['自然景区', '红色景区', '文博场馆'];
const NON_VISIT_CATEGORIES = ['交通枢纽','餐饮住宿','公共服务','特产购物','游玩娱乐'];
let routeLegs=[], mainPoiOptions=[], allowedPoiOptions=[];

// ==================== 辅助函数 ====================
function wgs84ToGcj02(lat, lon) {
    const a = 6378245.0;
    const ee = 0.00669342162296594323;
    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }
    function transformLon(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
    }
    const dLat = transformLat(lon - 105.0, lat - 35.0);
    const dLon = transformLon(lon - 105.0, lat - 35.0);
    const radLat = lat / 180.0 * Math.PI;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    const dLatFinal = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
    const dLonFinal = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
    return { lat: lat + dLatFinal, lng: lon + dLonFinal };
}

function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatTime(m){ return `${Math.floor(m/60).toString().padStart(2,'0')}:${(m%60).toString().padStart(2,'0')}`; }

function isNonVisitPoi(poiId){
    if(poiId==='county') return false;
    const poi = allPois.find(p=>p.id==poiId);
    if(!poi || !poi.category) return false;
    return poi.category.split(',').some(c=>NON_VISIT_CATEGORIES.includes(c.trim()));
}

function getUserId(){
    return anonymousUserId || (localStorage.getItem('vid') || (()=>{
        let uid='v_'+Date.now()+Math.random().toString(36);
        localStorage.setItem('vid',uid);
        return uid;
    })());
}

function getTodayStr(){ return new Date().toISOString().slice(0,10); }

// ==================== 天气获取 ====================
async function fetchWeatherForecast() {
    const now = Date.now();
    if (weatherCache && (now - weatherCache.time < 3600000)) {
        return weatherCache.data;
    }
    try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=31.911705&longitude=107.245033&daily=weathercode,temperature_2m_max,temperature_2m_min,windspeed_10m_max&timezone=Asia/Shanghai&forecast_days=16`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('天气API请求失败');
        const data = await response.json();
        if (!data.daily || !data.daily.time) throw new Error('天气数据格式异常');
        const codes = data.daily.weathercode || [];
        const tempsMax = data.daily.temperature_2m_max || [];
        const tempsMin = data.daily.temperature_2m_min || [];
        const winds = data.daily.windspeed_10m_max || [];
        const dates = data.daily.time || [];
        const codeMap = {
            0: '晴', 1: '晴', 2: '晴间多云', 3: '多云',
            45: '雾', 48: '雾',
            51: '小毛毛雨', 53: '毛毛雨', 55: '大毛毛雨',
            61: '小雨', 63: '中雨', 65: '大雨',
            71: '小雪', 73: '中雪', 75: '大雪',
            80: '阵雨', 81: '中阵雨', 82: '强阵雨',
            95: '雷暴', 96: '雷暴加冰雹', 99: '强雷暴加冰雹'
        };
        const forecast = dates.map((date, i) => ({
            date: date,
            weather: codeMap[codes[i]] || '未知天气',
            tempMax: tempsMax[i] !== undefined ? Math.round(tempsMax[i]) : '--',
            tempMin: tempsMin[i] !== undefined ? Math.round(tempsMin[i]) : '--',
            wind: winds[i] !== undefined ? Math.round(winds[i]) : '--'
        }));
        weatherCache = { time: Date.now(), data: forecast };
        return forecast;
    } catch (e) {
        console.warn('[天气] 获取失败:', e);
        return null;
    }
}

function getDayWeatherTip(weatherObj) {
    if (!weatherObj) return '⚠️ 天气信息获取失败，请自行关注天气变化。';
    const { weather, tempMax, tempMin, wind } = weatherObj;
    let tip = `🌤️ 天气：${weather}`;
    if (tempMin !== '--' && tempMax !== '--') tip += `，气温 ${tempMin}℃ ～ ${tempMax}℃`;
    else if (tempMax !== '--') tip += `，最高气温 ${tempMax}℃`;
    if (wind !== '--') tip += `，风力 ${wind} km/h`;
    if (weather.includes('雨') || weather.includes('雷') || weather.includes('雾')) tip += '，☔ 有降雨或大雾，建议携带雨具，注意出行安全。';
    else if (tempMax !== '--' && tempMax > 33) tip += '，☀️ 气温较高，注意防暑防晒，多补充水分。';
    else if (tempMax !== '--' && tempMax < 10) tip += '，🧥 气温较低，注意保暖。';
    else tip += '，🌿 天气适宜出行，祝您旅途愉快！';
    return tip;
}

// ==================== 语音引擎 ====================
function activateSpeech() {
    if ('speechSynthesis' in window) {
        speechSynthesis.getVoices();
        const silent = new SpeechSynthesisUtterance(' ');
        silent.volume = 0;
        silent.lang = 'zh-CN';
        speechSynthesis.speak(silent);
        setTimeout(() => speechSynthesis.cancel(), 100);
    }
}

function toggleAutoVoice() {
    voiceEnabled = !voiceEnabled;
    const btn = document.getElementById('voiceToggleBtn');
    if (voiceEnabled) {
        btn.textContent = '🔊';
        const testMsg = new SpeechSynthesisUtterance('语音已开启');
        testMsg.lang = 'zh-CN';
        speechSynthesis.speak(testMsg);
        if (currentGcjPos) checkVoiceTrigger(currentGcjPos.lat, currentGcjPos.lng);
    } else {
        btn.textContent = '🔇';
        speechSynthesis.cancel();
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        const closeMsg = new SpeechSynthesisUtterance('语音已关闭');
        closeMsg.lang = 'zh-CN';
        speechSynthesis.speak(closeMsg);
    }
}

function triggerVoice(poi) {
    if (!voiceEnabled) return;
    speechSynthesis.cancel();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (poi.voice_mp3) {
        const audio = new Audio(poi.voice_mp3);
        currentAudio = audio;
        audio.play().catch(() => playTTS(poi));
        return;
    }
    if (poi.voice_cn && poi.voice_cn.startsWith('http')) {
        const audio = new Audio(poi.voice_cn);
        currentAudio = audio;
        audio.play().catch(() => playTTS(poi));
        return;
    }
    playTTS(poi);
}

function playTTS(poi) {
    const lang = document.getElementById('langSelect')?.value || 'cn';
    let text = poi['voice_' + lang] || poi.voice_cn || poi.description || poi.name;
    if (text && text.startsWith('http')) text = poi.description || poi.name;
    if (!text) return;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = { cn:'zh-CN', en:'en-US', ja:'ja-JP', ko:'ko-KR' }[lang] || 'zh-CN';
    utterance.rate = 0.9;
    speechSynthesis.speak(utterance);
}

function checkVoiceTrigger(userLat, userLng) {
    if (!voiceEnabled || !allPois.length) return;
    const today = getTodayStr();
    const threshold = TRIGGER_RADIUS + GPS_ACCURACY_TOLERANCE;
    allPois.forEach(poi => {
        if (!poi.lat || !poi.lng) return;
        const dist = getDistance(userLat, userLng, poi.lat, poi.lng);
        if (dist <= threshold && lastTriggeredPoiIds[poi.id] !== today) {
            triggerVoice(poi);
            lastTriggeredPoiIds[poi.id] = today;
        }
    });
}

// ==================== 定位 ====================
function locateUser() {
    if (!navigator.geolocation) { alert('您的浏览器不支持定位'); return; }
    activateSpeech();
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const raw = { lat: position.coords.latitude, lng: position.coords.longitude };
            const gcj = wgs84ToGcj02(raw.lat, raw.lng);
            currentGcjPos = gcj;
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker([gcj.lat, gcj.lng], {
                icon: L.divIcon({
                    html: '<div style="background:#2196F3; width:20px; height:20px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px rgba(0,0,0,0.3);"></div>',
                    iconSize: [20,20]
                })
            }).addTo(map).bindPopup('我的位置').openPopup();
            map.setView([gcj.lat, gcj.lng], 15);
            startWatching();
            checkVoiceTrigger(gcj.lat, gcj.lng);
        },
        (error) => { console.warn('定位失败:', error.message); },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function startWatching() {
    if (!navigator.geolocation) return;
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(
        (pos) => {
            const raw = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            const gcj = wgs84ToGcj02(raw.lat, raw.lng);
            currentGcjPos = gcj;
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker([gcj.lat, gcj.lng], { icon: L.divIcon({ html: '<div style="background:#2196F3; width:20px; height:20px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px rgba(0,0,0,0.3);"></div>', iconSize: [20,20] }) }).addTo(map);
            checkVoiceTrigger(gcj.lat, gcj.lng);
        },
        (err) => { console.warn('定位监听错误', err); },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
}

function setSimulatedPosition(lat, lng) {
    currentGcjPos = { lat, lng };
    if (simMarker) map.removeLayer(simMarker);
    simMarker = L.marker([lat, lng], {
        icon: L.divIcon({

    }).addTo(map).bindPopup('模拟位置').openPopup();

}

    const { data } = await sb.from('ztj_transport_presets').select('*');
    transportPresets = {};

function getTransportTime(fromId, toId, mode) {
    if (fromId === 'mylocation' || toId === 'mylocation') {
        const fromPoi = fromId === 'mylocation' ? { lat: currentGcjPos?.lat || 0, lng: currentGcjPos?.lng || 0 } : allPois.find(p => p.id == fromId) || COUNTY;
        const toPoi = toId === 'mylocation' ? { lat: currentGcjPos?.lat || 0, lng: currentGcjPos?.lng || 0 } : allPois.find(p => p.id == toId) || COUNTY;
        if (!fromPoi || !toPoi) return null;
        const dist = getDistance(fromPoi.lat, fromPoi.lng, toPoi.lat, toPoi.lng);
        const speed = mode === 'auto' ? 40000 : (mode === 'bus' ? 20000 : 5000);
        return Math.round(dist / speed * 60);
    }
    const fId = fromId === 'county' ? 0 : fromId;
    const tId = toId === 'county' ? 0 : toId;
    let t = transportPresets[`${fId}_${tId}`];
    if (t !== undefined) return t;
    t = transportPresets[`${tId}_${fId}`];
    return t !== undefined ? t : null;
}

function renderPOIs(pois) {

function filterPOI(category) {

    clearTimeout(filterTimeoutId);
    filterTimeoutId = setTimeout(() => {
        document.getElementById('categoryBar').classList.remove('show');
        document.getElementById('catTrigger').style.display = 'block';
    }, 5000);

function applyFilter(category) {
    poiMarkers.forEach(marker => {
        const poi = marker.poiData;
        if (!poi) return;
        const cats = (poi.category||'').split(',').map(c => c.trim());
        const match = cats.some(c => c === category);
        if (match) {
            if (!marker._icon) map.addLayer(marker);
            marker.setIcon(L.divIcon({
                html: `<div style="background:${poiColors[category]||'#999'}; width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 12px rgba(0,0,0,0.5);"></div>`,
                iconSize: [30,30]
            }));
        } else {
            if (marker._icon) map.removeLayer(marker);
        }
    });
}

function clearFilter() {
    currentFilterCategory = null;
    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
    poiMarkers.forEach(marker => {
        if (!marker._icon) map.addLayer(marker);
        const poi = marker.poiData;
        if (poi) {

                iconSize: [20,20]
            }));

    });

    document.getElementById('catTrigger').style.display = 'block';
    clearTimeout(filterTimeoutId);
}

}

// ==================== 智能规划（核心修复） ====================
function classifySpot(spot) {
    const dur = spot.visitDuration || 0;
    if (dur > 300) return 'long';
    if (dur >= 100) return 'half';
    return 'short';
}

function getCountySpots() {
    const keywords = ['轿房沟美食街', '银耳博物馆', '红四方面军总指挥部旧址纪念馆', '省委党校旧址纪念馆', '通江花月夜'];
    return allPois.filter(p => {
        if (!p.name) return false;
        return keywords.some(kw => p.name.includes(kw));
    }).map(p => ({
        id: p.id,
        name: p.name,
        lat: p.lat,
        lng: p.lng,
        visitDuration: p.visit_duration || 90,
        isCounty: true
    }));
}

function fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, remaining, currentDate, orderedPois, mode) {
    let totalInserted = 0;
    let tryCount = 0;
    while (remaining > 0 && tryCount < 10) {
        tryCount++;
        let candidate = null;
        for (let c of availableCounty) {
            if (!usedCountyIds.has(c.id)) {
                candidate = c;
                break;
            }
        }
        if (!candidate) break;
        let travel = getTransportTime(lastPoi.id, candidate.id, mode);
        if (travel === null || travel === undefined) travel = 0;
        const needed = travel + candidate.visitDuration;
        if (needed <= remaining) {
            const countyNode = {
                id: candidate.id,
                name: candidate.name,
                lat: candidate.lat,
                lng: candidate.lng,
                visitDuration: candidate.visitDuration,
                transportTime: travel,
                isCounty: true
            };
            orderedPois.push(countyNode);
            lastPoi = countyNode;
            usedCountyIds.add(candidate.id);
            totalInserted += needed;
            remaining -= needed;
        } else {
            break;
        }
    }
    return { totalInserted, lastPoi };
}

// 核心规划函数
function smartSchedule(spots, startDate, startTime, mode) {
    const countySpots = getCountySpots();
    const usedCountyIds = new Set();
    const allSpotIds = new Set(spots.map(s => s.id));
    const availableCounty = countySpots.filter(c => !allSpotIds.has(c.id));

    const longSpots = spots.filter(s => s.visitDuration > 300);
    const halfSpots = spots.filter(s => s.visitDuration >= 100 && s.visitDuration <= 300);
    const shortSpots = spots.filter(s => s.visitDuration < 100);

    longSpots.sort((a,b) => b.visitDuration - a.visitDuration);
    halfSpots.sort((a,b) => b.visitDuration - a.visitDuration);
    shortSpots.sort((a,b) => b.visitDuration - a.visitDuration);

    const orderedPois = [];
    const startPoi = { id: 'county', name: '红军广场', lat: COUNTY.lat, lng: COUNTY.lng, visitDuration: 0, transportTime: 0 };
    orderedPois.push(startPoi);
    let lastPoi = startPoi;

    let currentDate = new Date(startDate);
    let currentMin = startTime;
    if (currentMin < DAY_START) currentMin = DAY_START;
    if (currentMin >= DAY_END) {
        currentDate.setDate(currentDate.getDate() + 1);
        currentMin = DAY_START;
    }

    // 1. 长耗时景区
    for (let spot of longSpots) {
        // 确保从08:00开始
        if (currentMin !== DAY_START) {
            let rem = DAY_END - currentMin;
            if (rem > 0) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
        }
        // 现在 currentMin == DAY_START
        let travelTime = getTransportTime(lastPoi.id, spot.id, mode);
        if (travelTime === null || travelTime === undefined) travelTime = 0;
        let totalNeeded = travelTime + spot.visitDuration;
        let remainingToday = DAY_END - currentMin;
        if (totalNeeded > remainingToday) {
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
            travelTime = getTransportTime(lastPoi.id, spot.id, mode);
            if (travelTime === null || travelTime === undefined) travelTime = 0;
            totalNeeded = travelTime + spot.visitDuration;
            let tryCount = 0;
            while (totalNeeded > DAY_END - currentMin && tryCount < 5) {
                currentDate.setDate(currentDate.getDate() + 1);
                currentMin = DAY_START;
                travelTime = getTransportTime(lastPoi.id, spot.id, mode);
                if (travelTime === null || travelTime === undefined) travelTime = 0;
                totalNeeded = travelTime + spot.visitDuration;
                tryCount++;
            }
        }
        const node = {
            id: spot.id,
            name: spot.name,
            lat: spot.lat,
            lng: spot.lng,
            visitDuration: spot.visitDuration,
            transportTime: travelTime,
            isCounty: false
        };
        orderedPois.push(node);
        lastPoi = node;
        currentMin = currentMin + travelTime + spot.visitDuration;
        if (currentMin > DAY_END) {
            currentMin = DAY_END;
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
        }
    }

    // 2. 半日景区
    let halfQueue = [...halfSpots];
    let attempts = 0;
    while (halfQueue.length > 0 && attempts < 100) {
        attempts++;
        let spot = halfQueue.shift();
        let travelTime = getTransportTime(lastPoi.id, spot.id, mode);
        if (travelTime === null || travelTime === undefined) travelTime = 0;
        let needed = travelTime + spot.visitDuration;

        if (currentMin >= DAY_END) {
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
        }
        if (currentMin < DAY_START) currentMin = DAY_START;
        if (currentMin >= DINNER_TRIGGER && currentMin < DAY_END) {
            let rem = DAY_END - currentMin;
            if (rem > 0) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            currentDate.setDate(currentDate.getDate() + 1);
            currentMin = DAY_START;
        }

        // 上午
        let morningStart = Math.max(currentMin, DAY_START);
        let morningEnd = LUNCH_TRIGGER;
        let morningAvailable = morningEnd - morningStart;
        if (needed <= morningAvailable && currentMin < LUNCH_TRIGGER) {
            const node = {
                id: spot.id,
                name: spot.name,
                lat: spot.lat,
                lng: spot.lng,
                visitDuration: spot.visitDuration,
                transportTime: travelTime,
                isCounty: false
            };
            orderedPois.push(node);
            lastPoi = node;
            currentMin = morningStart + needed;
            if (currentMin < morningEnd) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, morningEnd - currentMin, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            currentMin = LUNCH_END;
            continue;
        }

        if (currentMin < LUNCH_TRIGGER) {
            let rem = LUNCH_TRIGGER - currentMin;
            if (rem > 0) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            currentMin = LUNCH_END;
            travelTime = getTransportTime(lastPoi.id, spot.id, mode);
            if (travelTime === null || travelTime === undefined) travelTime = 0;
            needed = travelTime + spot.visitDuration;
        }

        // 下午
        let afternoonStart = Math.max(currentMin, LUNCH_END);
        let afternoonEnd = DINNER_TRIGGER;
        let afternoonAvailable = afternoonEnd - afternoonStart;
        if (needed <= afternoonAvailable && currentMin < DINNER_TRIGGER) {
            const node = {
                id: spot.id,
                name: spot.name,
                lat: spot.lat,
                lng: spot.lng,
                visitDuration: spot.visitDuration,
                transportTime: travelTime,
                isCounty: false
            };
            orderedPois.push(node);
            lastPoi = node;
            currentMin = afternoonStart + needed;
            if (currentMin < afternoonEnd) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, afternoonEnd - currentMin, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
            currentMin = DINNER_END;
            continue;
        }

        if (currentMin < DINNER_TRIGGER) {
            let rem = DINNER_TRIGGER - currentMin;
            if (rem > 0) {
                let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
                if (result.totalInserted > 0) {
                    lastPoi = result.lastPoi;
                    currentMin += result.totalInserted;
                }
            }
        }
        currentDate.setDate(currentDate.getDate() + 1);
        currentMin = DAY_START;
        if (attempts < 100) halfQueue.push(spot);
    }

    // 3. 短耗时和县城填充
    let fillers = [...shortSpots, ...availableCounty];
    fillers.sort((a,b) => b.visitDuration - a.visitDuration);
    for (let spot of fillers) {
        let travelTime = getTransportTime(lastPoi.id, spot.id, mode);
        if (travelTime === null || travelTime === undefined) travelTime = 0;
        let needed = travelTime + spot.visitDuration;
        let remaining = DAY_END - currentMin;
        if (needed <= remaining) {
            const node = {
                id: spot.id,
                name: spot.name,
                lat: spot.lat,
                lng: spot.lng,
                visitDuration: spot.visitDuration,
                transportTime: travelTime,
                isCounty: spot.isCounty || false
            };
            orderedPois.push(node);
            lastPoi = node;
            currentMin += needed;
        }
    }

    let rem = DAY_END - currentMin;
    if (rem > 0) {
        let result = fillCountySpots(availableCounty, usedCountyIds, lastPoi, currentMin, rem, currentDate, orderedPois, mode);
        if (result.totalInserted > 0) {
            lastPoi = result.lastPoi;
            currentMin += result.totalInserted;
        }
    }

    return orderedPois;
}

// ==================== 自设行程生成 ====================
async function generateCustomTrip() {
    const checkboxes = document.querySelectorAll('#dynamic-route input[type="checkbox"]:checked');
    const selectedIds = [];
    checkboxes.forEach(cb => {
        const id = cb.value;
        if (id && id !== 'county' && id !== 'mylocation') {
            selectedIds.push(id);
        }
    });
    if (selectedIds.length === 0) return alert('请至少选择一个景区');

    const dateStr = document.getElementById('trip-date').value;
    const startTime = getSelectedTime();
    if (!dateStr) return alert('选择出发日期');
    if (!startTime) return alert('选择出发时间');
    const now = new Date();
    if (new Date(dateStr + 'T' + startTime) < now) {
        alert('出发时间不能早于当前时间');
        return;
    }
    const mode = document.getElementById('trip-mode').value;
    const people = document.getElementById('trip-people').value;

    const userSpots = [];
    for (let id of selectedIds) {
        const poi = allPois.find(p => p.id == id);
        if (!poi) continue;
        userSpots.push({
            id: poi.id,
            name: poi.name,
            lat: poi.lat,
            lng: poi.lng,
            visitDuration: poi.visit_duration || 60
        });
    }

    const orderedPois = smartSchedule(userSpots, dateStr, parseInt(startTime.slice(0,2))*60 + parseInt(startTime.slice(3)), mode);
    const nodes = [];
    for (let i = 0; i < orderedPois.length; i++) {
        const p = orderedPois[i];
        const visitDur = (i === 0) ? 0 : p.visitDuration;
        const transportTime = (i === 0) ? 0 : p.transportTime;
        nodes.push({
            id: p.id,
            name: p.name,
            lat: p.lat,
            lng: p.lng,
            visitDuration: visitDur,
            transportTime: transportTime,
            isCounty: p.isCounty || false
        });
    }

    const { days, mealCount } = generateTimeline(nodes, dateStr, startTime);
    const weatherForecast = await fetchWeatherForecast();
    const daysWithWeather = days.map((d, i) => {
        let weatherTip = '⚠️ 天气信息暂不可用。';
        if (weatherForecast && i < weatherForecast.length) {
            weatherTip = getDayWeatherTip(weatherForecast[i]);
        }
        return { ...d, weatherTip };
    });

    let html = '';
    daysWithWeather.forEach((d, i) => {
        html += `<div class="day-header">📅 第${i+1}天 (${d.date})</div>`;
        d.lines.forEach(l => html += `<div class="trip-line">${l}</div>`);
        html += `<div class="trip-line" style="color:#0d47a1;">${d.weatherTip}</div>`;
    });

    let totalTransport = 0, totalVisit = 0;
    nodes.forEach(n => { totalTransport += n.transportTime || 0; totalVisit += n.visitDuration || 0; });
    let totalActivity = totalTransport + totalVisit;
    let tips = [];
    tips.push(`📊 活动总时长：${totalActivity}分钟（约${(totalActivity/60).toFixed(1)}小时），其中交通${totalTransport}分钟，游览${totalVisit}分钟。`);
    if (mealCount > 0) tips.push(`🍴 包含 ${mealCount} 次用餐，预计总耗时约 ${Math.round((totalActivity + mealCount*60)/60)} 小时。`);
    if (days.length > 1) tips.push(`🏨 行程跨${days.length}天，请合理安排住宿。`);
    if (days.length === 1 && (totalTransport > 120 || totalVisit > 240)) {
        tips.push(`💡 由于当日行程时间较长，建议您考虑将部分景点调整到第二天，或选择更近的景点。`);
    }

    generatedTripData = {
        name: '自设行程',
        date: dateStr,
        time: startTime,
        mode: mode,
        people: people,
        nodes: nodes.map(n => ({ id: n.id, name: n.name })),
        days: daysWithWeather,
        tips: tips
    };

    document.getElementById('generated-trip').innerHTML = `<div class="card">${html}</div>`;
    document.getElementById('trip-warnings').innerHTML = tips.length ? `<div class="warn-list"><strong>💡 温馨提示：</strong>${tips.map(t=>`<div>${t}</div>`).join('')}</div>` : '';
    document.getElementById('saveGeneratedTripBtn').classList.remove('hidden');
}

// ==================== 时间线生成 ====================
function generateTimeline(nodes, startDate, startTime) {
    let curDate = new Date(startDate);
    let [h, m] = startTime.split(':').map(Number);
    let curMin = h * 60 + m;
    const lines = [];
    let lunchDone = false, dinnerDone = false;
    if (curMin >= LUNCH_TRIGGER) lunchDone = true;
    if (curMin >= DINNER_TRIGGER) dinnerDone = true;
    let mealCount = 0;
    let currentVisitLeft = 0;

    function addLine(start, end, text, date) {
        if (text.startsWith('⏱️') && lines.length > 0) {
            const last = lines[lines.length - 1];
            if (last.text && last.text.startsWith('⏱️')) {
                const lastParts = last.text.split('游览 ');
                if (lastParts.length > 1) {
                    const lastSpot = lastParts[1].replace(/\(.*\)/, '').trim();
                    const curParts = text.split('游览 ');
                    if (curParts.length > 1) {
                        const curSpot = curParts[1].replace(/\(.*\)/, '').trim();
                        if (lastSpot === curSpot && last.end === start) {
                            const newEnd = end;
                            const newText = `⏱️ ${formatTime(last.start)}-${formatTime(newEnd)} 游览 ${lastSpot} (${newEnd - last.start}分钟)`;
                            lines[lines.length - 1] = { start: last.start, end: newEnd, text: newText, date: last.date };
                            return;
                        }
                    }
                }
            }
        }
        const dateCopy = new Date(date);
        lines.push({ start, end, text, date: dateCopy });
    }

    function tryInsertLunch() {
        if (!lunchDone && curMin >= LUNCH_TRIGGER) {
            if (currentVisitLeft > 0 && currentVisitLeft < 60) return false;
            const start = curMin;
            const end = curMin + MEAL_DURATION;
            addLine(start, end, `🍽️ 午餐时间 (${formatTime(start)}-${formatTime(end)})`, curDate);
            curMin = end;
            lunchDone = true;
            mealCount++;
            return true;
        }
        return false;
    }

    function tryInsertDinner() {
        if (!dinnerDone && curMin >= DINNER_TRIGGER) {
            if (currentVisitLeft > 0 && currentVisitLeft < 60) return false;
            const start = curMin;
            const end = curMin + MEAL_DURATION;
            addLine(start, end, `🍽️ 晚餐时间 (${formatTime(start)}-${formatTime(end)})`, curDate);
            curMin = end;
            dinnerDone = true;
            mealCount++;
            return true;
        }
        return false;
    }

    function ensureMealsForDay() {
        if (!lunchDone) {
            let t = Math.max(curMin, LUNCH_TRIGGER);
            const start = t;
            const end = t + MEAL_DURATION;
            addLine(start, end, `🍽️ 午餐时间 (${formatTime(start)}-${formatTime(end)})`, curDate);
            curMin = end;
            lunchDone = true;
            mealCount++;
        }
        if (!dinnerDone) {
            let t = Math.max(curMin, DINNER_TRIGGER);
            const start = t;
            const end = t + MEAL_DURATION;
            addLine(start, end, `🍽️ 晚餐时间 (${formatTime(start)}-${formatTime(end)})`, curDate);
            curMin = end;
            dinnerDone = true;
            mealCount++;
        }
    }

    function gotoNextDay() {
        if (curMin >= DAY_END) {
            if (currentVisitLeft > 0 && currentVisitLeft < 60) {
                let spend = currentVisitLeft;
                const start = curMin;
                const end = curMin + spend;
                addLine(start, end, `⏱️ ${formatTime(start)}-${formatTime(end)} 游览剩余 (${spend}分钟)`, curDate);
                curMin = end;
                currentVisitLeft = 0;
            }
            ensureMealsForDay();
            const start = DAY_END;
            const end = DAY_END;
            addLine(start, end, `🌙 当天行程结束，住宿休息`, curDate);
            curDate.setDate(curDate.getDate() + 1);
            curMin = DAY_START;
            lunchDone = false; dinnerDone = false;
            if (curMin >= LUNCH_TRIGGER) lunchDone = true;
            if (curMin >= DINNER_TRIGGER) dinnerDone = true;
        }
    }

    addLine(curMin, curMin, `🚩 ${formatTime(curMin)} 从 ${nodes[0].name} 出发`, curDate);

    for (let i = 1; i < nodes.length; i++) {
        const cur = nodes[i];
        let travelTime = cur.transportTime || 0;
        if (travelTime > 0) {
            if (curMin >= DAY_END) gotoNextDay();
            const start = curMin;
            curMin += travelTime;
            let daysPassed = Math.floor(curMin / 1440);
            if (daysPassed > 0) {
                curDate.setDate(curDate.getDate() + daysPassed);
                curMin = curMin % 1440;
                lunchDone = false; dinnerDone = false;
                if (curMin >= LUNCH_TRIGGER) lunchDone = true;
                if (curMin >= DINNER_TRIGGER) dinnerDone = true;
            }
            const end = curMin;
            addLine(start, end, `🚗 ${formatTime(start)}-${formatTime(end)} 前往 ${cur.name} (交通${travelTime}分钟)`, curDate);
        } else if (cur.transportTime === null) {
            addLine(curMin, curMin, `⚠️ 前往 ${cur.name} 交通耗时未知`, curDate);
        }

        if (cur.visitDuration > 0 && !isNonVisitPoi(cur.id)) {
            let visitLeft = cur.visitDuration;
            currentVisitLeft = visitLeft;
            while (visitLeft > 0) {
                if (curMin < DAY_START) curMin = DAY_START;
                if (curMin >= DAY_END) gotoNextDay();

                let lunchInserted = tryInsertLunch();
                let dinnerInserted = false;
                if (!lunchInserted) {
                    dinnerInserted = tryInsertDinner();
                }
                if (lunchInserted || dinnerInserted) {
                    continue;
                }

                if (visitLeft < 60) {
                    const start = curMin;
                    const spend = visitLeft;
                    const end = curMin + spend;
                    addLine(start, end, `⏱️ ${formatTime(start)}-${formatTime(end)} 游览 ${cur.name} (游览${cur.visitDuration}分钟)`, curDate);
                    curMin = end;
                    visitLeft = 0;
                    currentVisitLeft = 0;
                } else {
                    let nextBreak = DAY_END;
                    if (!lunchDone && curMin < LUNCH_TRIGGER) nextBreak = LUNCH_TRIGGER;
                    else if (!dinnerDone && curMin < DINNER_TRIGGER) nextBreak = DINNER_TRIGGER;
                    let timeToBreak = nextBreak - curMin;
                    if (timeToBreak <= 0) timeToBreak = 1;
                    const start = curMin;
                    const spend = Math.min(visitLeft, timeToBreak);
                    const end = curMin + spend;
                    addLine(start, end, `⏱️ ${formatTime(start)}-${formatTime(end)} 游览 ${cur.name} (游览${cur.visitDuration}分钟)`, curDate);
                    curMin = end;
                    visitLeft -= spend;
                    currentVisitLeft = visitLeft;
                }
            }
            if (curMin < DAY_END) {
                tryInsertLunch();
                tryInsertDinner();
            }
        } else if (isNonVisitPoi(cur.id)) {
            addLine(curMin, curMin, `📍 ${formatTime(curMin)} 到达 ${cur.name}`, curDate);
            if (curMin < DAY_END) {
                tryInsertLunch();
                tryInsertDinner();
            }
            if (curMin >= DAY_END) {
                ensureMealsForDay();
                const start = DAY_END;
                const end = DAY_END;
                addLine(start, end, `🌙 当天行程结束，住宿休息`, curDate);
                curDate.setDate(curDate.getDate() + 1);
                curMin = DAY_START;
                lunchDone = false; dinnerDone = false;
                if (curMin >= LUNCH_TRIGGER) lunchDone = true;
                if (curMin >= DINNER_TRIGGER) dinnerDone = true;
            }
        }
        if (curMin >= DAY_END) gotoNextDay();
    }

    if (curMin < DAY_END) {
        tryInsertLunch();
        tryInsertDinner();
    } else {
        ensureMealsForDay();
    }

    const daysMap = {};
    lines.forEach(l => {
        const key = l.date.toLocaleDateString('zh-CN');
        if (!daysMap[key]) daysMap[key] = [];
        daysMap[key].push(l.text);
    });
    const days = Object.keys(daysMap).map(date => ({ date, lines: daysMap[date] }));
    return { days, mealCount };
}

// ==================== 自设行程界面操作 ====================
function toggleCustomTripSection(){
    document.getElementById('customTripSection').classList.toggle('hidden');
    if(!document.getElementById('customTripSection').classList.contains('hidden')){
        buildMainPoiOptions();
        resetRouteLegs();
    }
}

function buildMainPoiOptions(){
    const allMain = allPois.filter(p => !p.parent_id);
    mainPoiOptions = allMain.filter(p => p.id !== 'county');
    if (currentGcjPos) mainPoiOptions.unshift({ id:'mylocation', name:'📍 我的位置', lat: currentGcjPos.lat, lng: currentGcjPos.lng });
    mainPoiOptions.unshift(COUNTY);
    // 只允许自然景区、红色景区、文博场馆
    const allowedLower = ALLOWED_CATEGORIES.map(c => c.toLowerCase());
    allowedPoiOptions = allMain.filter(p => {
        if(!p.category) return false;
        const cats = p.category.split(',').map(c => c.trim().toLowerCase());
        return cats.some(c => allowedLower.includes(c));
    });
    if(!allowedPoiOptions.some(p => p.id === 'county')) allowedPoiOptions.unshift(COUNTY);
}

function resetRouteLegs(){ routeLegs=[]; renderDynamicRoute(); }

function renderDynamicRoute(){
    const poiList = allowedPoiOptions.filter(p => p.id !== 'county' && p.id !== 'mylocation');
    let html = '';
    poiList.forEach(p => {
        const dur = p.visit_duration || 0;
        const checked = routeLegs.some(l => l.id === p.id) ? 'checked' : '';
        html += `<div style="margin:4px 0;"><label><input type="checkbox" value="${p.id}" ${checked} onchange="toggleSpot('${p.id}')"> ${p.name}（${dur}分钟）</label></div>`;
    });
    document.getElementById('dynamic-route').innerHTML = html || '<p>暂无可用景点</p>';
}

function toggleSpot(id) {
    const idx = routeLegs.findIndex(l => l.id === id);
    if (idx >= 0) routeLegs.splice(idx, 1);
    else {
        const poi = allPois.find(p => p.id == id);
        if (poi) routeLegs.push({ id: poi.id, name: poi.name, lat: poi.lat, lng: poi.lng });
    }
}

// ==================== 保存、我的行程等 ====================
function saveGeneratedTrip() {
    if(!generatedTripData) return;
    const name = prompt('行程名称', generatedTripData.name);
    if(!name) return;
    generatedTripData.name = name;
    const trips = JSON.parse(localStorage.getItem('trips')||'[]');
    trips.push(generatedTripData);
    localStorage.setItem('trips', JSON.stringify(trips));
    alert('行程已保存');
    document.getElementById('saveGeneratedTripBtn').classList.add('hidden');
    document.getElementById('generated-trip').innerHTML = '';
    generatedTripData = null;
    resetRouteLegs();
}

function renderMyTrip() {
    const trips = JSON.parse(localStorage.getItem('trips')||'[]');
    let html = '';
    trips.forEach((trip, i) => {
        html += `<div class="card"><div class="collapse-header" onclick="toggleTripDetail(${i})">📅 ${trip.name} | ${trip.date} ${trip.time}</div><div id="trip-detail-${i}" class="hidden">`;
        if(trip.days) trip.days.forEach(day => {
            html += `<div class="day-header">📅 ${day.date}</div>`;
            day.lines.forEach(l => html += `<div class="trip-line">${l}</div>`);
            if (day.weatherTip) {
                html += `<div class="trip-line" style="color:#0d47a1;">${day.weatherTip}</div>`;
            }
        });
        if(trip.tips) html += `<div class="warn-list">${trip.tips.map(t=>`<div>${t}</div>`).join('')}</div>`;
        html += `<button class="btn btn-danger" onclick="event.stopPropagation(); deleteTrip(${i})">删除</button></div></div>`;
    });
    document.getElementById('myTripContent').innerHTML = html || '<p>暂无保存的行程</p>';
}

window.toggleTripDetail = function(idx){ document.getElementById('trip-detail-'+idx).classList.toggle('hidden'); };

function deleteTrip(idx){
    const trips = JSON.parse(localStorage.getItem('trips')||'[]');
    trips.splice(idx,1);
    localStorage.setItem('trips', JSON.stringify(trips));
    renderMyTrip();
}

// ==================== 我的预约 & 反馈 ====================
async function loadMyReservations(){

    const merchantMap = {};

    let html = '';

                else if (p.startsWith('内容：')) content = p.replace('内容：', '');
            });
        }
        const merchantName = merchantMap[r.merchant_id] || '未知商户';
        html += `<div class="card">
            <div class="collapse-header" onclick="toggleMyReservationDetail(${idx})">
                <span>${r.reservation_date} | ${r.time_slot_start}-${r.time_slot_end||''} | ${merchantName} | ${category||'未分类'} | ${content||''} | 联系人：${r.name}</span>
            </div>
            <div id="my-res-detail-${idx}" class="hidden">
                <p><b>商户：</b>${merchantName}</p>
                <p><b>活动类别：</b>${category||'未指定'}</p>
                <p><b>预约内容：</b>${content||'未指定'}</p>
                <p><b>单位：</b>${r.unit||''} <b>人数：</b>${r.visitor_count}</p>
                <p><b>电话：</b>${r.phone}</p>
                <p><b>地点：</b>${r.room||''}</p>
                <p><b>状态：</b>${{pending:'预约中',confirmed:'已确认',rejected:'已拒绝'}[r.status]||r.status}</p>
            </div>
        </div>`;
    });
    document.getElementById('myReservationContent').innerHTML = html;
}

window.toggleMyReservationDetail = function(idx){ document.getElementById('my-res-detail-'+idx).classList.toggle('hidden'); };

async function submitFeedback(){
    const msg = document.getElementById('feedbackMsg').value;
    if(!msg) return;
    await sb.from('ztj_feedbacks').insert({ user_id: getUserId(), message: msg });
    document.getElementById('feedbackMsg').value = '';
    loadFeedbackHistory();
}

async function loadFeedbackHistory(){
    const { data } = await sb.from('ztj_feedbacks').select('*').neq('user_id','system').order('created_at',{ascending:false});
    let html = '';
    if (data) {
        data.forEach(f => {
            let replyHtml = '';
            if (f.reply) {
                replyHtml = `<div class="feedback-reply">🔔 管理员回复：${f.reply}</div>`;
            }
            html += `<div class="card">
                <div><b>${new Date(f.created_at).toLocaleString()}</b></div>
                <div>${f.message}</div>
                ${replyHtml}
            </div>`;
        });
    }
    document.getElementById('feedbackHistory').innerHTML = html || '<p>暂无留言</p>';
}

function switchMyTab(tab){
    document.getElementById('my-tab-trip').classList.remove('active');
    document.getElementById('my-tab-reservation').classList.remove('active');
    document.getElementById('my-tab-feedback').classList.remove('active');
    document.getElementById('myTripContent').classList.add('hidden');
    document.getElementById('myReservationContent').classList.add('hidden');
    document.getElementById('myFeedbackContent').classList.add('hidden');
    if(tab==='trip'){ document.getElementById('my-tab-trip').classList.add('active'); document.getElementById('myTripContent').classList.remove('hidden'); renderMyTrip(); }
    else if(tab==='reservation'){ document.getElementById('my-tab-reservation').classList.add('active'); document.getElementById('myReservationContent').classList.remove('hidden'); loadMyReservations(); }
    else { document.getElementById('my-tab-feedback').classList.add('active'); document.getElementById('myFeedbackContent').classList.remove('hidden'); loadFeedbackHistory(); }
}

function openPanel(id){ document.getElementById(id).classList.add('active'); if(id==='routesPanel') loadRoutes(); }
function closePanel(id){ document.getElementById(id).classList.remove('active'); }
function startSimulation(){ alert('模拟导航功能即将上线'); }

// ==================== 启动 ====================
window.onload = function() {
    initMap();
    console.log('[系统] 智游通江已启动。');
};
</script>
