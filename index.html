<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智游通江 - 智能行程规划</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; background: #f0f2f5; }
        .hidden { display: none !important; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .top-bar { position: fixed; top: max(12px, env(safe-area-inset-top, 12px)); left: 50%; transform: translateX(-50%); z-index: 1700; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.92); padding: 6px 16px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); backdrop-filter: blur(8px); height: 44px; cursor: pointer; white-space: nowrap; }
        .top-bar .brand { font-weight: 700; color: #1b5e20; font-size: 18px; display: flex; align-items: center; gap: 6px; }
        .category-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1600; background: rgba(255,255,255,0.98); box-shadow: 0 4px 20px rgba(0,0,0,0.1); transform: translateY(-100%); transition: transform 0.4s; display: flex; flex-wrap: wrap; padding: 12px 16px; gap: 8px; border-bottom: 1px solid #e8f5e9; pointer-events: none; max-height: 70vh; overflow-y: auto; padding-top: calc(60px + env(safe-area-inset-top, 12px)); }
        .category-bar.show { transform: translateY(0); pointer-events: auto; }
        .category-bar .cat-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #e0e0e0; background: white; font-size: 13px; cursor: pointer; color: #333; }
        .bottom-nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1500; display: flex; gap: 6px; background: rgba(255,255,255,0.95); padding: 8px 16px; border-radius: 40px; box-shadow: 0 4px 24px rgba(0,0,0,0.18); align-items: center; max-width: 95%; }
        .bottom-nav .nav-btn { padding: 8px 16px; border: none; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; background: transparent; color: #555; white-space: nowrap; }
        .bottom-nav .nav-btn.primary { background: #1b5e20; color: white; }
        .float-btn { position: fixed; z-index: 1500; background: white; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.25); cursor: pointer; font-size: 20px; border: none; }
        .locate-btn { bottom: 110px; right: 20px; }
        .voice-btn { bottom: 170px; right: 20px; }
        .panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 2000; transform: translateY(100%); transition: transform 0.35s; overflow-y: auto; display: flex; flex-direction: column; }
        .panel.active { transform: translateY(0); }
        .panel-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; position: sticky; top: 0; z-index: 10; min-height: 64px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
        .panel-header h2 { font-size: 18px; font-weight: 700; margin: 0; color: #1b5e20; }
        .panel-header .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; padding: 4px 8px; border-radius: 8px; }
        .panel-body { flex: 1; padding: 16px 20px; overflow-y: auto; padding-bottom: 30px; }
        .card-modern { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
        .card-modern .card-title { font-weight: 600; font-size: 16px; margin-bottom: 6px; color: #1b5e20; }
        .card-modern .card-sub { font-size: 13px; color: #888; }
        .trip-day-container { background: white; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; border-left: 5px solid #1b5e20; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .trip-day-title { font-weight: 700; font-size: 17px; color: #1b5e20; margin-bottom: 12px; border-bottom: 2px solid #e8f5e9; padding-bottom: 8px; }
        .trip-timeline { position: relative; padding-left: 24px; }
        .trip-timeline::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 3px; background: #e0e0e0; border-radius: 2px; }
        .trip-node { position: relative; padding: 6px 0 6px 16px; margin-bottom: 2px; display: flex; align-items: flex-start; gap: 12px; }
        .trip-node::before { content: ''; position: absolute; left: -18px; top: 12px; width: 12px; height: 12px; border-radius: 50%; border: 3px solid #1b5e20; background: white; }
        .trip-node .node-time { min-width: 110px; font-weight: 500; color: #333; font-size: 14px; font-family: monospace; flex-shrink: 0; }
        .trip-node .node-icon { width: 28px; text-align: center; flex-shrink: 0; font-size: 16px; }
        .trip-node .node-content { flex: 1; font-size: 14px; color: #333; padding: 2px 0; line-height: 1.5; }
        .trip-node .node-content .node-duration { color: #666; font-size: 12px; background: #f0f0f0; padding: 1px 8px; border-radius: 12px; margin-left: 6px; }
        .trip-node.type-transport::before { border-color: #1565C0; background: #1565C0; }
        .trip-node.type-visit::before { border-color: #2E7D32; background: #2E7D32; }
        .trip-node.type-meal::before { border-color: #E65100; background: #E65100; }
        .trip-node.type-accommodation::before { border-color: #6A1B9A; background: #6A1B9A; }
        .trip-node.type-weather::before { border-color: #00BCD4; background: #00BCD4; }
        .trip-node.type-reminder::before { border-color: #C62828; background: #C62828; }
        .trip-node.type-trip_end::before { border-color: #2E7D32; background: #2E7D32; }
        .trip-node .icon-transport { color: #1565C0; }
        .trip-node .icon-visit { color: #2E7D32; }
        .trip-node .icon-meal { color: #E65100; }
        .trip-node .icon-trip_end { color: #2E7D32; }
        .trip-node .weather-text { color: #0D47A1; font-weight: 500; }
        .trip-node .reminder-text { color: #C62828; font-weight: 500; background: #ffebee; padding: 2px 10px; border-radius: 12px; }
        .trip-node .trip-end-text { color: #2E7D32; font-weight: 700; font-size: 15px; }
        .poi-category-group { margin-bottom: 12px; }
        .poi-category-title { font-weight: 600; color: #1b5e20; background: #e8f5e9; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
        .poi-category-content { padding-left: 12px; margin-top: 4px; }
        .poi-item { padding: 4px 0; border-bottom: 1px solid #f5f5f5; }
        .poi-item .poi-name { display: flex; align-items: center; gap: 8px; }
        .poi-item .poi-duration-badge { font-size: 12px; color: #888; margin-left: 8px; }
        .total-duration { font-weight: 600; color: #1b5e20; background: #e8f5e9; padding: 6px 12px; border-radius: 6px; text-align: center; margin-top: 10px; }
        .poi-select-list { max-height: 400px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; padding: 8px; }
        .reservation-form { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-top: 10px; }
        .reservation-form .form-group { margin-bottom: 8px; }
        .reservation-form label { font-weight: 500; font-size: 14px; }
        .reservation-form input, .reservation-form select, .reservation-form textarea { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .biz-image-box { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #f0f0f0; margin-top: 8px; }
        .biz-image-box img { width: 100%; height: 100%; object-fit: cover; }
        .route-filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .route-filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #e0e0e0; background: white; font-size: 13px; cursor: pointer; color: #555; }
        .route-filter-btn.active { background: #1b5e20; color: white; border-color: #1b5e20; }
        .route-list-card { border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: white; }
        .route-list-card .route-type-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .route-type-scenic_internal { background: #e3f2fd; color: #1565c0; }
        .route-type-city_day { background: #fff3e0; color: #e65100; }
        .route-type-area_multi { background: #f3e5f5; color: #6a1b9a; }
        .route-type-custom { background: #e8eaf6; color: #283593; }
        .route-list-card .theme-tag-badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px; background: #e8f5e9; color: #1b5e20; margin-right: 2px; }
        .route-list-card .route-name { font-weight: 700; color: #1b5e20; font-size: 16px; margin: 4px 0 6px; }
        .route-list-card .route-summary { color: #555; font-size: 13px; margin: 4px 0; }
        .route-list-card .route-pois { color: #666; font-size: 12px; margin: 4px 0; }
        .route-list-card .route-meta { color: #888; font-size: 13px; margin-bottom: 8px; }
        .route-list-card .route-actions { display: flex; gap: 8px; margin-top: 8px; }
        .route-list-card .btn-detail { background: transparent; color: #1b5e20; border: 1px solid #1b5e20; padding: 6px 14px; border-radius: 6px; cursor: pointer; flex: 1; }
        .route-list-card .btn-adopt { background: #1b5e20; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; flex: 1; }
        .arrival-time-bar { background: #f0f8f0; border-bottom: 1px solid #e0e0e0; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .arrival-time-bar label { font-weight: 600; color: #1b5e20; font-size: 14px; margin: 0; }
        .arrival-time-bar select { padding: 6px 12px; border: 1px solid #1b5e20; border-radius: 6px; background: white; }
        .node-section { padding: 12px 16px; }
        .node-section-title { font-weight: 600; color: #1b5e20; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .node-section-title .count { color: #888; font-weight: 400; font-size: 12px; }
        .timeline-node { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
        .timeline-node.type-visit { background: #f0f8f0; }
        .timeline-node.type-transport { background: #f0f7ff; font-size: 13px; color: #1565C0; }
        .timeline-node.type-meal { background: #fff8e1; font-size: 13px; color: #e65100; }
        .timeline-node .node-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
        .timeline-node .node-main { flex: 1; }
        .timeline-node .node-main .node-name { font-weight: 500; color: #333; font-size: 14px; }
        .timeline-node.type-transport .node-main .node-name,
        .timeline-node.type-meal .node-main .node-name { color: inherit; font-weight: 400; font-size: 13px; }
        .timeline-node .node-time { color: #1b5e20; font-weight: 600; font-size: 12px; flex-shrink: 0; font-family: monospace; }
        .timeline-node.type-transport .node-time,
        .timeline-node.type-meal .node-time { color: inherit; }
        .timeline-node .node-desc { color: #555; font-size: 12px; margin-top: 2px; }
        .timeline-node .node-tips { color: #f57f17; font-size: 12px; margin-top: 2px; }
        .timeline-node .node-remove { color: #c62828; cursor: pointer; font-size: 14px; flex-shrink: 0; padding: 2px 6px; }
        .selectable-node { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .selectable-node input[type="checkbox"] { margin-top: 3px; cursor: pointer; width: 18px; height: 18px; flex-shrink: 0; }
        .selectable-node .node-info { flex: 1; }
        .selectable-node .node-title { font-weight: 500; color: #333; font-size: 14px; }
        .selectable-node .node-desc { color: #555; font-size: 12px; margin-top: 2px; }
        .selectable-node .node-time { color: #1b5e20; font-weight: 600; font-size: 13px; flex-shrink: 0; }
        .status-bar { background: #f8f9fa; border-top: 2px solid #e0e0e0; padding: 12px 16px; flex-shrink: 0; }
        .status-bar.ok { border-top-color: #4caf50; background: #f0f8f0; }
        .status-bar.warning { border-top-color: #ff9800; background: #fff8e1; }
        .status-bar.danger { border-top-color: #f44336; background: #ffebee; }
        .status-bar .status-row { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 4px; }
        .status-bar .status-msg { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        .status-bar.ok .status-msg { color: #2e7d32; }
        .status-bar.warning .status-msg { color: #e65100; }
        .status-bar.danger .status-msg { color: #c62828; }
        .status-bar .status-actions { display: flex; gap: 8px; margin-top: 8px; }
        .status-bar .btn-reset { flex: 1; background: white; color: #555; border: 1px solid #ccc; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .status-bar .btn-adopt-final { flex: 2; background: #1b5e20; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .status-bar .btn-adopt-final:disabled { background: #ccc; cursor: not-allowed; }
        .alert-modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 3000; display: flex; align-items: center; justify-content: center; }
        .alert-modal { background: white; border-radius: 14px; padding: 20px; max-width: 340px; width: 88%; }
        .alert-modal h6 { color: #c62828; font-weight: 700; margin-bottom: 10px; }
        .alert-modal p { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
        .alert-modal .btn-row { display: flex; gap: 8px; }
        .alert-modal .btn-row button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; }
        .alert-modal .btn-row .btn-ok { background: #1b5e20; color: white; }
        .nav-to-poi-btn { background: #1b5e20; color: white; border: none; padding: 5px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; }
        .nav-to-poi-btn:hover { background: #2e7d32; }
        .text-green { color: #1b5e20; }
        .btn-primary-custom { background: #1b5e20; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-outline-custom { background: transparent; color: #1b5e20; border: 2px solid #1b5e20; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-warning-custom { background: #ff9800; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .order-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #f0f0f0; }
        .order-item .order-actions button { padding: 2px 8px; font-size: 12px; margin-left: 4px; }
        .required-mark { color: #c62828; }
        .merchant-status-row { display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #555; }
        .merchant-status-row span { display: inline-flex; align-items: center; gap: 4px; }
        .merchant-notice { background: #fff8e1; border-left: 4px solid #ff9800; border-radius: 8px; padding: 12px 14px; margin-top: 16px; }
        .merchant-notice h6 { color: #e65100; margin: 0 0 8px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
        .merchant-notice p { color: #555; font-size: 14px; line-height: 1.6; margin: 0; white-space: pre-wrap; word-break: break-word; }
        /* 智能规划列表：景区分组 */
        .scenic-group { margin-bottom: 14px; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; background: white; }
        .scenic-group-title { background: #f0f8f0; color: #1b5e20; padding: 8px 12px; font-weight: 600; font-size: 14px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 6px; }
        .scenic-group-list { padding: 4px 0; }
        .scenic-group-list .poi-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
        .scenic-group-list .poi-row:last-child { border-bottom: none; }
        .scenic-group-list .poi-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
        .scenic-group-list .poi-row .poi-name { flex: 1; color: #333; }
        .scenic-group-list .poi-row .poi-dur { color: #888; font-size: 12px; }
        .scenic-group-list .poi-row.node-only { background: #fffde7; padding-left: 30px; font-size: 13px; color: #666; }
        .independent-group { margin-bottom: 14px; }
        .independent-group .poi-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f5f5f5; font-size: 14px; background: white; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 4px; }
        .independent-group .poi-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
        .independent-group .poi-row .poi-name { flex: 1; color: #333; }
        .independent-group .poi-row .poi-dur { color: #888; font-size: 12px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar" id="topBar">
    <span class="brand" id="brandToggle"><i class="fas fa-leaf"></i> 智游通江</span>
</div>

<div class="category-bar" id="categoryBar">
    <button class="cat-btn" onclick="window.filterPOI('自然景区')">🏔️ 自然景区</button>
    <button class="cat-btn" onclick="window.filterPOI('红色景区')">🔴 红色景区</button>
    <button class="cat-btn" onclick="window.filterPOI('文博场馆')">🏛️ 文博场馆</button>
    <button class="cat-btn" onclick="window.filterPOI('餐饮住宿')">🍽️ 餐饮住宿</button>
    <button class="cat-btn" onclick="window.filterPOI('交通枢纽')">🚌 交通枢纽</button>
    <button class="cat-btn" onclick="window.filterPOI('游玩娱乐')">🎢 游玩娱乐</button>
    <button class="cat-btn" onclick="window.filterPOI('购物消费')">🛍️ 购物消费</button>
    <button class="cat-btn" onclick="window.filterPOI('公共服务')">🏛️ 公共服务</button>
    <button class="cat-btn" onclick="window.clearFilter()">✕ 清除筛选</button>
</div>

<div class="bottom-nav" id="bottomNav">
    <button class="nav-btn primary" onclick="window.openPanel('planPanel')"><i class="fas fa-wand-magic-sparkles"></i> 智能规划</button>
    <button class="nav-btn" onclick="window.openPanel('routePanel')"><i class="fas fa-route"></i> 推荐路线</button>
    <button class="nav-btn" onclick="window.openPanel('myPanel')"><i class="fas fa-user"></i> 我的</button>
</div>

<button class="float-btn locate-btn" onclick="window.locateUser()"><i class="fas fa-crosshairs"></i></button>
<button class="float-btn voice-btn" id="voiceToggleBtn" onclick="window.toggleVoice()"><i class="fas fa-volume-high"></i></button>

<!-- 智能规划面板 -->
<div class="panel" id="planPanel">
    <div class="panel-header">
        <h2><i class="fas fa-route text-green"></i> 智能行程规划</h2>
        <button class="close-btn" onclick="window.closePanel('planPanel')">&times;</button>
    </div>
    <div class="panel-body">
        <div id="stepPreferences">
            <div class="row g-2 mt-2">
                <div class="col-6"><label class="form-label fw-semibold">出发日期</label><input type="date" id="planStartDate" class="form-control" /></div>
                <div class="col-6"><label class="form-label fw-semibold">出发时间</label><select id="planStartTime" class="form-select"></select></div>
                <div class="col-6">
                    <label class="form-label fw-semibold">出发地点</label>
                    <select id="planStartLocation" class="form-select"><option value="county">红军广场（县城）</option></select>
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold">住宿地点</label>
                    <select id="planLodging" class="form-select">
                        <option value="all" selected>全部（智能决定）</option>
                        <option value="county">县城（每天返回县城）</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">行程风格</label>
                    <select id="planStyle" class="form-select">
                        <option value="compact">🚀 紧凑型</option>
                        <option value="relaxed" selected>🌿 舒适型</option>
                        <option value="indepth">🔍 深度游</option>
                    </select>
                </div>
            </div>
            <div class="mt-2">
                <label class="form-label fw-semibold">选择景点</label>
                <div id="poiSelectContainer" class="poi-select-list">
                    <div class="text-secondary text-center py-2">加载景点中...</div>
                </div>
                <div class="total-duration" id="selectedDurationDisplay">已选景点总游览时长：0 分钟</div>

<script type="module">
import {
    getPois, getMerchantsByPoi, getTransportPresets,
    insertReservation, insertFeedback,
    getReservationsByDevice, getFeedbacksByDevice,
    deleteReservation, deleteFeedback,
    getRoutes, getRouteNodes
} from './js/api.js';
import { initMap, loadPoisToMap, locateUser, setVoiceEnabled, clearFilter, applyFilter } from './js/map.js';
import { generateTripPlan } from './js/trip-planner.js';
import { startNavigation, endNavigation } from './js/trip-executor.js';

function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        localStorage.setItem('deviceId', id);
    }
    return id;
}
const DEVICE_ID = getDeviceId();

function getLocalData(key) {
    try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
}
function setLocalData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

const CACHE_TTL = 5 * 60 * 1000;
const CACHE_PREFIX = 'ztj_cache_';
function getCache(key) {
    try {
        const raw = localStorage.getItem(CACHE_PREFIX + key);
        if (!raw) return null;
        const { data, ts } = JSON.parse(raw);
        if (Date.now() - ts > CACHE_TTL) return null;
        return data;
    } catch { return null; }
}
function setCache(key, data) {
    try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ data, ts: Date.now() })); } catch {}
}
async function getPoisCached() {
    const cached = getCache('pois');
    if (cached) return cached;
    const data = await getPois();
    setCache('pois', data);
    return data;
}
async function getTransportPresetsCached() {
    const cached = getCache('transport');
    if (cached) return cached;
    const data = await getTransportPresets();
    setCache('transport', data);
    return data;
}

const STATUS_MAP = { pending: '待确认', confirmed: '已确认', rejected: '已拒绝', cancelled: '已取消' };
function translateStatus(s) { return STATUS_MAP[s] || s || '未知'; }

const ROUTE_TYPE_LABELS = {
    scenic_internal: '🏞️ 景区内部', city_day: '🏙️ 城市一日游',
    area_multi: '🗺️ 区域联合', custom: '✨ 自定义'
};
const DAY_CATEGORY_LABELS = { half_day: '🌤️ 半日游', one_day: '☀️ 一日游', multi_day: '📅 多日游' };
const NODE_TYPE_ICONS = {
    entrance: '🚪', parking: '🅿️', rest: '☕', core_view: '⭐',
    spot: '📍', entertainment: '🎢', wc: '🚻', exit: '🚪', other: '📌'
};

// 就餐时间窗口（统一 11:30-12:30 / 18:00-19:00）
const LUNCH_START = 11 * 60 + 30;
const LUNCH_END = 12 * 60 + 30;
const DINNER_START = 18 * 60;
const DINNER_END = 19 * 60;
const VISIT_END = 18 * 60;
const MEAL_DURATION = 60;
const COUNTY_ID = 0;

let allPois = [];
let allPoisMap = {};
let currentTripData = null;
let selectedPoiIds = new Set();
let selectedPoiOrder = [];
let allRoutesCache = [];
let allRouteNodesCache = {};
let currentRouteFilter = 'all';
let currentDetailRoute = null;
let currentDetailNodes = [];
let currentSelectedNodeIndices = new Set();
let currentArrivalTime = 10 * 60;
let transportPresetsCache = {};
let currentDetailPoi = null;

function fmtTime(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}
function timeStrToMinutes(str) {
    const [h, m] = str.split(':').map(Number);
    return h * 60 + m;
}

function calcTravelBetween(prevPoiId, curPoiId) {
    if (!prevPoiId || !curPoiId) return 0;
    if (String(prevPoiId) === String(curPoiId)) return 0;
    if (String(prevPoiId) === 'county' || prevPoiId === COUNTY_ID) {
        return transportPresetsCache[`${COUNTY_ID}_${curPoiId}`] || transportPresetsCache[`county_${curPoiId}`] || 0;
    }
    if (String(curPoiId) === 'county' || curPoiId === COUNTY_ID) {
        return transportPresetsCache[`${prevPoiId}_${COUNTY_ID}`] || transportPresetsCache[`${prevPoiId}_county`] || 0;
    }
    const prevPoi = allPoisMap[String(prevPoiId)];
    const curPoi = allPoisMap[String(curPoiId)];
    if (prevPoi && curPoi && prevPoi.parent_id && curPoi.parent_id
        && String(prevPoi.parent_id) === String(curPoi.parent_id)) {
        return 0;
    }
    return transportPresetsCache[`${prevPoiId}_${curPoiId}`] || 0;
}

function initTimeSelectors() {
    const sel = document.getElementById('planStartTime');
    if (!sel) return;
    sel.innerHTML = '';
    for (let h = 6; h < 24; h++) {
        for (let m = 0; m < 60; m += 10) {
            const val = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            sel.innerHTML += `<option value="${val}">${val}</option>`;
        }
    }
    setDefaultStartTime();
}
function setDefaultStartTime() {
    const now = new Date();
    now.setMinutes(now.getMinutes() + 10);
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const timeStr = h + ':' + m;
    const sel = document.getElementById('planStartTime');
    if (sel) {
        let exists = false;
        for (let opt of sel.options) if (opt.value === timeStr) { exists = true; break; }
        if (!exists) {
            const opt = document.createElement('option');
            opt.value = timeStr; opt.textContent = timeStr;
            sel.appendChild(opt);
        }
        sel.value = timeStr;
    }
    const dateInput = document.getElementById('planStartDate');
    if (dateInput) dateInput.value = now.toISOString().slice(0, 10);
}

// ★ 出发地点 + 住宿地点：加入 L1 景区、住宿类 POI
function initStartLocationSelect(pois) {
    const startSel = document.getElementById('planStartLocation');
    const lodgingSel = document.getElementById('planLodging');
    if (!startSel || !lodgingSel) return;

    // 出发地点
    startSel.innerHTML = '<option value="county">红军广场（县城）</option>';
    const l1List = pois.filter(p => p.data_level === 'L1' && !p.parent_id);
    l1List.forEach(p => {
        startSel.innerHTML += `<option value="${p.id}">🏞️ ${p.name}</option>`;
    });

    // 住宿地点：先重置
    lodgingSel.innerHTML = `
        <option value="all" selected>全部（智能决定）</option>
        <option value="county">县城（每天返回县城）</option>
    `;

    // 找出住宿类 POI：
    // 1. category 含"住宿"
    // 2. facility_subtype 含 hotel
    // 3. L4 且 business_type 含 hotel（若可用）
    const lodgingPois = pois.filter(p => {
        if (p.category && p.category.includes('住宿')) return true;
        if (Array.isArray(p.facility_subtype) && p.facility_subtype.includes('hotel')) return true;
        if (typeof p.facility_subtype === 'string' && p.facility_subtype === 'hotel') return true;
        return false;
    });
    lodgingPois.forEach(p => {
        lodgingSel.innerHTML += `<option value="${p.id}">🏨 ${p.name}</option>`;
    });
}

// ============================================================
// 智能规划 POI 列表
// 规则：
//  - L1 容器作分组标题（不可勾选）
//  - L1 下所有 L2/L3/L4 平铺显示，可勾选
//  - L3 内部 core_node 展开显示，仅展示（灰色，不可勾选）
//  - 独立 L2/L3/L4（无父级）显示在"独立景点/服务"分组下
// ============================================================
function renderPoiSelection(pois) {
    const container = document.getElementById('poiSelectContainer');
    if (!container) return;
    if (!pois || pois.length === 0) {
        container.innerHTML = '<div class="text-secondary text-center py-2">暂无景点数据</div>';
        return;
    }

    // L1 容器
    const l1List = pois.filter(p => p.data_level === 'L1' && !p.parent_id);
    // 独立 L2/L3/L4（无父级且非 L1）
    const independent = pois.filter(p =>
        !p.parent_id && (p.data_level === 'L2' || p.data_level === 'L3' || p.data_level === 'L4')
    );

    let html = '';

    // 逐个 L1 容器渲染
    l1List.forEach(l1 => {
        // L1 下的直接子项：L2 / L3 / L4
        const children = pois.filter(p => String(p.parent_id) === String(l1.id)
            && (p.data_level === 'L2' || p.data_level === 'L3' || p.data_level === 'L4'));
        if (children.length === 0) return;

        html += `<div class="scenic-group">`;
        html += `<div class="scenic-group-title">🏞️ ${l1.name}</div>`;
        html += `<div class="scenic-group-list">`;
        children.forEach(child => {
            const cidStr = String(child.id);
            const isChecked = selectedPoiIds.has(cidStr);
            const dur = child.visit_duration || 0;
            const lvTag = child.data_level === 'L3' ? ' ⭐' : (child.data_level === 'L4' ? ' 🏛️' : '');
            html += `<div class="poi-row">
                <input type="checkbox" ${isChecked ? 'checked' : ''}
                       onclick="event.stopPropagation(); window.togglePoiSelection('${child.id}')">
                <span class="poi-name">${child.name}${lvTag}</span>
                <span class="poi-dur">${dur}分钟</span>
            </div>`;

            // 若为 L3，展开显示内部节点（仅展示）
            if (child.data_level === 'L3') {
                const innerNodes = pois.filter(x => String(x.parent_id) === String(child.id));
                innerNodes.forEach(n => {
                    html += `<div class="poi-row node-only">
                        <span style="margin-right:6px;">⭐</span>
                        <span class="poi-name">${n.name}</span>
                        <span class="poi-dur">${n.visit_duration || 0}分钟</span>
                    </div>`;
                });
            }
        });
        html += `</div></div>`;
    });

    // 独立 L2/L3/L4
    if (independent.length > 0) {
        html += `<div class="independent-group">`;
        html += `<div class="scenic-group-title" style="background:#e8f5e9;border-radius:8px;margin-bottom:6px;">📍 独立景点 / 服务设施</div>`;
        independent.forEach(p => {
            const pidStr = String(p.id);
            const isChecked = selectedPoiIds.has(pidStr);
            const dur = p.visit_duration || 0;
            const lvTag = p.data_level === 'L3' ? ' ⭐' : (p.data_level === 'L4' ? ' 🏛️' : '');
            html += `<div class="poi-row">
                <input type="checkbox" ${isChecked ? 'checked' : ''}
                       onclick="event.stopPropagation(); window.togglePoiSelection('${p.id}')">
                <span class="poi-name">${p.name}${lvTag}</span>
                <span class="poi-dur">${dur}分钟</span>
            </div>`;
            // L3 展开
            if (p.data_level === 'L3') {
                const innerNodes = pois.filter(x => String(x.parent_id) === String(p.id));
                innerNodes.forEach(n => {
                    html += `<div class="poi-row node-only">
                        <span style="margin-right:6px;">⭐</span>
                        <span class="poi-name">${n.name}</span>
                        <span class="poi-dur">${n.visit_duration || 0}分钟</span>
                    </div>`;
                });
            }
        });
        html += `</div>`;
    }

    container.innerHTML = html || '<div class="text-secondary text-center py-2">暂无可勾选景点</div>';
    updateSelectedInfo();
}

window.togglePoiSelection = function(poiId) {
    const idStr = String(poiId);
    const poi = allPoisMap[idStr];
    if (!poi) return;
    if (selectedPoiIds.has(idStr)) {
        selectedPoiIds.delete(idStr);
        selectedPoiOrder = selectedPoiOrder.filter(x => x !== idStr);
    } else {
        selectedPoiIds.add(idStr);
        if (!selectedPoiOrder.includes(idStr)) selectedPoiOrder.push(idStr);
    }
    renderPoiSelection(allPois);
    renderSelectedOrder();
    updateSelectedInfo();
};

window.selectAllPois = function(select) {
    if (select) {
        allPois.forEach(poi => {
            // 只勾选 L2 / L3（L4 不参与规划）
            if (poi.data_level === 'L2' || poi.data_level === 'L3') {
                const idStr = String(poi.id);
                selectedPoiIds.add(idStr);
                if (!selectedPoiOrder.includes(idStr)) selectedPoiOrder.push(idStr);
            }
        });
    } else {
        selectedPoiIds.clear();
        selectedPoiOrder = [];
    }
    renderPoiSelection(allPois);
    renderSelectedOrder();
    updateSelectedInfo();
};

function updateSelectedInfo() {
    const total = selectedPoiIds.size;
    document.getElementById('selectedPoiCount').textContent = `已选 ${total} 个`;
    let totalDuration = 0;
    selectedPoiIds.forEach(id => {
        const poi = allPoisMap[id];
        if (poi) totalDuration += poi.visit_duration || 0;
    });

window.generatePlans = async function() {
    const loadingEl = document.getElementById('planLoading');
    const stepPrefs = document.getElementById('stepPreferences');
    const stepDetail = document.getElementById('stepDetail');
    const generateBtn = document.getElementById('generatePlanBtn');
    const startDate = document.getElementById('planStartDate').value;
    const startTime = document.getElementById('planStartTime').value;
    const mode = document.getElementById('planStyle').value;
    const lodgingMode = document.getElementById('planLodging')?.value || 'all';
    const startLocation = document.getElementById('planStartLocation')?.value || 'county';
    if (!startDate) { alert('请选择出发日期'); return; }
    if (selectedPoiOrder.length === 0) { alert('请至少选择一个景点'); return; }

    // 只保留 L2/L3（L4 不参与规划）
    const selectedPois = selectedPoiOrder.map(id => {
        const poi = allPoisMap[String(id)];
        if (!poi) return null;
        if (poi.data_level !== 'L2' && poi.data_level !== 'L3') return null;
        return { ...poi };
    }).filter(Boolean);
    if (selectedPois.length === 0) { alert('未找到有效的景点数据'); return; }

    generateBtn.disabled = true;
    loadingEl.classList.remove('hidden');
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    try {
        const presets = await getTransportPresetsCached();
        const travelTimes = {};
        presets.forEach(p => { travelTimes[`${p.from_poi_id}_${p.to_poi_id}`] = p.time_min; });
        const accommodationPois = allPois.filter(p => {
            if (p.category && p.category.includes('住宿')) return true;
            if (Array.isArray(p.facility_subtype) && p.facility_subtype.includes('hotel')) return true;
            return false;
        });
        const result = await generateTripPlan(
            selectedPois, startDate, startTime, mode,
            travelTimes, allPoisMap, accommodationPois, lodgingMode, startLocation
        );
        if (!result.days || result.days.length === 0) {
            const msg = result.warnings && result.warnings.length > 0 ? result.warnings.join('；') : '请调整选择或检查景点数据';
            alert('无法生成有效的行程方案：' + msg);
            loadingEl.classList.add('hidden');
            stepPrefs.classList.remove('hidden');
            return;
        }
        currentTripData = result;
        showTripDetail(result);
        loadingEl.classList.add('hidden');
        stepPrefs.classList.add('hidden');
        stepDetail.classList.remove('hidden');
    } catch (e) {
        alert('生成方案失败：' + e.message);
        console.error(e);
        loadingEl.classList.add('hidden');
    } finally {
        generateBtn.disabled = false;
    }
};

function renderTripNodeHtml(node) {
    const typeClass = node.type || 'other';
    const iconMap = { transport: '🚗', visit: '📍', meal: '🍽️', accommodation: '🏨', weather: '🌤️', reminder: '⚠️', waiting: '⏳', rest: '☕', trip_end: '🏁' };
    const icon = iconMap[typeClass] || '•';
    if (typeClass === 'weather' || typeClass === 'reminder' || typeClass === 'accommodation' || typeClass === 'trip_end') {
        const text = typeClass === 'accommodation' ? (node.name || '住宿休息')
                   : typeClass === 'trip_end' ? (node.name || '整个行程规划结束')
                   : (node.message || '');
        const textClass = typeClass === 'weather' ? 'weather-text'
                        : typeClass === 'reminder' ? 'reminder-text'
                        : typeClass === 'trip_end' ? 'trip-end-text' : '';
        return `<div class="trip-node type-${typeClass}"><span class="node-icon icon-${typeClass}">${icon}</span><span class="node-content"><span class="${textClass}">${text}</span></span></div>`;
    }
    let timeDisplay = '';
    if (node.startTime !== undefined && node.endTime !== undefined) {
        timeDisplay = `${fmtTime(node.startTime)} - ${fmtTime(node.endTime)}`;
    } else if (node.startTime !== undefined) {
        timeDisplay = fmtTime(node.startTime);
    }
    let content = '';
    if (node.type === 'transport') content = `${node.name || '交通'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else if (node.type === 'visit') content = `${node.name || '游览'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else if (node.type === 'meal') content = `${node.name || '就餐'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else if (node.type === 'waiting') content = `${node.name || '等待'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else if (node.type === 'rest') content = `${node.name || '休息调整'} ${node.duration ? `<span class="node-duration">${node.duration}分钟</span>` : ''}`;
    else content = node.name || '未知节点';
    return `<div class="trip-node type-${typeClass}"><span class="node-time">${timeDisplay}</span><span class="node-icon icon-${typeClass}">${icon}</span><span class="node-content">${content}</span></div>`;
}

function buildRenderedTimeline(selectedIndices, arrivalTime) {
    const selected = currentDetailNodes
        .filter(n => selectedIndices.has(n._idx))
        .sort((a, b) => a._idx - b._idx);
    const timeline = [];
    let currentTime = arrivalTime;
    let lastPoiId = 'county';
    let lunchInserted = false;
    let dinnerInserted = false;
    let lastVisitEndTime = null;
    for (const n of selected) {
        let travel = n.poi_id ? calcTravelBetween(lastPoiId, n.poi_id) : 0;
        if (!lunchInserted && currentTime < LUNCH_END && currentTime + travel + n._duration > LUNCH_START) {
            if (travel > 0) {
                timeline.push({ type: 'transport', name: '前往 ' + (n.node_name || '下一站'), duration: travel, startTime: currentTime, endTime: currentTime + travel });
                currentTime += travel; travel = 0;
            }
            if (currentTime < LUNCH_START) currentTime = LUNCH_START;
            timeline.push({ type: 'meal', name: n.nearby_restaurant ? `午餐（推荐：${n.nearby_restaurant}）` : '午餐时间', duration: MEAL_DURATION, startTime: currentTime, endTime: currentTime + MEAL_DURATION });
            currentTime += MEAL_DURATION; lunchInserted = true;
        }
        const willCrossDinner = !dinnerInserted && (currentTime + travel + n._duration >= DINNER_START);
        if (willCrossDinner) {
            if (travel > 0) {
                timeline.push({ type: 'transport', name: '前往 ' + (n.node_name || '下一站'), duration: travel, startTime: currentTime, endTime: currentTime + travel });
                currentTime += travel; travel = 0;
            }
            timeline.push({ type: 'visit', name: n.node_name || '游览', duration: n._duration, startTime: currentTime, endTime: currentTime + n._duration, nodeType: n.node_type, description: n.description, tips: n.tips, _idx: n._idx });
            currentTime += n._duration; lastVisitEndTime = currentTime;
            if (currentTime < DINNER_START) currentTime = DINNER_START;
            timeline.push({ type: 'meal', name: n.nearby_restaurant ? `晚餐（推荐：${n.nearby_restaurant}）` : '晚餐时间', duration: MEAL_DURATION, startTime: currentTime, endTime: currentTime + MEAL_DURATION });
            currentTime += MEAL_DURATION; dinnerInserted = true;
            lastPoiId = n.poi_id || lastPoiId;
            continue;
        }
        if (travel > 0) {
            timeline.push({ type: 'transport', name: '前往 ' + (n.node_name || '下一站'), duration: travel, startTime: currentTime, endTime: currentTime + travel });
            currentTime += travel;
        }
        timeline.push({ type: 'visit', name: n.node_name || '游览', duration: n._duration, startTime: currentTime, endTime: currentTime + n._duration, nodeType: n.node_type, description: n.description, tips: n.tips, _idx: n._idx });
        currentTime += n._duration; lastVisitEndTime = currentTime;
        lastPoiId = n.poi_id || lastPoiId;
    }
    if (lastPoiId && String(lastPoiId) !== 'county') {
        const returnTravel = calcTravelBetween(lastPoiId, 'county');
        if (returnTravel > 10) {
            timeline.push({ type: 'transport', name: '返回县城', duration: returnTravel, startTime: currentTime, endTime: currentTime + returnTravel });
            currentTime += returnTravel;
        }
    }
    if (!dinnerInserted && currentTime >= 17 * 60 && currentTime < DINNER_END) {
        if (currentTime < DINNER_START) currentTime = DINNER_START;
        timeline.push({ type: 'meal', name: '晚餐时间', duration: MEAL_DURATION, startTime: currentTime, endTime: currentTime + MEAL_DURATION });
        currentTime += MEAL_DURATION; dinnerInserted = true;
    }
    timeline.push({ type: 'trip_end', name: '今天行程结束', startTime: currentTime, endTime: currentTime + 1 });
    return { timeline, endTime: currentTime, lastVisitEndTime: lastVisitEndTime || arrivalTime };
}

function calculateRecommendedNodes() {
    const arrival = currentArrivalTime;
    const availableEnd = VISIT_END;
    const sorted = [...currentDetailNodes].sort((a, b) => {
        if (a._priority !== b._priority) return a._priority - b._priority;
        return a._idx - b._idx;
    });
    let currentTime = arrival;
    let lunchInserted = false;
    let dinnerInserted = false;
    const selectedIndices = new Set();
    let lastPoiId = 'county';
    for (const node of sorted) {
        let travel = node.poi_id ? calcTravelBetween(lastPoiId, node.poi_id) : 0;
        let testTime = currentTime;
        if (!lunchInserted && testTime < LUNCH_END && testTime + travel + node._duration > LUNCH_START) {
            testTime = Math.max(testTime, LUNCH_START) + MEAL_DURATION; lunchInserted = true;
        }
        if (!dinnerInserted && testTime + travel + node._duration >= DINNER_START) break;
        const visitEndTime = testTime + travel + node._duration;
        if (visitEndTime > availableEnd) continue;
        selectedIndices.add(node._idx);
        currentTime = visitEndTime;
        lastPoiId = node.poi_id || lastPoiId;
    }
    currentSelectedNodeIndices = selectedIndices;
    const priority1Nodes = currentDetailNodes.filter(n => n._priority === 1);
    if (priority1Nodes.length > 0) {
        let p1TotalTime = 0;
        let prevId = 'county';
        for (const n of priority1Nodes) {
            p1TotalTime += (n.poi_id ? calcTravelBetween(prevId, n.poi_id) : 0) + n._duration;
            prevId = n.poi_id || prevId;
        }
        const available = availableEnd - currentArrivalTime;
        if (p1TotalTime > available) {
            const p1Names = priority1Nodes.map(n => n.node_name).join('、');
            const availH = Math.floor(available / 60), availM = available % 60;
            const needH = Math.floor(p1TotalTime / 60), needM = p1TotalTime % 60;
            const availStr = availM > 0 ? `${availH} 小时 ${availM} 分钟` : `${availH} 小时`;
            const needStr = needM > 0 ? `${needH} 小时 ${needM} 分钟` : `${needH} 小时`;
            showTimeInsufficientAlert(p1Names, availStr, needStr);
        }
    }
    renderRouteDetailNodes();
}

function showTimeInsufficientAlert(poiNames, availStr, needStr) {
    const old = document.getElementById('timeInsufficientModal');
    if (old) old.remove();
    const div = document.createElement('div');

            <p>您有 <b>${availStr}</b> 可用，但本路线的核心景点（<b>${poiNames}</b>）需要约 <b>${needStr}</b>。</p>
            <p style="font-size:13px;color:#888;">建议：明日 08:00 再游览，或选择更短的路线。</p>
            <div class="btn-row"><button class="btn-ok" onclick="document.getElementById('timeInsufficientModal').remove()">我知道了</button></div>

}

window.onArrivalTimeChange = function() {
    const sel = document.getElementById('arrivalTimeSelect');
    let val = sel.value;
    if (val === 'custom') {
        const input = prompt('请输入到达时间（HH:MM）：', '10:00');
        if (input && /^\d{1,2}:\d{2}$/.test(input)) {
            currentArrivalTime = timeStrToMinutes(input);
            let exists = false;
            for (let opt of sel.options) if (opt.value === input) { exists = true; sel.value = input; break; }
            if (!exists) {
                const opt = document.createElement('option');
                opt.value = input; opt.textContent = input;
                sel.appendChild(opt); sel.value = input;
            }
        } else { sel.value = fmtTime(currentArrivalTime); return; }
    } else { currentArrivalTime = timeStrToMinutes(val); }
    if (currentDetailRoute) calculateRecommendedNodes();
};

function renderRouteDetailNodes() {
    const recContainer = document.getElementById('recommendedNodesContainer');
    const skipContainer = document.getElementById('skippedNodesContainer');
    const skipSection = document.getElementById('skippedSection');
    const selected = currentDetailNodes.filter(n => currentSelectedNodeIndices.has(n._idx));
    const skipped = currentDetailNodes.filter(n => !currentSelectedNodeIndices.has(n._idx));
    document.getElementById('recommendedCount').textContent = selected.length + ' 个';
    document.getElementById('skippedCount').textContent = skipped.length + ' 个';
    if (selected.length > 0) {
        const { timeline } = buildRenderedTimeline(currentSelectedNodeIndices, currentArrivalTime);
        let html = '';
        timeline.forEach((item) => {
            if (item.type === 'transport') {
                html += `<div class="timeline-node type-transport"><span class="node-icon">🚗</span><div class="node-main"><span class="node-name">${item.name}</span></div><div class="node-time">${fmtTime(item.startTime)}-${fmtTime(item.endTime)} ${item.duration}分钟</div></div>`;
            } else if (item.type === 'meal') {
                html += `<div class="timeline-node type-meal"><span class="node-icon">🍽️</span><div class="node-main"><span class="node-name">${item.name}</span></div><div class="node-time">${fmtTime(item.startTime)}-${fmtTime(item.endTime)} ${item.duration}分钟</div></div>`;
            } else if (item.type === 'visit') {
                const icon = NODE_TYPE_ICONS[item.nodeType] || '📍';
                html += `<div class="timeline-node type-visit"><span class="node-icon">${icon}</span><div class="node-main"><div class="node-titlerow"><span class="node-name">${item.name}</span></div>${item.description ? `<div class="node-desc">${item.description}</div>` : ''}${item.tips ? `<div class="node-tips">💡 ${item.tips}</div>` : ''}</div><div class="node-time">${fmtTime(item.startTime)}-${fmtTime(item.endTime)} ${item.duration}分钟</div><span class="node-remove" onclick="window.toggleDetailNode(${item._idx})" title="移除">✕</span></div>`;
            } else if (item.type === 'trip_end') {
                html += `<div class="timeline-node" style="background:#f0f8f0; color:#2E7D32; font-weight:600;"><span class="node-icon">🏁</span><div class="node-main"><span class="node-name">${item.name}</span></div></div>`;
            }
        });
        recContainer.innerHTML = html;
    } else {
        recContainer.innerHTML = '<p class="text-secondary text-center py-2">无推荐节点</p>';
    }
    if (skipped.length === 0) {
        skipSection.classList.add('hidden');
    } else {
        skipSection.classList.remove('hidden');
        let skipHtml = '';
        skipped.forEach((n) => {
            const icon = NODE_TYPE_ICONS[n.node_type] || '📌';
            skipHtml += `<div class="selectable-node" onclick="window.toggleDetailNode(${n._idx})"><input type="checkbox" onclick="event.stopPropagation(); window.toggleDetailNode(${n._idx})"><div class="node-info"><div class="node-title">${icon} ${n.node_name || '未命名'}</div>${n.description ? `<div class="node-desc">${n.description}</div>` : ''}</div><div class="node-time">${n._duration}分钟</div></div>`;
        });
        skipContainer.innerHTML = skipHtml;
    }
    updateStatusBar();
}

function updateStatusBar() {
    const statusBar = document.getElementById('statusBar');
    const statusMsg = document.getElementById('statusMsg');
    const selected = currentDetailNodes.filter(n => currentSelectedNodeIndices.has(n._idx));
    if (selected.length === 0) {
        document.getElementById('selectedNodeCount').textContent = 0;
        document.getElementById('totalDuration').textContent = 0;
        document.getElementById('visitEndTime').textContent = '--:--';
        document.getElementById('estimatedCost').textContent = '—';
        statusBar.className = 'status-bar';
        statusMsg.textContent = '未选择任何节点';
        document.getElementById('btnAdoptFinal').disabled = true;
        return;
    }
    const { timeline, endTime, lastVisitEndTime } = buildRenderedTimeline(currentSelectedNodeIndices, currentArrivalTime);
    let totalMin = 0;
    timeline.forEach(t => { totalMin += (t.duration || 0); });
    const visitCount = timeline.filter(t => t.type === 'visit').length;
    const estimatedCost = visitCount * 10;
    document.getElementById('selectedNodeCount').textContent = selected.length;
    document.getElementById('totalDuration').textContent = totalMin;
    document.getElementById('visitEndTime').textContent = fmtTime(lastVisitEndTime);
    document.getElementById('estimatedCost').textContent = estimatedCost > 0 ? `约${estimatedCost}元` : '—';
    const isOvertime = lastVisitEndTime > VISIT_END;
    const overMinutes = lastVisitEndTime - VISIT_END;
    if (isOvertime) {
        statusBar.className = 'status-bar danger';
        statusMsg.textContent = `⚠️ 游览结束 ${fmtTime(lastVisitEndTime)}，超出闭园 ${overMinutes} 分钟，请取消部分景点`;
        document.getElementById('btnAdoptFinal').disabled = true;
    } else if (lastVisitEndTime > VISIT_END - 60) {
        statusBar.className = 'status-bar warning';
        statusMsg.textContent = `⏰ 游览将于 ${fmtTime(lastVisitEndTime)} 结束，时间较紧`;
        document.getElementById('btnAdoptFinal').disabled = false;
    } else {
        statusBar.className = 'status-bar ok';
        statusMsg.textContent = `✅ 游览将于 ${fmtTime(lastVisitEndTime)} 结束（全天活动 ${fmtTime(endTime)} 结束）`;
        document.getElementById('btnAdoptFinal').disabled = false;
    }
}

window.adoptRouteFinal = function() {
    if (!currentDetailRoute) { alert('路线不存在'); return; }
    const selected = currentDetailNodes.filter(n => currentSelectedNodeIndices.has(n._idx));
    if (selected.length === 0) { alert('请至少选择一个节点'); return; }
    const { timeline } = buildRenderedTimeline(currentSelectedNodeIndices, currentArrivalTime);
    const today = new Date().toISOString().slice(0, 10);
    const dayNodes = [];
    dayNodes.push({ type: 'reminder', message: `采用路线：${currentDetailRoute.name}` });
    timeline.forEach(item => {
        if (item.type === 'transport') {
            dayNodes.push({ type: 'transport', name: item.name, startTime: item.startTime, endTime: item.endTime, duration: item.duration });
        } else if (item.type === 'meal') {
            dayNodes.push({ type: 'meal', name: item.name, startTime: item.startTime, endTime: item.endTime, duration: item.duration });
        } else if (item.type === 'visit') {
            const icon = NODE_TYPE_ICONS[item.nodeType] || '📍';
            dayNodes.push({ type: 'visit', name: `${icon} ${item.name}`, startTime: item.startTime, endTime: item.endTime, duration: item.duration, nodeType: 'poi' });
        } else if (item.type === 'trip_end') {
            dayNodes.push({ type: 'trip_end', name: item.name, startTime: item.startTime, endTime: item.endTime });
        }
    });
    currentTripData = {
        days: [{ day: 1, date: today, nodes: dayNodes }],
        warnings: [],
        totalTravel: 0,
        totalVisit: timeline.filter(t => t.type === 'visit').reduce((s, t) => s + t.duration, 0),
        totalWaiting: 0
    };
    window.closePanel('routeDetailPanel');
    window.closePanel('routePanel');
    document.getElementById('stepPreferences').classList.add('hidden');
    document.getElementById('stepDetail').classList.remove('hidden');
    showTripDetail(currentTripData);
    window.openPanel('planPanel');
    alert('已采用路线并生成行程');
};

        locateUser();
        document.getElementById('generatePlanBtn').addEventListener('click', window.generatePlans);
        console.log('[系统] 初始化完成, POI数量:', pois.length, '路线数:', allRoutesCache.length);
    } catch (e) {
        console.error('[系统] 初始化失败:', e);
        alert('初始化失败：' + e.message);
    }
}
init();
</script>
</body>
</html>
