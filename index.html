        @media (max-width:480px) { .top-btn { font-size:12px; padding:4px 8px; } .float-btn { width:44px; height:44px; font-size:18px; } .locate-btn { bottom:120px; } .voice-toggle-btn { bottom:175px; } }
    </style>

<script>
// ==================== 核心配置 ====================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let map, allPois = [], generatedTripData = null;
let userMarker = null, simMarker = null;
let anonymousUserId = null;
let voiceEnabled = true;
let lastTriggeredPoiIds = {}; // 存储每个POI上次触发日期，格式 'YYYY-MM-DD'
const TRIGGER_RADIUS = 30;     // 电子围栏半径30米
const GPS_ACCURACY_TOLERANCE = 10;
let watchId = null;
let currentGcjPos = null;
let currentAudio = null;
let cachedWeather = null; // 缓存天气信息

const COUNTY = { lat:32.08, lng:107.24, name:'红军广场', id:'county' };
const poiColors = { '自然景区':'#2E7D32', '红色景区':'#9C27B0', '文博场馆':'#9C27B0', '餐饮住宿':'#FF9800', '停车场':'#00BCD4', '公共服务':'#607D8B' };
let transportPresets = {};
const DAY_START=480, DAY_END=1080, LUNCH_TRIGGER=690, LUNCH_END=750, DINNER_TRIGGER=1050, DINNER_END=1110, MEAL_DURATION=60;
const EXCLUDED_FROM_TRIP = ['游戏娱乐','公共服务','特产购物'];
const NON_VISIT_CATEGORIES = ['交通枢纽','餐饮住宿','公共服务','特产购物','游玩娱乐'];
let routeLegs=[], mainPoiOptions=[], allowedPoiOptions=[];

// ==================== 辅助函数 ====================
function wgs84ToGcj02(lat, lon) {
    const a = 6378245.0;
    const ee = 0.00669342162296594323;
    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }
    function transformLon(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
    }
    const dLat = transformLat(lon - 105.0, lat - 35.0);
    const dLon = transformLon(lon - 105.0, lat - 35.0);
    const radLat = lat / 180.0 * Math.PI;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    const dLatFinal = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
    const dLonFinal = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
    return { lat: lat + dLatFinal, lng: lon + dLonFinal };
}

function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatTime(m){ return `${Math.floor(m/60).toString().padStart(2,'0')}:${(m%60).toString().padStart(2,'0')}`; }
function isNonVisitPoi(poiId){
    if(poiId==='county') return false;
    const poi = allPois.find(p=>p.id==poiId);
    if(!poi || !poi.category) return false;
    return poi.category.split(',').some(c=>NON_VISIT_CATEGORIES.includes(c));
}
function getUserId(){
    return anonymousUserId || (localStorage.getItem('vid') || (()=>{
        let uid='v_'+Date.now()+Math.random().toString(36);
        localStorage.setItem('vid',uid);
        return uid;
    })());
}
function getTodayStr(){ return new Date().toISOString().slice(0,10); }

// ==================== 获取通江县天气（免费，无需API Key） ====================
async function fetchTongjiangWeather() {
    if (cachedWeather && (Date.now() - cachedWeather.time < 3600000)) {
        return cachedWeather.data;
    }
    try {
        const url = 'https://www.yzqxj.com/guonei/sichuan-bazhong-tongjiang/7day.html';
        const response = await fetch(url);
        const html = await response.text();
        const todayStr = new Date().toISOString().slice(0,10);
        const regex = new RegExp(todayStr + '\\s*\\([^)]+\\)\\s*([^\\d]+)\\s*(\\d+)℃\\s*～\\s*(\\d+)℃\\s*([^<]*)');
        const match = html.match(regex);
        if (match) {
            const weather = {
                condition: match[1].trim(),
                tempMin: parseInt(match[2]),
                tempMax: parseInt(match[3]),
                wind: match[4].trim() || '微风'
            };
            cachedWeather = { time: Date.now(), data: weather };
            console.log('[天气] 获取成功:', weather);
            return weather;
        }
        const url2 = 'https://tianqi.moji.com/today/china/sichuan/tongjiang-county';
        const response2 = await fetch(url2);
        const html2 = await response2.text();
        const regex2 = /今日天气\s*([^\d]+)\s*(\d+)°/;
        const match2 = html2.match(regex2);
        if (match2) {
            const weather = {
                condition: match2[1].trim(),
                tempMax: parseInt(match2[2]),
                tempMin: null,
                wind: '未知'
            };
            cachedWeather = { time: Date.now(), data: weather };
            console.log('[天气] 获取成功(备用):', weather);
            return weather;
        }
        const url3 = 'https://wttr.in/tongjiang?format=%C+%t+%w';
        const response3 = await fetch(url3);
        const text3 = await response3.text();
        const parts = text3.trim().split(/\s+/);
        if (parts.length >= 2) {
            const weather = {
                condition: parts[0] || '未知',
                tempMax: parseInt(parts[1].replace('+','').replace('°C','')) || null,
                tempMin: null,
                wind: parts.slice(2).join(' ') || '微风'
            };
            cachedWeather = { time: Date.now(), data: weather };
            console.log('[天气] 获取成功(wttr.in):', weather);
            return weather;
        }
        console.warn('[天气] 所有方案均失败');
        return null;
    } catch (e) {
        console.warn('[天气] 获取失败:', e);
        return null;
    }
}

function getWeatherTip(weather) {
    if (!weather) return '⚠️ 天气信息获取失败，请自行关注天气变化。';
    let tip = `🌤️ 通江今日天气：${weather.condition}`;
    if (weather.tempMin !== null && weather.tempMax !== null) {
        tip += `，气温 ${weather.tempMin}℃ ～ ${weather.tempMax}℃`;
    } else if (weather.tempMax !== null) {
        tip += `，最高气温 ${weather.tempMax}℃`;
    }
    if (weather.wind && weather.wind !== '未知') {
        tip += `，${weather.wind}`;
    }
    if (weather.condition && (weather.condition.includes('雨') || weather.condition.includes('雷'))) {
        tip += '，☔ 有降雨可能，建议携带雨具，注意出行安全。';
    } else if (weather.tempMax !== null && weather.tempMax > 33) {
        tip += '，☀️ 气温较高，注意防暑防晒，多补充水分。';
    } else if (weather.tempMax !== null && weather.tempMax < 10) {
        tip += '，🧥 气温较低，注意保暖。';
    } else {
        tip += '，🌿 天气适宜出行，祝您旅途愉快！';
    }
    return tip;
}

// ==================== 语音引擎激活 ====================
function activateSpeech() {
    if ('speechSynthesis' in window) {
        speechSynthesis.getVoices();
        const silent = new SpeechSynthesisUtterance(' ');
        silent.volume = 0;
        silent.lang = 'zh-CN';
        speechSynthesis.speak(silent);
        setTimeout(() => speechSynthesis.cancel(), 100);
        console.log('[语音] 引擎已激活');
    }
}

// ==================== 自动语音开关 ====================
function toggleAutoVoice() {
    voiceEnabled = !voiceEnabled;
    const btn = document.getElementById('voiceToggleBtn');
    if (voiceEnabled) {
        btn.textContent = '🔊';
        const testMsg = new SpeechSynthesisUtterance('语音已开启');
        testMsg.lang = 'zh-CN';
        speechSynthesis.speak(testMsg);
        if (currentGcjPos) {
            checkVoiceTrigger(currentGcjPos.lat, currentGcjPos.lng);
        }
    } else {
        btn.textContent = '🔇';
        speechSynthesis.cancel();
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        const closeMsg = new SpeechSynthesisUtterance('语音已关闭');
        closeMsg.lang = 'zh-CN';
        speechSynthesis.speak(closeMsg);
    }
}

// ==================== 核心：语音播放（支持MP3和TTS） ====================
function triggerVoice(poi) {
    if (!voiceEnabled) {
        console.log('[语音] 开关关闭，不播放');
        return;
    }
    speechSynthesis.cancel();
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }

    if (poi.voice_mp3) {
        console.log('[语音] 播放MP3 (voice_mp3):', poi.voice_mp3);
        const audio = new Audio(poi.voice_mp3);
        currentAudio = audio;
        audio.play().then(() => {
            console.log('[语音] MP3播放成功', poi.name);
        }).catch(err => {
            console.warn('[语音] MP3播放失败，降级到TTS', err);
            playTTS(poi);
        });
        return;
    }

    if (poi.voice_cn && poi.voice_cn.startsWith('http')) {
        console.log('[语音] 播放MP3 (voice_cn URL):', poi.voice_cn);
        const audio = new Audio(poi.voice_cn);
        currentAudio = audio;
        audio.play().then(() => {
            console.log('[语音] MP3播放成功 (voice_cn URL)', poi.name);
        }).catch(err => {
            console.warn('[语音] MP3 (voice_cn) 播放失败，降级到TTS', err);
            playTTS(poi);
        });
        return;
    }

    playTTS(poi);
}

function playTTS(poi) {
    const lang = document.getElementById('langSelect')?.value || 'cn';
    let text = poi['voice_' + lang] || poi.voice_cn || poi.description || poi.name;
    if (text && text.startsWith('http')) {
        console.warn('[TTS] voice_cn 是URL，忽略，使用 description');
        text = poi.description || poi.name;
    }
    if (!text) {
        console.warn('[语音] 无可用文本', poi.name);
        return;
    }
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = { cn:'zh-CN', en:'en-US', ja:'ja-JP', ko:'ko-KR' }[lang] || 'zh-CN';
    utterance.rate = 0.9;
    utterance.onstart = () => console.log('[语音] TTS开始播放');
    utterance.onend = () => console.log('[语音] TTS播报完成');
    utterance.onerror = (e) => console.warn('[语音] TTS播报错误', e);
    speechSynthesis.speak(utterance);
    console.log(`[语音] TTS播放：${text}`);
}

// ==================== 电子围栏检测（30米，每日触发一次） ====================
function checkVoiceTrigger(userLat, userLng) {
    if (!voiceEnabled) {
        console.log('[围栏] 语音已关闭，跳过检测');
        return;
    }
    if (!allPois || allPois.length === 0) {
        console.warn('[围栏] POI数据未加载');
        return;
    }
    const today = getTodayStr();
    const threshold = TRIGGER_RADIUS + GPS_ACCURACY_TOLERANCE;
    allPois.forEach(poi => {
        if (!poi.lat || !poi.lng) return;
        const dist = getDistance(userLat, userLng, poi.lat, poi.lng);
        const lastDate = lastTriggeredPoiIds[poi.id] || '';
        if (lastDate === today) return;
        if (dist <= threshold) {
            console.log(`[围栏] 触发 ${poi.name}, 距离 ${dist.toFixed(1)}m`);
            triggerVoice(poi);
            lastTriggeredPoiIds[poi.id] = today;
        }
    });
}

// ==================== 定位 ====================
function locateUser() {
    if (!navigator.geolocation) {
        alert('您的浏览器不支持定位');
        return;
    }
    activateSpeech();
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const raw = { lat: position.coords.latitude, lng: position.coords.longitude };
            const gcj = wgs84ToGcj02(raw.lat, raw.lng);
            currentGcjPos = gcj;
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker([gcj.lat, gcj.lng], {
                icon: L.divIcon({
                    html: '<div style="background:#2196F3; width:20px; height:20px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px rgba(0,0,0,0.3);"></div>',
                    iconSize: [20,20],
                    className: ''
                })
            }).addTo(map).bindPopup('我的位置').openPopup();
            map.setView([gcj.lat, gcj.lng], 15);
            startWatching();
            checkVoiceTrigger(gcj.lat, gcj.lng);
        },
        (error) => {
            console.warn('定位失败:', error.message);
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function startWatching() {
    if (!navigator.geolocation) return;
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(
        (pos) => {
            const raw = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            const gcj = wgs84ToGcj02(raw.lat, raw.lng);
            currentGcjPos = gcj;
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker([gcj.lat, gcj.lng], {
                icon: L.divIcon({
                    html: '<div style="background:#2196F3; width:20px; height:20px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px rgba(0,0,0,0.3);"></div>',
                    iconSize: [20,20],
                    className: ''
                })
            }).addTo(map);
            checkVoiceTrigger(gcj.lat, gcj.lng);
        },
        (err) => { console.warn('定位监听错误', err); },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
}

function initTimeSelectors() {

    for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 10) {
            const value = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = value;
            select.appendChild(opt);
        }
    }
    // 设置默认时间为当前时间（取整到最近10分钟）
    const now = new Date();
    let h = now.getHours();
    let m = Math.floor(now.getMinutes() / 10) * 10;
    if (m === 60) { m = 0; h = (h + 1) % 24; }
    const defaultVal = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    select.value = defaultVal;
}

function getTransportTime(fromId, toId, mode) {
    if (fromId === 'mylocation' || toId === 'mylocation') {
        const fromPoi = fromId === 'mylocation' ? { lat: currentGcjPos?.lat || 0, lng: currentGcjPos?.lng || 0 } : allPois.find(p => p.id == fromId) || COUNTY;
        const toPoi = toId === 'mylocation' ? { lat: currentGcjPos?.lat || 0, lng: currentGcjPos?.lng || 0 } : allPois.find(p => p.id == toId) || COUNTY;
        if (!fromPoi || !toPoi) return null;
        const dist = getDistance(fromPoi.lat, fromPoi.lng, toPoi.lat, toPoi.lng);
        const speed = mode === 'auto' ? 40000 : (mode === 'bus' ? 20000 : 5000);
        return Math.round(dist / speed * 60);
    }
    const fId = fromId === 'county' ? 0 : fromId;
    const tId = toId === 'county' ? 0 : toId;
    let t = transportPresets[`${fId}_${tId}`];
    if (t !== undefined) return t;
    t = transportPresets[`${tId}_${fId}`];
    return t !== undefined ? t : null;
}

function renderPOIs(pois) {
    map.eachLayer(l => { if(l instanceof L.Marker && l !== userMarker && l !== simMarker) map.removeLayer(l); });
    pois.forEach(p => {
        const cat = (p.category||'').split(',')[0]||'其他';
        const color = poiColors[cat]||'#999';
        const icon = L.divIcon({html:`<div style="background:${color}; width:20px; height:20px; border-radius:50%; border:2px solid white;"></div>`, iconSize:[20,20]});
        L.marker([p.lat,p.lng],{icon}).addTo(map).on('click', ()=> showPoiDetail(p));
    });
}

// ==================== 重构 generateTimeline 返回每日统计，增加就餐跳过逻辑 ====================
function generateTimeline(nodes, startDate, startTime) {
    let curDate = new Date(startDate);
    let [h, m] = startTime.split(':').map(Number);
    let curMin = h * 60 + m;
    const lines = [];
    let lunchDone = false, dinnerDone = false;
    if (curMin >= LUNCH_TRIGGER) {
        lunchDone = true;
    }
    if (curMin >= DINNER_TRIGGER) {
        dinnerDone = true;
    }

    let dailyStats = [];
    let currentDayTransport = 0;
    let currentDayVisit = 0;
    let currentDayDate = curDate.toLocaleDateString('zh-CN');

    function addLine(time, text, date, type, duration) {
        lines.push({ time, text, date: new Date(date) });
        if (type === 'transport') {
            currentDayTransport += duration;
        } else if (type === 'visit') {
            currentDayVisit += duration;
        }
    }

    function gotoNextDay() {
        if (curMin >= DAY_END) {
            ensureMealsForDay();
            addLine(DAY_END, `🌙 当天行程结束，住宿休息`, curDate, null, 0);
            dailyStats.push({
                date: currentDayDate,
                transport: currentDayTransport,
                visit: currentDayVisit
            });
            curDate.setDate(curDate.getDate() + 1);
            curMin = DAY_START;
            lunchDone = false;
            dinnerDone = false;
            if (curMin >= LUNCH_TRIGGER) lunchDone = true;
            if (curMin >= DINNER_TRIGGER) dinnerDone = true;
            currentDayDate = curDate.toLocaleDateString('zh-CN');
            currentDayTransport = 0;
            currentDayVisit = 0;
        }
    }

    function tryInsertLunch() {
        if (!lunchDone && curMin >= LUNCH_TRIGGER) {
            addLine(curMin, `🍽️ 午餐时间 (${formatTime(curMin)}-${formatTime(curMin+MEAL_DURATION)})`, curDate, null, 0);
            curMin += MEAL_DURATION;
            lunchDone = true;
            return true;
        }
        return false;
    }

    function tryInsertDinner() {
        if (!dinnerDone && curMin >= DINNER_TRIGGER) {
            addLine(curMin, `🍽️ 晚餐时间 (${formatTime(curMin)}-${formatTime(curMin+MEAL_DURATION)})`, curDate, null, 0);
            curMin += MEAL_DURATION;
            dinnerDone = true;
            return true;
        }
        return false;
    }

    function ensureMealsForDay() {
        if (!lunchDone) {
            let t = Math.max(curMin, LUNCH_TRIGGER);
            addLine(t, `🍽️ 午餐时间 (${formatTime(t)}-${formatTime(t+MEAL_DURATION)})`, curDate, null, 0);
            curMin = t + MEAL_DURATION;
            lunchDone = true;
        }
        if (!dinnerDone) {
            let t = Math.max(curMin, DINNER_TRIGGER);
            addLine(t, `🍽️ 晚餐时间 (${formatTime(t)}-${formatTime(t+MEAL_DURATION)})`, curDate, null, 0);
            curMin = t + MEAL_DURATION;
            dinnerDone = true;
        }
    }

    addLine(curMin, `🚩 ${formatTime(curMin)} 从 ${nodes[0].name} 出发`, curDate, null, 0);

    for (let i = 1; i < nodes.length; i++) {
        const cur = nodes[i];
        let travelTime = cur.transportTime || 0;
        if (travelTime > 0) {
            if (curMin >= DAY_END) gotoNextDay();
            let startMin = curMin;
            curMin += travelTime;
            let daysPassed = Math.floor(curMin / 1440);
            if (daysPassed > 0) {
                curDate.setDate(curDate.getDate() + daysPassed);
                curMin = curMin % 1440;
                lunchDone = false;
                dinnerDone = false;
                if (curMin >= LUNCH_TRIGGER) lunchDone = true;
                if (curMin >= DINNER_TRIGGER) dinnerDone = true;
            }
            let endMin = curMin;
            addLine(startMin, `🚗 ${formatTime(startMin)}-${formatTime(endMin)} 前往 ${cur.name} (交通${travelTime}分钟)`, curDate, 'transport', travelTime);
            tryInsertLunch(); tryInsertDinner();
        } else if (cur.transportTime === null) {
            addLine(curMin, `⚠️ 前往 ${cur.name} 交通耗时未知`, curDate, null, 0);
        }

        if (cur.visitDuration > 0 && !isNonVisitPoi(cur.id)) {
            let visitLeft = cur.visitDuration;
            while (visitLeft > 0) {
                if (curMin < DAY_START) curMin = DAY_START;
                if (curMin >= DAY_END) gotoNextDay();
                if (tryInsertLunch() || tryInsertDinner()) continue;
                let nextBreak = DAY_END;
                if (!lunchDone && curMin < LUNCH_TRIGGER) nextBreak = LUNCH_TRIGGER;
                else if (!dinnerDone && curMin < DINNER_TRIGGER) nextBreak = DINNER_TRIGGER;
                let timeToBreak = nextBreak - curMin;
                if (timeToBreak <= 0) timeToBreak = 1;
                let spend = Math.min(visitLeft, timeToBreak);
                let endMin = curMin + spend;
                addLine(curMin, `⏱️ ${formatTime(curMin)}-${formatTime(endMin)} 游览 ${cur.name} (游览${cur.visitDuration}分钟)`, curDate, 'visit', spend);
                curMin = endMin;
                visitLeft -= spend;
                tryInsertLunch(); tryInsertDinner();
            }
        } else if (isNonVisitPoi(cur.id)) {
            if (curMin >= DAY_END) gotoNextDay();
            addLine(curMin, `📍 ${formatTime(curMin)} 到达 ${cur.name}`, curDate, null, 0);
        }
        if (curMin < DAY_END) { tryInsertLunch(); tryInsertDinner(); }
        else ensureMealsForDay();
    }

    if (curMin < DAY_END) { tryInsertLunch(); tryInsertDinner(); }
    else ensureMealsForDay();

    dailyStats.push({
        date: currentDayDate,
        transport: currentDayTransport,
        visit: currentDayVisit
    });

    return { lines, dailyStats };
}

// ==================== 自设行程生成（含天气信息附加到每一天末尾、时间校验和每日精细化温馨提示） ====================
async function generateCustomTrip() {
    const valid = routeLegs.filter(l => l.id && l.id !== 'county');
    if (valid.length === 0) return alert('请至少选择一个景区');

    const dateStr = document.getElementById('trip-date').value;
    const startTime = getSelectedTime();
    if (!dateStr) return alert('选择出发日期');
    if (!startTime) return alert('选择出发时间');

    const now = new Date();
    const selectedDateTime = new Date(dateStr + 'T' + startTime);
    if (selectedDateTime < now) {
        alert('出发时间不能早于当前时间，请调整日期或时间。');
        return;
    }

    const mode = document.getElementById('trip-mode').value;
    const people = document.getElementById('trip-people').value;

    let nodes = [{ ...routeLegs[0], type: 'start' }];
    for (let i = 1; i < routeLegs.length; i++) {
        const p = routeLegs[i];
        let dur = allPois.find(p2 => p2.id == p.id)?.visit_duration || 0;
        if (isNonVisitPoi(p.id)) dur = 0;
        nodes.push({
            ...p,
            type: 'poi',
            visitDuration: dur,
            transportTime: getTransportTime(routeLegs[i - 1].id, p.id, mode)
        });
    }

    const { lines, dailyStats } = generateTimeline(nodes, dateStr, startTime);

    const daysMap = {};
    lines.forEach(l => {
        const key = l.date.toLocaleDateString('zh-CN');
        if (!daysMap[key]) daysMap[key] = [];
        daysMap[key].push(l);
    });
    const days = Object.keys(daysMap).map(date => ({
        date: date,
        lines: daysMap[date]
    }));

    // 获取天气信息（只获取一次）
    let weatherTip = '';
    try {
        const weather = await fetchTongjiangWeather();
        if (weather) {
            weatherTip = getWeatherTip(weather);
        } else {
            weatherTip = '⚠️ 天气信息获取失败，请自行关注天气变化。';
        }
    } catch (e) {
        weatherTip = '⚠️ 天气信息获取失败，请自行关注天气变化。';
    }

    // 构建HTML显示，将天气提示附加到每一天的末尾
    let html = '';
    days.forEach((d, i) => {
        html += `<div class="day-header">📅 第${i+1}天 (${d.date})</div>`;
        d.lines.forEach(l => {
            html += `<div class="trip-line">${l.text}</div>`;
        });
        // 在当天行程末尾添加天气提示
        html += `<div class="trip-line" style="color:#0d47a1;">${weatherTip}</div>`;
    });

    // 生成温馨提示（不含天气，天气已单独附加）
    let tips = [];
    let totalTransport = 0, totalVisit = 0;
    dailyStats.forEach(stat => {
        totalTransport += stat.transport;
        totalVisit += stat.visit;
    });
    let totalActivity = totalTransport + totalVisit;
    let mealCount = lines.filter(l => l.text.includes('🍽️')).length;
    tips.push(`📊 活动总时长：${totalActivity}分钟（约${(totalActivity/60).toFixed(1)}小时），其中交通${totalTransport}分钟，游览${totalVisit}分钟。`);
    if (mealCount > 0) tips.push(`🍴 包含 ${mealCount} 次用餐，预计总耗时约 ${Math.round((totalActivity + mealCount*60)/60)} 小时。`);
    if (days.length > 1) tips.push(`🏨 行程跨${days.length}天，请合理安排住宿。`);

    dailyStats.forEach((stat, idx) => {
        const dayNum = idx + 1;
        const dateLabel = stat.date;
        let dayTips = [];
        if (stat.transport > 120) {
            dayTips.push(`⚠️ 第${dayNum}天（${dateLabel}）交通耗时较长，长时间驾车或乘车容易导致疲劳，请务必注意驾乘人员精神状态，保证交通安全。建议适当减少跨区域景点，或将部分行程顺延至次日。`);
        }
        if (stat.visit > 240) {
            dayTips.push(`⚠️ 第${dayNum}天（${dateLabel}）游览活动量较大，请注意休息，合理分配体力，避免过度劳累。`);
        }
        if (stat.transport <= 120 && stat.visit <= 240) {
            if (stat.transport < 60 && stat.visit < 120) {
                dayTips.push(`✅ 第${dayNum}天（${dateLabel}）行程较为轻松，可考虑增加周边POI或游玩项目，让旅程更丰富。`);
            } else {
                dayTips.push(`✅ 第${dayNum}天（${dateLabel}）行程时间安排合理，既充实又不紧张，祝您旅途愉快！`);
            }
        }
        if (dayTips.length > 0) {
            tips.push(...dayTips);
        }
    });

    if (days.length === 1 && (totalTransport > 120 || totalVisit > 240)) {
        tips.push(`💡 由于当日行程时间较长，建议您考虑将部分景点调整到第二天，或选择更近的景点，以获得更好的旅行体验。`);
    }

    document.getElementById('generated-trip').innerHTML = `<div class="card">${html}</div>`;
    document.getElementById('trip-warnings').innerHTML = tips.length ? `<div class="warn-list"><strong>💡 温馨提示：</strong>${tips.map(t=>`<div>${t}</div>`).join('')}</div>` : '';
    document.getElementById('saveGeneratedTripBtn').classList.remove('hidden');

    generatedTripData = {
        name: '自设行程',
        date: dateStr,
        time: startTime,
        mode,
        people,
        nodes: nodes.map(n => ({ id: n.id, name: n.name, transportTime: n.transportTime, visitDuration: n.visitDuration })),
        days: days.map(d => ({ date: d.date, lines: d.lines, weatherTip: weatherTip })),
        tips
    };
}

function saveGeneratedTrip() {
    if (!generatedTripData) return;
    const name = prompt('行程名称', generatedTripData.name);
    if (!name) return;
    generatedTripData.name = name;
    const trips = JSON.parse(localStorage.getItem('trips') || '[]');
    trips.push(generatedTripData);
    localStorage.setItem('trips', JSON.stringify(trips));
    alert('行程已保存');
    document.getElementById('saveGeneratedTripBtn').classList.add('hidden');
    document.getElementById('generated-trip').innerHTML = '';
    generatedTripData = null;
    resetRouteLegs();
}

function renderMyTrip() {
    const trips = JSON.parse(localStorage.getItem('trips') || '[]');
    let html = '';
    trips.forEach((trip, i) => {
        html += `<div class="card"><div class="collapse-header" onclick="toggleTripDetail(${i})">📅 ${trip.name} | ${trip.date} ${trip.time}</div><div id="trip-detail-${i}" class="hidden">`;
        if (trip.days) trip.days.forEach(day => {
            html += `<div class="day-header">📅 ${day.date}</div>`;
            day.lines.forEach(l => html += `<div class="trip-line">${l.text}</div>`);
            if (day.weatherTip) html += `<div class="trip-line" style="color:#0d47a1;">${day.weatherTip}</div>`;
        });
        if (trip.tips) html += `<div class="warn-list">${trip.tips.map(t => `<div>${t}</div>`).join('')}</div>`;
        html += `<button class="btn btn-danger" onclick="event.stopPropagation(); deleteTrip(${i})">删除</button></div></div>`;
    });
    document.getElementById('myTripContent').innerHTML = html || '<p>暂无保存的行程</p>';
}
window.toggleTripDetail = function(idx) { document.getElementById('trip-detail-' + idx).classList.toggle('hidden'); };
function deleteTrip(idx) {
    const trips = JSON.parse(localStorage.getItem('trips') || '[]');
    trips.splice(idx, 1);
    localStorage.setItem('trips', JSON.stringify(trips));
    renderMyTrip();
}

async function loadMyReservations() {
    const uid = getUserId();
    const { data } = await sb.from('reservations').select('*').eq('user_id', uid).order('created_at', false);
    if (!data || data.length === 0) {
        document.getElementById('myReservationContent').innerHTML = '<p>暂无预约</p>';
        return;
    }
    const merchantIds = [...new Set(data.map(r => r.merchant_id))];
    const { data: merchants } = await sb.from('ztj_merchants').select('id,display_name').in('id', merchantIds);
    const merchantMap = {};
    if (merchants) merchants.forEach(m => merchantMap[m.id] = m.display_name);
    let html = '';
    data.forEach((r, idx) => {
        let category = '', content = '';
        if (r.remark) {
            const parts = r.remark.split('|');
            parts.forEach(p => {
                if (p.startsWith('类别：')) category = p.replace('类别：', '');
                else if (p.startsWith('内容：')) content = p.replace('内容：', '');
            });
        }
        const merchantName = merchantMap[r.merchant_id] || '未知商户';
        html += `<div class="card">
            <div class="collapse-header" onclick="toggleMyReservationDetail(${idx})">
                <span>${r.reservation_date} | ${r.time_slot_start}-${r.time_slot_end||''} | ${merchantName} | ${category||'未分类'} | ${content||''} | 联系人：${r.name}</span>
            </div>
            <div id="my-res-detail-${idx}" class="hidden">
                <p><b>商户：</b>${merchantName}</p>
                <p><b>活动类别：</b>${category||'未指定'}</p>
                <p><b>预约内容：</b>${content||'未指定'}</p>
                <p><b>单位：</b>${r.unit||''} <b>人数：</b>${r.visitor_count}</p>
                <p><b>电话：</b>${r.phone}</p>
                <p><b>地点：</b>${r.room||''}</p>
                <p><b>状态：</b>${{pending:'预约中',confirmed:'已确认',rejected:'已拒绝'}[r.status]||r.status}</p>
            </div>
        </div>`;
    });
    document.getElementById('myReservationContent').innerHTML = html;
}
window.toggleMyReservationDetail = function(idx) { document.getElementById('my-res-detail-' + idx).classList.toggle('hidden'); };

async function submitFeedback() {
    const msg = document.getElementById('feedbackMsg').value;
    if (!msg) return;
    await sb.from('ztj_feedbacks').insert({ user_id: getUserId(), message: msg });
    document.getElementById('feedbackMsg').value = '';
    loadFeedbackHistory();
}
async function loadFeedbackHistory() {
    const { data } = await sb.from('ztj_feedbacks').select('*').neq('user_id', 'system').order('created_at', { ascending: false });
    let html = '';
    if (data) {
        data.forEach(f => {
            let replyHtml = '';
            if (f.reply) {
                replyHtml = `<div class="feedback-reply">🔔 管理员回复：${f.reply}</div>`;
            }
            html += `<div class="card">
                <div><b>${new Date(f.created_at).toLocaleString()}</b></div>
                <div>${f.message}</div>
                ${replyHtml}
            </div>`;
        });
    }
    document.getElementById('feedbackHistory').innerHTML = html || '<p>暂无留言</p>';
}

function switchMyTab(tab) {
    document.getElementById('my-tab-trip').classList.remove('active');
    document.getElementById('my-tab-reservation').classList.remove('active');
    document.getElementById('my-tab-feedback').classList.remove('active');
    document.getElementById('myTripContent').classList.add('hidden');
    document.getElementById('myReservationContent').classList.add('hidden');
    document.getElementById('myFeedbackContent').classList.add('hidden');
    if (tab === 'trip') { document.getElementById('my-tab-trip').classList.add('active'); document.getElementById('myTripContent').classList.remove('hidden'); renderMyTrip(); }
    else if (tab === 'reservation') { document.getElementById('my-tab-reservation').classList.add('active'); document.getElementById('myReservationContent').classList.remove('hidden'); loadMyReservations(); }
    else { document.getElementById('my-tab-feedback').classList.add('active'); document.getElementById('myFeedbackContent').classList.remove('hidden'); loadFeedbackHistory(); }
}

function openPanel(id) { document.getElementById(id).classList.add('active'); if (id === 'routesPanel') loadRoutes(); }
function closePanel(id) { document.getElementById(id).classList.remove('active'); }
function startSimulation() { alert('模拟导航功能即将上线'); }
