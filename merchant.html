<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商户管理 - 通江文旅</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f5f5f5; font-family: system-ui, sans-serif; }
        .header { background: #1b5e20; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h3 { margin: 0; display: flex; align-items: center; gap: 10px; }
        .container-custom { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
        .tab-content { background: white; padding: 20px; border-radius: 0 0 8px 8px; border: 1px solid #dee2e6; border-top: none; }
        .nav-tabs .nav-link.active { background: #2e7d32; color: white; border-color: #2e7d32; }
        .item-header { background: #f0f0f0; padding: 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
        .item-detail { padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-top: 4px; background: white; }
        .upload-preview { max-width: 200px; max-height: 150px; border-radius: 4px; border: 1px solid #ddd; }
        .category-header { cursor: pointer; background: #f9f9f9; padding: 8px; border: 1px solid #ddd; border-radius: 4px; display: flex; justify-content: space-between; margin: 4px 0; }
        .hidden { display: none !important; }
        #login-page { max-width: 400px; margin: 80px auto; }
        #login-page .card { padding: 24px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .btn-sm { font-size: 12px; padding: 4px 8px; }
        .loading-placeholder { color: #888; padding: 12px 0; text-align: center; }
        @media (max-width: 768px) { .header { flex-direction: column; gap: 8px; } }
    </style>
</head>
<body>

<!-- 登录 -->
<div id="login-page">
    <div class="card">
        <h2 class="text-center text-success"><i class="fas fa-store"></i> 商户登录</h2>
        <div class="mb-3">
            <label class="form-label">邮箱</label>
            <input id="account" class="form-control" placeholder="st001@st.cn">
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input id="password" type="password" class="form-control" placeholder="密码">
        </div>
        <button class="btn btn-success w-100" id="loginBtn"><i class="fas fa-sign-in-alt"></i> 登录</button>
        <p id="login-msg" class="text-danger mt-2"></p>
        <hr>
        <p class="text-secondary small text-center">
            提示：若无法登录，请检查 Supabase 中是否存在该商户用户。
        </p>
    </div>
</div>

<!-- 主界面 -->
<div id="main" class="hidden">
    <div class="header">
        <h3><i class="fas fa-store"></i> <span id="merchant-name">商户</span></h3>
        <button class="btn btn-light" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 退出</button>
    </div>

    <div class="container-custom">
        <ul class="nav nav-tabs" id="merchantTabs">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-business">📦 业务管理</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-reservations">📅 预约列表</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-feedbacks">💬 留言</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-info">🏪 基本信息</a></li>
        </ul>
        <div class="tab-content">
            <!-- 业务管理 -->
            <div class="tab-pane active" id="tab-business">
                <div class="d-flex justify-content-between align-items-center">
                    <h5>业务分类与项目</h5>
                    <button class="btn btn-secondary btn-sm" onclick="window.toggleCategoryPanel()">管理分类</button>
                </div>
                <div id="category-panel" class="card p-3 mb-3 hidden">
                    <div class="d-flex gap-2"><input id="new-category-input" class="form-control" placeholder="新分类名称">
                        <button class="btn btn-success" onclick="window.addCategory()">添加</button></div>
                    <div id="category-list" class="mt-2"></div>
                </div>
                <div id="business-container">
                    <div class="loading-placeholder">加载中...</div>
                </div>
                <button class="btn btn-success mt-3" onclick="window.showAddItemForm()"><i class="fas fa-plus"></i> 添加项目</button>
            </div>

            <!-- 预约列表 -->
            <div class="tab-pane" id="tab-reservations">
                <div class="d-flex justify-content-between mb-3">
                    <button class="btn btn-success" onclick="window.toggleReservationForm()"><i class="fas fa-plus"></i> 新增预约</button>
                    <button class="btn btn-warning" onclick="window.exportReservations()"><i class="fas fa-file-export"></i> 导出</button>
                </div>
                <div id="add-reservation-form" class="card p-3 mb-3 hidden">
                    <h6>新增预约</h6>
                    <div class="row g-2">
                        <div class="col-md-4"><label class="form-label">预约日期</label><input type="date" id="new-res-date" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">时段</label>
                            <select id="new-res-time" class="form-select">
                                <option>08:00-09:00</option><option>09:00-10:00</option>
                                <option>10:00-11:00</option><option>11:00-12:00</option>
                                <option>13:00-14:00</option><option>14:00-15:00</option>
                                <option>15:00-16:00</option><option>16:00-17:00</option>
                            </select>
                        </div>
                        <div class="col-md-4"><label class="form-label">单位</label><input id="new-res-unit" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">联系人</label><input id="new-res-name" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">电话</label><input id="new-res-phone" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">人数</label><input type="number" id="new-res-count" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">活动类别</label><select id="new-res-activity" class="form-select"></select></div>
                        <div class="col-md-4"><label class="form-label">地点</label><input id="new-res-room" class="form-control"></div>
                        <div class="col-12"><label class="form-label">备注</label><textarea id="new-res-remark" class="form-control" rows="2"></textarea></div>
                    </div>
                    <button class="btn btn-success mt-2" onclick="window.saveReservation()">保存</button>
                    <button class="btn btn-secondary mt-2" onclick="window.toggleReservationForm()">取消</button>
                </div>
                <div id="reservation-list">
                    <div class="loading-placeholder">加载中...</div>
                </div>
            </div>

            <!-- 留言 -->
            <div class="tab-pane" id="tab-feedbacks">
                <div id="feedback-list">
                    <div class="loading-placeholder">加载中...</div>
                </div>
            </div>

            <!-- 基本信息 -->
            <div class="tab-pane" id="tab-info">
                <div class="row g-2">
                    <div class="col-md-6"><label class="form-label">业务类型</label>
                        <select id="business_type" class="form-select">
                            <option value="scenic">景区</option><option value="museum">文博场馆</option>
                            <option value="hotel">住宿</option><option value="restaurant">餐饮</option>
                            <option value="shop">购物</option><option value="entertainment">娱乐</option>
                            <option value="transport">交通</option><option value="other">其他</option>
                        </select>
                    </div>
                    <div class="col-md-6"><label class="form-label">营业状态</label>
                        <select id="status" class="form-select"><option value="open">营业中</option><option value="closed">休息</option></select>
                    </div>
                    <div class="col-md-6"><label class="form-label">电话</label><input id="phone" class="form-control"></div>
                    <div class="col-md-6"><label class="form-label">地址</label><input id="address" class="form-control"></div>
                    <div class="col-md-6"><label class="form-label">停车位</label><input type="number" id="parking" class="form-control"></div>
                    <div class="col-12"><label class="form-label">简介</label><textarea id="intro" class="form-control" rows="2"></textarea></div>
                </div>
                <button class="btn btn-success mt-3" onclick="window.saveInfo()"><i class="fas fa-save"></i> 保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="importmap">
{
    "imports": {
        "./config.js": "./js/config.js",
        "./api.js": "./js/api.js",
        "./auth.js": "./js/auth.js",
        "./merchant.js": "./js/merchant.js"
    }
}
</script>

<script type="module">
import { signIn, signOut, getCurrentUser, onAuthStateChange } from './js/auth.js';
import {
    initMerchant, getMerchantData, loadBusinessData, saveBusinessData,
    fetchReservations, addReservation, updateReservationStatus,
    fetchFeedbacks, replyFeedback, updateInfo, loadPoiList
} from './js/merchant.js';

const loginPage = document.getElementById('login-page');
const main = document.getElementById('main');
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const loginMsg = document.getElementById('login-msg');
const merchantNameSpan = document.getElementById('merchant-name');

let merchant = null;

loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('account').value.trim();
    const pwd = document.getElementById('password').value;
    if (!email || !pwd) {
        loginMsg.textContent = '请输入邮箱和密码';
        return;
    }
    try {
        await signIn(email, pwd);
        loginMsg.textContent = '';
    } catch (e) {
        loginMsg.textContent = '登录失败：' + e.message;
        console.error(e);
    }
});

logoutBtn.addEventListener('click', async () => {
    await signOut();
});

onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN') {
        loginPage.classList.add('hidden');
        main.classList.remove('hidden');
        initMerchantUI();
    } else {
        loginPage.classList.remove('hidden');
        main.classList.add('hidden');
    }
});

(async () => {
    const user = await getCurrentUser();
    if (user) {
        loginPage.classList.add('hidden');
        main.classList.remove('hidden');
        initMerchantUI();
    }
})();

// ★ 优化：并行加载三类数据，页面立即响应
async function initMerchantUI() {
    try {
        merchant = await initMerchant();
        merchantNameSpan.textContent = merchant.display_name || '商户';

        // 显示加载占位
        document.getElementById('business-container').innerHTML = '<div class="loading-placeholder">加载中...</div>';
        document.getElementById('reservation-list').innerHTML = '<div class="loading-placeholder">加载中...</div>';
        document.getElementById('feedback-list').innerHTML = '<div class="loading-placeholder">加载中...</div>';

        // ★ 并行加载：业务数据（本地）、预约、留言
        const businessData = loadBusinessData();
        const [reservationsData, feedbacksData] = await Promise.all([
            fetchReservations().catch(e => { console.warn('预约加载失败:', e); return []; }),
            fetchFeedbacks().catch(e => { console.warn('留言加载失败:', e); return []; })
        ]);

        renderBusiness(businessData.businessCategories, businessData.businessItems);
        renderReservationsList(reservationsData);
        renderFeedbacksList(feedbacksData);
        renderInfo();
    } catch (e) {
        console.error('初始化商户端失败:', e);
        alert('加载失败：' + e.message);
    }
}

function renderBusiness(categories, items) {
    const container = document.getElementById('business-container');
    if (!container) return;
    let html = '';
    categories.forEach(cat => {
        const catItems = items.filter(i => i.category === cat);
        html += `
            <div class="card mb-2">
                <div class="category-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <span>📁 ${cat} (${catItems.length})</span>
                    <span>▼</span>
                </div>
                <div class="hidden p-2">
                    ${catItems.map((item, idx) => `
                        <div class="border-bottom py-1">
                            <div class="d-flex justify-content-between">
                                <span>${item.name} ${item.price || ''}</span>
                                <div>
                                    <button class="btn btn-sm btn-secondary" onclick="window.editItem(${idx})">编辑</button>
                                    <button class="btn btn-sm btn-danger" onclick="window.deleteItem(${idx})">删除</button>
                                </div>
                            </div>
                            ${item.image ? `<img src="${item.image}" class="upload-preview mt-1">` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    });
    container.innerHTML = html || '<p>暂无业务项目</p>';
}

function renderReservationsList(data) {
    const container = document.getElementById('reservation-list');
    if (!container) return;
    const html = (data || []).map(r => `
        <div class="card mb-2">
            <div class="d-flex justify-content-between">
                <span><b>${r.reservation_date}</b> ${r.name}</span>
                <span class="badge ${r.status === 'pending' ? 'bg-warning' : r.status === 'confirmed' ? 'bg-success' : 'bg-secondary'}">${r.status}</span>
            </div>
            <div class="text-secondary">${r.remark || ''}</div>
            ${r.status === 'pending' ? `
                <button class="btn btn-sm btn-success mt-1" onclick="window.confirmReservation(${r.id})">确认</button>
                <button class="btn btn-sm btn-danger mt-1" onclick="window.rejectReservation(${r.id})">拒绝</button>
            ` : ''}
        </div>
    `).join('') || '<p>暂无预约</p>';
    container.innerHTML = html;
}

function renderFeedbacksList(data) {
    const container = document.getElementById('feedback-list');
    if (!container) return;
    const html = (data || []).map(f => `
        <div class="card mb-2">
            <p>${f.message}</p>
            <small>${new Date(f.created_at).toLocaleString()}</small>
            ${f.reply ? `<div class="text-success">回复：${f.reply}</div>` : ''}
            <textarea id="reply-${f.id}" class="form-control mt-1" rows="2">${f.reply || ''}</textarea>
            <button class="btn btn-sm btn-primary mt-1" onclick="window.replyFeedback(${f.id})">回复</button>
        </div>
    `).join('') || '<p>暂无留言</p>';
    container.innerHTML = html;
}

function renderInfo() {
    if (!merchant) return;
    document.getElementById('business_type').value = merchant.business_type || 'other';
    document.getElementById('status').value = merchant.status || 'open';
    document.getElementById('phone').value = merchant.phone || '';
    document.getElementById('address').value = merchant.address || '';
    document.getElementById('parking').value = merchant.parking_spots || 0;
    document.getElementById('intro').value = merchant.intro || '';
}

// ===== 全局函数 =====
window.toggleCategoryPanel = () => document.getElementById('category-panel').classList.toggle('hidden');
window.toggleReservationForm = () => document.getElementById('add-reservation-form').classList.toggle('hidden');
window.addCategory = () => alert('添加分类功能开发中');
window.showAddItemForm = () => alert('添加项目功能开发中');
window.editItem = (idx) => alert('编辑项目功能开发中');
window.deleteItem = (idx) => alert('删除项目功能开发中');
window.saveReservation = () => alert('保存预约功能开发中');
window.confirmReservation = async (id) => {
    try {
        await updateReservationStatus(id, 'confirmed');
        const data = await fetchReservations();
        renderReservationsList(data);
    } catch (e) { alert('操作失败：' + e.message); }
};
window.rejectReservation = async (id) => {
    try {
        await updateReservationStatus(id, 'rejected');
        const data = await fetchReservations();
        renderReservationsList(data);
    } catch (e) { alert('操作失败：' + e.message); }
};
window.replyFeedback = async (id) => {
    const el = document.getElementById(`reply-${id}`);
    if (!el) return;
    try {
        await replyFeedback(id, el.value);
        alert('回复成功');
        const data = await fetchFeedbacks();
        renderFeedbacksList(data);
    } catch (e) { alert('回复失败：' + e.message); }
};
window.saveInfo = async () => {
    try {
        await updateInfo({
            business_type: document.getElementById('business_type').value,
            status: document.getElementById('status').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            parking_spots: parseInt(document.getElementById('parking').value) || 0,
            intro: document.getElementById('intro').value
        });
        alert('保存成功');
    } catch (e) { alert('保存失败：' + e.message); }
};
window.exportReservations = () => alert('导出功能开发中');
</script>
</body>
</html>
