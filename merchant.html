<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商户管理 - 通江文旅</title>
    <style>
        body { font-family: system-ui, sans-serif; background:#f5f5f5; margin:0; }
        .header { background:#1B5E20; color:white; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
        .container { max-width:1000px; margin:20px auto; background:white; padding:20px; border-radius:8px; }
        .tab { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
        .tab button { padding:10px 16px; border:none; background:#e0e0e0; border-radius:4px; cursor:pointer; font-size:14px; }
        .tab button.active { background:#2E7D32; color:white; }
        .form-group { margin:8px 0; }
        label { display:block; margin-bottom:4px; font-weight:500; }
        input, select, textarea { width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; }
        .btn { padding:6px 14px; border:none; border-radius:4px; cursor:pointer; font-size:14px; margin:2px; }
        .btn-primary { background:#2E7D32; color:white; }
        .btn-danger { background:#B71C1C; color:white; }
        .btn-default { background:#e0e0e0; color:#333; }
        .btn-export { background:#ff9800; color:white; }
        .card { border:1px solid #ddd; padding:12px; margin:8px 0; border-radius:8px; background:#fafafa; }
        .hidden { display:none; }
        .item-collapse { margin-bottom:6px; }
        .item-header { display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:500; padding:8px; background:#f0f0f0; border-radius:4px; }
        .item-header span { flex:1; }
        .item-detail { padding:10px; border:1px solid #eee; border-radius:4px; margin-top:4px; background:white; }
        .upload-preview { max-width:200px; max-height:150px; margin-top:4px; border-radius:4px; border:1px solid #ddd; }
        .reservation-card { margin-bottom:8px; }
        .month-group { margin:10px 0; }
        .month-title { font-weight:bold; background:#e9f5ea; padding:8px; cursor:pointer; }
        .category-header { cursor:pointer; background:#f9f9f9; padding:8px; margin:4px 0; border:1px solid #ddd; border-radius:4px; display:flex; justify-content:space-between; }
    </style>
</head>
<body>
<div id="login-page" style="max-width:400px; margin:80px auto; background:white; padding:20px; border-radius:8px;">
    <h2>商户登录</h2>
    <div class="form-group"><input id="account" placeholder="邮箱 (如 st001@st.cn)"></div>
    <div class="form-group"><input id="password" type="password" placeholder="密码"></div>
    <button class="btn btn-primary" onclick="login()" style="width:100%">登录</button>
    <p id="login-msg"></p>
</div>

<div id="main" class="hidden">
    <div class="header"><span id="merchant-name"></span><button class="btn btn-default" onclick="logout()">退出</button></div>
    <div class="container">
        <div class="tab" id="main-tabs">
            <button class="active" onclick="switchTab('business')">📦 业务管理</button>
            <button onclick="switchTab('reservations')">📅 预约列表</button>
            <button onclick="switchTab('feedbacks')">💬 留言</button>
            <button onclick="switchTab('info')">🏪 基本信息</button>
        </div>

        <!-- 业务管理 -->
        <div id="tab-business">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>业务分类与项目</h3>
                <button class="btn btn-default" onclick="toggleCategoryManager()">管理分类</button>
            </div>
            <div id="category-manager-panel" class="hidden card" style="margin-bottom:10px;">
                <div style="display:flex; gap:10px;">
                    <input id="new-category-name-input" placeholder="新分类名称" style="flex:1;">
                    <button class="btn btn-primary" onclick="addBusinessCategory()">添加</button>
                </div>
                <div id="category-list" style="margin-top:8px;"></div>
            </div>
            <div id="business-container"></div>
            <button class="btn btn-primary" onclick="showAddItemForm()" style="margin-top:10px;">+ 添加项目</button>
        </div>

        <!-- 预约列表 -->
        <div id="tab-reservations" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <button class="btn btn-primary" onclick="toggleAddReservationForm()">+ 新增预约</button>
                <div>
                    <button class="btn btn-default" onclick="toggleCategoryManagerForReserve()">活动类别</button>
                    <button class="btn btn-export" onclick="exportReservations()">导出全部</button>
                </div>
            </div>
            <div id="add-reservation-form" class="hidden card" style="margin-bottom:10px;">
                <h4>新增预约</h4>
                <div class="form-group"><label>预约日期</label><input type="date" id="new-res-date"></div>
                <div class="form-group"><label>时段</label><select id="new-res-time">
                    <option value="08:00-09:00">08:00-09:00</option><option value="09:00-10:00">09:00-10:00</option><option value="10:00-11:00">10:00-11:00</option><option value="11:00-12:00">11:00-12:00</option><option value="13:00-14:00">13:00-14:00</option><option value="14:00-15:00">14:00-15:00</option><option value="15:00-16:00">15:00-16:00</option><option value="16:00-17:00">16:00-17:00</option>
                </select></div>
                <div class="form-group"><label>单位（团队）名称</label><input id="new-res-unit"></div>
                <div class="form-group"><label>联系人</label><input id="new-res-name"></div>
                <div class="form-group"><label>联系人电话</label><input id="new-res-phone"></div>
                <div class="form-group"><label>人数</label><input type="number" id="new-res-count" min="1"></div>
                <div class="form-group"><label>活动类别</label><select id="new-res-activity"></select></div>
                <div class="form-group"><label>地点/场地</label><input id="new-res-room"></div>
                <div class="form-group"><label>备注</label><textarea id="new-res-remark" rows="2"></textarea></div>
                <button class="btn btn-primary" onclick="addReservation()">保存预约</button>
                <button class="btn btn-default" onclick="toggleAddReservationForm()">取消</button>
            </div>
            <div id="reservation-list"></div>
        </div>

        <!-- 留言 -->
        <div id="tab-feedbacks" class="hidden">
            <div id="feedback-list"></div>
        </div>

        <!-- 基本信息 -->
        <div id="tab-info" class="hidden">
            <div class="form-group"><label>业务类型</label><select id="business_type">
                <option value="scenic">景区</option><option value="museum">文博场馆</option><option value="hotel">住宿</option><option value="restaurant">餐饮</option><option value="shop">购物</option><option value="entertainment">娱乐</option><option value="transport">交通</option><option value="other">其他</option>
            </select></div>
            <div class="form-group"><label>营业状态</label><select id="status"><option value="open">营业中</option><option value="closed">休息</option></select></div>
            <div class="form-group"><label>电话</label><input id="phone"></div>
            <div class="form-group"><label>地址</label><input id="address"></div>
            <div class="form-group"><label>停车位</label><input type="number" id="parking" min="0"></div>
            <div class="form-group"><label>简介</label><textarea id="intro"></textarea></div>
            <button class="btn btn-primary" onclick="saveInfo()">保存</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let merchant = null;
let businessCategories = [];   // 分类名称数组
let businessItems = [];        // { category: '分类名', name: '', price: '', duration: '', description: '', image: '' }
let activityCategories = [];   // 活动类别（预约用）

// ---------- 会话 ----------
async function checkSession(){
    const { data: { session } } = await sb.auth.getSession();
    if(session){
        const { data: m } = await sb.from('ztj_merchants').select('*').eq('id', session.user.id).single();
        if(m){ merchant = m; showMain(); }
        else { await sb.auth.signOut(); showLogin(); }
    } else showLogin();
}
sb.auth.onAuthStateChange((event, session) => {
    if(event==='SIGNED_IN') checkSession();
    else if(event==='SIGNED_OUT') showLogin();
});
function showLogin(){ document.getElementById('login-page').classList.remove('hidden'); document.getElementById('main').classList.add('hidden'); }
function showMain(){
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    document.getElementById('merchant-name').innerText = merchant.display_name;
    loadBusinessData();
    loadActivityCategories();
    switchTab('business');
}
async function login(){
    const email = document.getElementById('account').value.trim();
    const pwd = document.getElementById('password').value;
    if(!email||!pwd) return;
    const { error } = await sb.auth.signInWithPassword({email, password:pwd});
    if(error) document.getElementById('login-msg').innerText = '登录失败：'+error.message;
}
async function logout(){ await sb.auth.signOut(); showLogin(); }

function switchTab(tab){
    document.querySelectorAll('#main-tabs button').forEach(b => b.classList.remove('active'));
    const tabs = ['business','reservations','feedbacks','info'];
    const idx = tabs.indexOf(tab);
    if(idx>=0) document.querySelectorAll('#main-tabs button')[idx].classList.add('active');
    tabs.forEach(t => document.getElementById('tab-'+t).classList.add('hidden'));
    document.getElementById('tab-'+tab).classList.remove('hidden');
    if(tab==='business') renderBusiness();
    if(tab==='reservations') { loadActivityCategoriesForSelect(); loadReservations(); }
    if(tab==='feedbacks') loadMerchantFeedbacks();
    if(tab==='info') loadInfo();
}

// ---------- 业务管理（多分类） ----------
async function loadBusinessData(){
    // 从 service_data 中读取 categories 和 items
    const sd = merchant.service_data || {};
    businessCategories = sd.businessCategories || [];
    businessItems = sd.businessItems || [];
    // 兼容旧数据：若没有 categories 但存在 items（无分类），则归入“默认分类”
    if(!businessCategories.length && businessItems.length){
        businessCategories = ['默认'];
        businessItems.forEach(item => item.category = '默认');
    }
    renderBusiness();
}

function renderBusiness(){
    const container = document.getElementById('business-container');
    if(!businessCategories.length){
        container.innerHTML = '<p>暂无业务分类，请添加分类和项目</p>';
        return;
    }
    let html = '';
    businessCategories.forEach(cat => {
        const itemsInCat = businessItems.filter(item => item.category === cat);
        html += `<div class="card">
            <div class="category-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                <span>📁 ${cat} (${itemsInCat.length})</span>
                <span>▼</span>
            </div>
            <div class="hidden" style="margin-top:8px;">`;
        if(itemsInCat.length === 0){
            html += '<p>暂无项目</p>';
        } else {
            itemsInCat.forEach((item, idx) => {
                const globalIdx = businessItems.indexOf(item);
                html += `<div class="item-collapse">
                    <div class="item-header" onclick="toggleBusinessItemEdit(${globalIdx})">
                        <span>${item.name||'未命名'} ${item.price ? ' '+item.price : ''} ${item.duration||''}</span>
                    </div>
                    <div id="biz-item-edit-${globalIdx}" class="item-detail hidden">
                        <div class="form-group"><label>名称</label><input id="biz-name-${globalIdx}" value="${item.name||''}"></div>
                        <div class="form-group"><label>价格</label><input type="number" id="biz-price-${globalIdx}" value="${item.price||''}"></div>
                        <div class="form-group"><label>时限/时长</label><input id="biz-duration-${globalIdx}" value="${item.duration||''}"></div>
                        <div class="form-group"><label>描述</label><textarea id="biz-desc-${globalIdx}">${item.description||''}</textarea></div>
                        <div class="form-group"><label>图片</label><input type="file" accept="image/*" onchange="handleBizImageChange(${globalIdx}, this)">
                        ${item.image ? '<img src="'+item.image+'" class="upload-preview">' : ''}</div>
                        <button class="btn btn-primary" onclick="saveBusinessItemEdit(${globalIdx})">保存</button>
                        <button class="btn btn-danger" onclick="deleteBusinessItem(${globalIdx})">删除</button>
                    </div>
                </div>`;
            });
        }
        html += `<button class="btn btn-default" onclick="showAddItemForm('${cat}')" style="margin-top:6px;">+ 添加项目</button>`;
        html += `</div></div>`;
    });
    container.innerHTML = html;
}

function toggleBusinessItemEdit(idx){
    document.getElementById('biz-item-edit-'+idx).classList.toggle('hidden');
}

async function handleBizImageChange(idx, input){
    const file = input.files[0]; if(!file) return;
    const path = `merchant-${merchant.id}/business/${Date.now()}.jpg`;
    const { error } = await sb.storage.from('merchant-uploads').upload(path, file);
    if(error){ alert('上传失败'); return; }
    const { data: { publicUrl } } = sb.storage.from('merchant-uploads').getPublicUrl(path);
    businessItems[idx].image = publicUrl;
    renderBusiness();
}
function saveBusinessItemEdit(idx){
    const item = businessItems[idx];
    item.name = document.getElementById('biz-name-'+idx).value;
    item.price = document.getElementById('biz-price-'+idx).value;
    item.duration = document.getElementById('biz-duration-'+idx).value;
    item.description = document.getElementById('biz-desc-'+idx).value;
    // 图片已在 handleBizImageChange 中更新
    updateMerchantServiceData();
    renderBusiness();
    alert('已保存');
}
function deleteBusinessItem(idx){
    if(!confirm('删除该项目？')) return;
    businessItems.splice(idx, 1);
    updateMerchantServiceData();
    renderBusiness();
}

function showAddItemForm(category){
    // 弹出一个简单的对话框，选择分类后填写项目信息
    const cat = category || (businessCategories.length ? businessCategories[0] : '');
    const html = `
        <div style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.3); z-index:9999; min-width:350px;">
            <h4>新增业务项目</h4>
            <div class="form-group"><label>分类</label><select id="add-item-category">${businessCategories.map(c => `<option value="${c}" ${c===cat?'selected':''}>${c}</option>`).join('')}</select></div>
            <div class="form-group"><label>名称</label><input id="add-item-name"></div>
            <div class="form-group"><label>价格</label><input type="number" id="add-item-price"></div>
            <div class="form-group"><label>时限/时长</label><input id="add-item-duration"></div>
            <div class="form-group"><label>描述</label><textarea id="add-item-desc"></textarea></div>
            <div class="form-group"><label>图片</label><input type="file" accept="image/*" id="add-item-image"></div>
            <button class="btn btn-primary" onclick="confirmAddItem()">添加</button>
            <button class="btn btn-default" onclick="document.getElementById('temp-dialog').remove()">取消</button>
        </div>
    `;
    const div = document.createElement('div');
    div.id = 'temp-dialog';
    div.innerHTML = html;
    document.body.appendChild(div);
}

async function confirmAddItem(){
    const category = document.getElementById('add-item-category').value;
    const name = document.getElementById('add-item-name').value.trim();
    if(!name){ alert('名称必填'); return; }
    const price = document.getElementById('add-item-price').value;
    const duration = document.getElementById('add-item-duration').value;
    const desc = document.getElementById('add-item-desc').value;
    let image = '';
    const file = document.getElementById('add-item-image').files[0];
    if(file){
        const path = `merchant-${merchant.id}/business/${Date.now()}.jpg`;
        const { error } = await sb.storage.from('merchant-uploads').upload(path, file);
        if(!error){
            const { data: { publicUrl } } = sb.storage.from('merchant-uploads').getPublicUrl(path);
            image = publicUrl;
        }
    }
    businessItems.push({ category, name, price, duration, description: desc, image });
    await updateMerchantServiceData();
    document.getElementById('temp-dialog').remove();
    renderBusiness();
}

// 分类管理
function toggleCategoryManager(){
    document.getElementById('category-manager-panel').classList.toggle('hidden');
    renderCategoryList();
}
function renderCategoryList(){
    const container = document.getElementById('category-list');
    if(!businessCategories.length){
        container.innerHTML = '<p>暂无分类</p>';
        return;
    }
    container.innerHTML = businessCategories.map((cat, idx) => `
        <div style="display:flex; justify-content:space-between; margin:4px 0;">
            <span>${cat}</span>
            <button class="btn btn-danger" onclick="deleteCategory(${idx})">删除</button>
        </div>
    `).join('');
}
async function addBusinessCategory(){
    const name = document.getElementById('new-category-name-input').value.trim();
    if(!name) return;
    if(businessCategories.includes(name)){ alert('已存在'); return; }
    businessCategories.push(name);
    await updateMerchantServiceData();
    document.getElementById('new-category-name-input').value = '';
    renderCategoryList();
    renderBusiness();
}
async function deleteCategory(idx){
    const cat = businessCategories[idx];
    if(!confirm(`删除分类“${cat}”？该分类下的项目将归入“默认”分类。`)) return;
    // 迁移项目到“默认”
    if(!businessCategories.includes('默认')){
        businessCategories.push('默认');
    }
    businessItems.forEach(item => {
        if(item.category === cat) item.category = '默认';
    });
    businessCategories.splice(idx, 1);
    await updateMerchantServiceData();
    renderCategoryList();
    renderBusiness();
}

async function updateMerchantServiceData(){
    const sd = merchant.service_data || {};
    sd.businessCategories = businessCategories;
    sd.businessItems = businessItems;
    // 同时保留旧版 items 和 categories 兼容游客端（游客端只读 items）
    sd.items = businessItems.map(item => ({
        name: item.name,
        price: item.price,
        duration: item.duration,
        description: item.description,
        image: item.image
    }));
    sd.categories = activityCategories; // 活动类别（预约用）
    const { error } = await sb.from('ztj_merchants').update({ service_data: sd }).eq('id', merchant.id);
    if(!error) merchant.service_data = sd;
}

// ---------- 活动类别（预约用） ----------
async function loadActivityCategories(){
    if(merchant.service_data && merchant.service_data.categories){
        activityCategories = merchant.service_data.categories;
    } else {
        activityCategories = [];
    }
}
function toggleCategoryManagerForReserve(){
    // 简单折叠管理，复用界面
    const panel = document.getElementById('category-manager-panel');
    panel.classList.toggle('hidden');
    if(!panel.classList.contains('hidden')){
        renderActivityCategoryList();
    }
}
function renderActivityCategoryList(){
    const container = document.getElementById('category-list');
    if(!activityCategories.length){
        container.innerHTML = '<p>暂无活动类别</p>';
        return;
    }
    container.innerHTML = activityCategories.map((cat, idx) => `
        <div style="display:flex; justify-content:space-between; margin:4px 0;">
            <span>${cat}</span>
            <button class="btn btn-danger" onclick="deleteActivityCategory(${idx})">删除</button>
        </div>
    `).join('');
}
async function addActivityCategory(){
    const name = document.getElementById('new-category-name-input').value.trim();
    if(!name) return;
    if(activityCategories.includes(name)){ alert('已存在'); return; }
    activityCategories.push(name);
    await updateMerchantServiceData();
    document.getElementById('new-category-name-input').value = '';
    renderActivityCategoryList();
    loadActivityCategoriesForSelect();
}
async function deleteActivityCategory(idx){
    activityCategories.splice(idx, 1);
    await updateMerchantServiceData();
    renderActivityCategoryList();
    loadActivityCategoriesForSelect();
}
async function loadActivityCategoriesForSelect(){
    await loadActivityCategories();
    const sel = document.getElementById('new-res-activity');
    if(sel){
        sel.innerHTML = '<option value="">--选择--</option>';
        activityCategories.forEach(cat => {
            sel.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
    }
}

// ---------- 预约列表（月分组，最新在上） ----------
async function loadReservations(){
    const { data } = await sb.from('reservations').select('*').eq('merchant_id', merchant.id).order('created_at', false);
    const container = document.getElementById('reservation-list');
    if(!data || data.length === 0){
        container.innerHTML = '<p>暂无预约</p>';
        return;
    }
    // 按月分组
    const grouped = {};
    data.forEach(r => {
        const date = new Date(r.created_at);
        const key = `${date.getFullYear()}年${date.getMonth()+1}月`;
        if(!grouped[key]) grouped[key] = [];
        grouped[key].push(r);
    });
    let html = '';
    for(const [month, records] of Object.entries(grouped)){
        html += `<div class="month-group">
            <div class="month-title" onclick="this.nextElementSibling.classList.toggle('hidden')">
                📅 ${month} (${records.length}条) <span>▼</span>
            </div>
            <div class="hidden">`;
        records.forEach((r, idx) => {
            let category = '';
            if(r.remark && r.remark.includes('类别：')) {
                category = r.remark.split('类别：')[1]?.split('|')[0] || '';
            }
            html += `<div class="reservation-card card">
                <div class="item-header" onclick="toggleReservationDetail(${r.id})">
                    <span>${r.reservation_date} | ${r.time_slot_start}-${r.time_slot_end||''} | ${category||'未分类'} | 联系人：${r.name}</span>
                </div>
                <div id="res-detail-${r.id}" class="item-detail hidden">
                    <p><b>活动类别：</b>${category||'未指定'} <b>地点：</b>${r.room||''}</p>
                    <p><b>联系人：</b>${r.name} ${r.phone}</p>
                    <p><b>单位：</b>${r.unit||''} <b>人数：</b>${r.visitor_count}</p>
                    <p><b>备注：</b>${r.remark ? r.remark.replace('类别：'+category+'|', '').replace('类别：'+category, '') : ''}</p>
                    ${r.image ? `<img src="${r.image}" class="upload-preview">` : ''}
                    <p><b>状态：</b>${r.status}</p>
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                        ${r.status==='pending' ? `<button class="btn btn-primary" onclick="updateReservation(${r.id},'confirmed')">确认</button><button class="btn btn-danger" onclick="updateReservation(${r.id},'rejected')">拒绝</button>` : ''}
                    </div>
                </div>
            </div>`;
        });
        html += `</div></div>`;
    }
    container.innerHTML = html;
}
window.toggleReservationDetail = function(id){
    document.getElementById('res-detail-'+id).classList.toggle('hidden');
};
async function updateReservation(id, status){ await sb.from('reservations').update({status}).eq('id',id); loadReservations(); }

function toggleAddReservationForm(){
    document.getElementById('add-reservation-form').classList.toggle('hidden');
    loadActivityCategoriesForSelect();
}
async function addReservation(){
    const date = document.getElementById('new-res-date').value;
    const timeRange = document.getElementById('new-res-time').value;
    const [start, end] = timeRange.split('-');
    const name = document.getElementById('new-res-name').value.trim();
    const phone = document.getElementById('new-res-phone').value.trim();
    const unit = document.getElementById('new-res-unit').value.trim();
    const count = parseInt(document.getElementById('new-res-count').value) || 0;
    const activity = document.getElementById('new-res-activity').value;
    const room = document.getElementById('new-res-room').value.trim();
    const remarkBase = document.getElementById('new-res-remark').value.trim();
    let finalRemark = '';
    if(activity) finalRemark += `类别：${activity}`;
    if(remarkBase) finalRemark += (finalRemark ? '|' : '') + remarkBase;
    if(!date||!timeRange||!name||!phone){ alert('请填写必填项'); return; }
    const { error } = await sb.from('reservations').insert({
        merchant_id: merchant.id,
        reservation_date: date,
        time_slot_start: start,
        time_slot_end: end,
        name, phone, unit, visitor_count: count,
        remark: finalRemark,
        room: room,
        status: 'pending',
        user_id: 'manual'
    });
    if(error){ alert('保存失败：'+error.message); return; }
    document.getElementById('new-res-date').value='';
    document.getElementById('new-res-time').value='08:00-09:00';
    document.getElementById('new-res-name').value='';
    document.getElementById('new-res-phone').value='';
    document.getElementById('new-res-unit').value='';
    document.getElementById('new-res-count').value='';
    document.getElementById('new-res-activity').value='';
    document.getElementById('new-res-room').value='';
    document.getElementById('new-res-remark').value='';
    toggleAddReservationForm();
    loadReservations();
}

// 导出 CSV
function exportReservations(){
    sb.from('reservations').select('*').eq('merchant_id', merchant.id).order('created_at', false).then(({ data }) => {
        if(!data || data.length===0){ alert('无预约记录'); return; }
        const header = '日期,时段,单位,联系人,电话,人数,活动类别,地点,状态,备注\n';
        const csv = data.map(r => {
            let category = '';
            let remark = r.remark || '';
            if(remark.includes('类别：')){
                category = remark.split('类别：')[1]?.split('|')[0] || '';
                remark = remark.replace('类别：'+category+'|', '').replace('类别：'+category, '');
            }
            return `${r.reservation_date},"${r.time_slot_start}${r.time_slot_end ? '~'+r.time_slot_end : ''}","${r.unit||''}","${r.name}","${r.phone}",${r.visitor_count},"${category}","${r.room||''}",${r.status},"${remark}"`;
        }).join('\n');
        const blob = new Blob([header + csv], {type:'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `预约记录_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    });
}

// ---------- 留言 ----------
async function loadMerchantFeedbacks(){
    const { data } = await sb.from('ztj_feedbacks').select('*').eq('merchant_id', merchant.id).order('created_at', false);
    let html = '';
    data.forEach(f=>{
        html += `<div class="card"><p>${f.message}</p><small>${new Date(f.created_at).toLocaleString()}</small><p>${f.reply||'暂未回复'}</p><textarea id="reply-${f.id}">${f.reply||''}</textarea><button class="btn btn-primary" onclick="replyFeedback(${f.id})">回复</button></div>`;
    });
    document.getElementById('feedback-list').innerHTML = html || '<p>暂无留言</p>';
}
async function replyFeedback(id){
    const reply = document.getElementById('reply-'+id).value;
    await sb.from('ztj_feedbacks').update({reply}).eq('id',id);
    loadMerchantFeedbacks();
}

// ---------- 基本信息 ----------
function loadInfo(){
    document.getElementById('business_type').value = merchant.business_type || 'other';
    document.getElementById('status').value = merchant.status || 'open';
    document.getElementById('phone').value = merchant.phone || '';
    document.getElementById('address').value = merchant.address || '';
    document.getElementById('parking').value = merchant.parking_spots || 0;
    document.getElementById('intro').value = merchant.intro || '';
}
async function saveInfo(){
    const updates = {
        business_type: document.getElementById('business_type').value,
        status: document.getElementById('status').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        parking_spots: parseInt(document.getElementById('parking').value)||0,
        intro: document.getElementById('intro').value
    };
    const { error } = await sb.from('ztj_merchants').update(updates).eq('id', merchant.id);
    if(!error) { Object.assign(merchant, updates); alert('已保存'); }
    else alert('保存失败：'+error.message);
}
